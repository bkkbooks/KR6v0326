body:
  text: 民國湯薌銘譯纂今釋戒品總標二門一釋嗢柁南所攝二釋嗢柁南中事義一釋嗢柁南所攝云何菩薩戒波羅密多嗢柁南曰自性一切難一切門善士一切種遂求二世樂清淨如是九種相是名略説戒謂九種相戒名為菩薩戒波羅密多一自性戒二一切戒三難行戒四一切門戒五善士戒六一切種戒七遂求戒八此世他世樂戒九清淨戒考藏本云嗢柁南曰自性及一切艱難與普門善丈夫相應一切種亦爾損求俱成就此世他世樂極清淨九種是名略説戒此中何等是菩薩戒當知九種謂戒自性一切戒艱難戒普門戒善丈夫戒一切種戒損求戒除遣有損成就所求名損求戒如忍品遂求忍中云若於有情有損惱者由忍故離若於有情是所求者由忍故與此世他世樂戒極清淨戒自性戒者謂戒總相一切戒者謂廣分別戒中事品難行戒者謂依趣入難成辦故不共差別此有三難初一是受時艱難後二是護時艱難一切門戒者謂從何門或云何相入戒差別善士戒者謂行持者所依差別一切種戒者謂廣開合戒中種類遂求戒者謂由所作善息滅苦境與所作二種差別境有自他二種差別所作復有八有損事八所求事二種差別此世他世樂戒及清淨戒者謂依次第斷證差別令果差別故如是九種初一是戒自性非戒故不言果所餘八戒一一皆有所感得果詳於本論四十三卷上來釋嗢柁南所攝已嗢柁南者最勝子釋論云先略頌答略集名數施諸學者名嗢柁南義淨三藏於根本一切有部中則取義譯名總攝頌二釋嗢柁南中事義有六一略詮自性戒二廣釋一切戒三分釋一切戒中所分出戒四釋戒勝利五釋戒所攝六釋戒所作初略詮自性戒有二一自性二功能初自性有四功德名數功德作用功德因果功德定數一功德名數云何菩薩自性戒謂若略説具四功德當知是名菩薩自性戒何等為四一從他正受二善淨意樂三犯已還淨四深敬專念無有違犯二功德作用由諸菩薩從他正受故於所學戒若有違犯即外觀他深生愧恥由諸菩薩善淨意樂故於所學戒若有違犯即內自顧深起慚羞由諸菩薩於諸學處犯已還淨深敬專念初無違犯二因緣故離諸惡作如是菩薩從他正受善淨意樂為依止故生起慚愧由慚愧故能善防護所受尸羅由善防護所受戒故離諸惡作諸心焦灼懊變惡作心追悔性是謂惡作由諸菩薩從他正受於所學戒若近犯緣即外念他呵責匪宜便於惡行生起愧恥由諸菩薩善淨意樂於所學戒若近犯緣即內自顧自法因緣便於惡行生起慚羞由犯已還淨初無違犯二因緣故令無追悔謂依如是從他正受善淨意樂隨行所生慚羞愧恥即便能以初無違犯及既犯已還淨之門防護其戒由善防護所受戒故不復觀見有罪隨行令無追悔以是而言諸受律儀者應以如理通達之慧於自相續盡力觀察亦不見有若粗若細諸罪隨行生起至極清淨相續無追悔意此亦從初勵令不犯若時誤由失念等犯即便速疾令念安住應依發露悔除後堅守護等法令其還淨然能此者應有極大慚愧相應若為令生慚羞愧恥初受戒時所從受境應是唯一具足實相大善知識能受意樂應自至誠非是為隨逐他轉等非是為求資活命等下劣意樂以勝意樂而求受戒故於如是始初二因當善專注有疏説云此四功德初一為受後三為護本論則説初二功德是能防護淨戒之因菩薩律儀二十頌亦云此以勝妙淨意樂從彼安住於律儀善巧有能上師受是故初二功德受品所攝後二功德護品所攝當知此戒若不會遇具德上師即得觀想諸佛菩薩現臨在前而自受之亦能發戒此説從他而正受者謂若有師可能會遇定應訪求彼善知識從其正受如是受者於護學處易得生起歡喜恭敬由是令成清淨戒故大乘集菩薩學論中亦如是説三功德因果又於是中從他正受善淨意樂此二是法犯已還淨深敬專念無有違犯此二是前二法所引前二功德能引後二是故當知前二是因後二是果引發之理如前已説四功德定數又於是中從他正受善淨意樂深敬專念無有違犯由此三法應知能令不毀菩薩所受淨戒犯已還淨由此一法應知能令犯已還出問何緣決定四種功德答為令尸羅能極清淨定須從初令不染犯及既犯已令其還淨如是二事是故依止從他正受善淨意樂深敬專念無有違犯如是三法令不違犯復依犯已還淨一法令其還復從罪中出由是因緣決定為四諸餘疏中攝四功德有四種説第一説云初一功德為受後三功德隨護所受第二説云意樂功德有一加行功德有三第三説云善淨意樂為受餘三是戒自性所言受者復有三受一者為令自己語言信重二者令作餘人勝福德田三者為令證得大自在主遠離損惱諸有情故所言餘三是戒自性者亦復有三一所受戒二所還淨戒三所防護戒第四説云二為淨戒之因二為淨戒之果二功能有四一妙善二無量三饒益四大果勝利一妙善如是菩薩具四功德自性尸羅應知即是妙善淨戒正受隨學能利自他利益安樂無量衆生哀愍世間諸天人等令得義利利益安樂故自性尸羅即自性戒考藏本云正受隨學此具四德菩薩戒性能利益自能利益他利益衆生安樂衆生哀愍世間於諸天人令得義利令得利益令安樂故應知妙善問正受隨學此能具足四功德戒有何功能答謂有能利自他利益安樂等事初説能利自於中聲聞能利自者覺了聖諦為令證得永斷煩惱及諸苦故少事少業唯修於自寂靜調伏一切菩薩能利自者二斷二智謂煩惱障斷所知障斷煩惱障斷故畢竟離垢一切煩惱不隨縛智所知障斷故於一切所知無礙無障智次説能利他菩薩當其初發心時趣入能利有姓無姓二種有情言能利無姓有情者初説利益無量衆生謂暫濟拔令出惡趣于諸不善若未生者不令生起其已生者令其斷捨次説安樂無量衆生謂令彼等安處樂趣於諸善法未生令生已生令長次説哀憫世間謂於無姓無量衆生就中多分懷瞋憎背定無堪能雖已成器顛倒隕墜奔往惡趣猶如過客不捨利益安樂意樂期待時劫言能利有姓有情者初説諸天人等令得義利謂能安處諸有姓者於沙門性即十地中修行三學之道如俱舍論云契經説此差別有四理實就位有八十九皆解脫道擇滅為性謂為永斷見所斷惑有八無間八解脫道及為永斷修所斷惑有八十一無間八十一解脫道諸無間道唯沙門性本論攝事分云若約真實沙門性言建立八支聖道即是沙門性義又聲聞地云已永斷滅見道所斷一切煩惱唯餘修道所斷煩惱為斷彼故修習三蘊所攝八支聖道此中正見正思維正精進慧蘊所攝正語正業正命戒蘊所攝正念正定定蘊所攝依奘師譯名沙門性若依藏言名沙門位謂是見道修道所修次説諸天人等令得利益謂令修習初資糧道及加行道以此引入彼沙門性次説諸天人等令得安樂謂以輕安身心賾悅能令彼等現法樂住又令究竟嘗解脫樂由是因緣説為妙善言妙善者謂無欺誑自餘疏中多立異門今不採用論中數見此段文句譯文雖異然皆説為令諸天人未有等字如卷三十五自他利品中云言勝行者謂諸菩薩亦能自利亦能利他利益安樂無量衆生哀愍世間令諸天人獲得勝義利益安樂又卷三十八菩提品中云由諸如來自利利他利益安樂無量衆生哀愍世間令諸天人獲得義利利益安樂而行正行二無量應知即是無量淨戒攝受無量菩薩所學故考藏本云總攝菩薩無量所學應知無量謂攝菩薩無量學處三饒益應知即是饒益一切有情淨戒現前能作一切有情利益安樂故考藏本云現前安住利益安樂一切有情故應知即是饒益有情謂於趣入時即因位或於果時皆能安住利益安樂諸有情故四大果勝利應知即是能獲大果勝利淨戒攝受隨與無上正等菩提果故是名菩薩自性戒考藏本云攝受隨與無上正等菩提果故應知大果及大勝利又藏本無是名菩薩自性戒一語緣後四種是説正受隨學自性戒已所有功能非自性戒謂菩薩位中能自攝受大菩提果是名大果正覺位中隨與他果名大勝利菩薩唯由所具淨戒即有三善謂初發心時能利自他乃至廣説是為初善饒益有情是為中善大果勝利是為後善非如聲聞須具三學乃得説為初中後善二廣釋一切戒有三一釋所受戒二釋受戒法三釋防護法初復有四一分別二自性三具足因緣四總結事義一分別云何菩薩一切戒謂菩薩戒略有二種一在家分戒二出家分戒是名一切戒又即依此在家出家二分淨戒略説三種一律儀戒二攝善法戒三饒益有情戒此中有二一依身分別依身品類雖有多種總攝為二謂在家菩薩品所攝出家菩薩品所攝屬彼等身所有淨戒名一切戒謂是在家出家諸菩薩身所學戒故最勝子云三種趣中若諸惡趣及彼天趣有法爾得是在家戒在人趣中有二分戒又薩穆札疏云若在惡趣及色界中無從他受有法爾得即在家戒欲界天人有法爾得及從他受是故此有在家出家二分淨戒此戒名為菩薩律儀歿亦不失在在生處法爾能得以要言之菩薩律儀死後隨行通於三趣為所共許而開在家出家二分戒者由諸菩薩或是俱行或不俱行勤策男等五部出家律儀故二自性分別又即依此在家出家二分淨戒攝為三種一律儀戒二攝善法戒三饒益有情戒謂此三種總攝菩薩所應防護一切戒故何緣淨戒立為三種在諸疏中有二種説有説為令順合聲聞乘中三律儀數謂別解脫律儀損伏煩惱靜慮律儀損伏一切犯戒種子不令暫起無漏律儀永害一切惡戒種子有説菩薩所作盡於二種謂令成熟自內相續及他相續於自成熟定須遠離惡行攝集妙行二事即律儀戒攝善法戒於成熟他定須饒益有情淨戒故定為三如是二説後為應理何緣決定三戒次第如薩穆札疏云與聲聞共遠離戒者律儀戒異名本論八十三卷云律儀者謂是遠離自體相故五十三卷云若正攝受遠離戒時名攝受律儀是後二因其轉作戒戒品云轉作戒者攝一切善故饒益有情故此戒正譯應云趣入戒以此是受趣入心後所學戒故後當廣釋則不與共轉作戒者謂自未度而欲度他不應道理如經説云自未寂靜即便不能令他寂靜故先未修攝一切善便不能作饒益有情由是定為三戒次第如是説者至為應理二自性有三一律儀戒二攝善法戒三饒益有情戒一律儀戒律儀戒者謂諸菩薩所受七衆別解脫律儀即是苾芻戒苾芻尼戒正學戒勤策男戒勤策女戒近事男戒近事女戒如是七種依止在家出家二分如應當知是名菩薩律儀戒律儀戒者謂七衆別解脫律儀即是苾芻戒苾芻尼戒正學女戒勤策男戒勤策女戒屬出家品近事男戒近事女戒屬在家品又別解脫原有八分今茲不列近住分者謂如菩薩律儀二十頌釋難云唯於一晝夜受持者非難行故非是究竟俱離欲故非久遠時能相繼故非此所應是以不説別如薩穆札疏中云言近住者近事男女所正安住攝近事中故爾不列則不應理如俱舍論十四卷云別解脫律儀雖有八名實體唯四應知此中如數次第依四遠離立四律儀謂受離五所應遠離安立第一近事律儀何等名為五所應離一者殺生二不與取三欲邪行四虛誑語五飲諸酒若受離八所應遠離安立第二近住律儀何等名為八所應離一者殺生二不與取三非梵行四虛誑語五飲諸酒六塗飾香鬘舞歌觀聽七眠坐高廣嚴麗牀座八食非時食若受離十所應遠離安立第三勤策律儀何等名為十所應離謂於前八塗飾香鬘舞歌觀聽開為二種復加受畜金銀等寶以為第十若受離一切應離身語業安立第四苾芻律儀問為是七衆別解脫外別有抑無菩薩律儀戒耶若別有者即與菩薩地説相違菩薩地中除此七衆未説餘故若別無者則別解脫命終即捨如是雖具菩薩律儀命終已後失律儀戒天身菩薩不堪能得期學三戒菩薩律儀要期修學三種戒聚乃得名為菩薩律儀如本論七十五卷攝決擇分云若有於此三種所受菩薩戒中隨有所闕當言不護菩薩律儀又三戒聚名為菩薩律儀亦如七衆戒聚即名別解脫律儀答若是出家隨行菩薩律儀隨其五衆別解脫分各依所已受者即律儀戒若是在家近事男女隨行菩薩律儀隨其二衆別解脫分或先已受或未曾受各隨依身所應一分為律儀戒若彼天人其身不堪任別解脫然是隨行菩薩律儀如所遠離十種不善或如遠離身語不善七種遠離一切遠離性罪共於七衆別解脫分是律儀戒非是純一別解脫律儀道炬論疏亦如是説如彼疏云此中所云律儀戒者謂是防護制罪之七衆別解脫律儀及防護性罪戒防護十不善戒初是純一別解脫分後者唯是共於七衆別解脫故牟尼密意莊嚴論中亦同此説謂彼論云律儀戒者是止息戒本品云止息戒者遠離一切殺生等故謂以七種遠離為相無貪無瞋正見三法為其等起同論又云當知此戒與等起俱增上力故便得成為十善業道菩薩律儀二十頌釋難亦云如菩薩地説七衆別解脫即是菩薩律儀戒此中義者當知即以別解脫律儀成為菩薩律儀支中一分以是義故若已別具別解脫律儀雖成正受菩薩律儀之器亦當復授此中菩薩所學文句此中非是別有止息殺生等軌若尚不止殺生等事未有能成正受菩薩律儀之器意謂不求止殺生等非是堪能發起菩薩律儀之器又其止息殺生等相共別解脫故謂菩薩地中所説是以七衆別解脫成為菩薩律儀一分如後所言諸具菩薩律儀者雖有分位開殺生等身語七支而亦無與別解脫遠離殺生等有不共過譬除酒外有諸制罪雖得開許患病苾芻然依總則一切具苾芻律儀者皆應遮制又如正受苾芻律儀應為勤求遠離一切不應作事非為擇一支分而受故身語七除有分位得開聽外如別解脫寧捨生命要期防護不令現行復次道炬論云七種別解脫律儀與餘律儀恆相應菩薩律儀堪任者所餘一切皆非是此頌所示初修業者若無隨一七衆別解脫即不堪任發起殊勝戒律儀者是謂若無共於七衆別解脫遠離性罪不堪發起菩薩律儀非謂若無唯一實相七衆別解脫便不發起菩薩律儀道炬論疏云今為顯示具別解脫是戒律儀殊勝依身此義在昔有二宗派有説應依別解脫者謂應依止於別解脫乃能發起菩薩律儀及能安住菩薩律儀有説不依別解脫者執別解脫是聲聞戒謂能障礙菩薩律儀應依者云菩薩別解脫者契經所説是大小二乘各有七衆別解脫唯不損他總相七衆別解脫是所應依謂饒益中即已包含不損惱故然二種乘中別解脫有所別者謂以自爾相續將護他心犯可還淨希求利他勝善意樂判為一類及此相違為別一類故不應有無別之共若依小乘之別解脫則是相違大乘別解脫者正是菩薩所應學處自為自依亦有相違無是過失寶雲經云小乘別解脫律儀與菩薩學為異類故然於大乘七衆戒中若為正受若防護等一切應依調伏中説本論七十八卷攝決擇分菩薩地云曼殊室利若於是處我依聲聞及諸菩薩顯示別解脫及別解脫相應之法是名調伏世尊菩薩別解脫幾相所攝善男子當知七相一者宣説受軌則事故二者宣説隨順他勝事故三者宣説隨順毀犯事故四者宣説有犯自性故五者宣説無犯自性故六者宣説出所犯故七者宣説捨律儀故此依七相説明調伏此調伏者他論別名毗奈耶藏上來所説不應道理若謂菩薩律儀應以七衆別解脫為發起依則諸天人不應發起菩薩律儀若謂應以別解脫為安住依則死歿已相續不捨天與旁生亦復應有苾芻等衆此如牟尼密意莊嚴論亦謂不須別解脫為菩薩律儀發起所依如彼論云若謂近事男近事女勤策男勤策女正學女苾芻苾芻尼各應盡壽隨其所應住於七衆別解脫律儀乃可從受菩薩律儀若不如是不發菩薩律儀故如是言者是未通達大乘經義若謂無別解脫律儀不能發起菩薩律儀者則是爾時菩薩藏中及其論疏應當説言此別解脫為彼菩薩律儀根本復應説言決定當依於別解脫猶如大乘菩提道中決定當依歸趣三寶是故菩薩地中闡明律儀戒時説為即是七衆別解脫者當知所説俱通二分謂純一七衆別解脫及別解脫與律儀戒二中所共遠離性罪不應執為單指七衆此中共別解脫遠離性罪之律儀戒與其所受菩薩律儀平等發起是故彼與菩薩律儀不事計別能依所依雖未先受純一七衆別解脫亦能發起菩薩律儀然若依身有別解脫如法堪任謂當先受在家出家隨一別解脫若不爾者便於如來聖教次第有踰越故譬如未受勤策律儀即便直受苾芻律儀雖能發戒然不應爾不依者云若未除遣自利意樂不能發起菩薩律儀是即名為發起之障若先已具菩薩律儀而復發起自利意樂便壞律儀是即名為安住之障此由未明別解脫律儀小乘意樂二者區別起誤解故謂於發起菩薩律儀雖應棄捨小乘意樂然別解脫非所應捨若先已具大乘律儀而乃發起小乘意樂雖壞大乘然未棄捨其別解脫以別解脫兩乘共故由彼意樂便可棄捨於別解脫不應理故又若其身先時已具別解脫律儀而來正受上部律儀身圓滿故由此道理若謂安住上部律儀便令棄捨初部律儀即是斷毀佛教根株使彼利樂衆生禾稼遭大冰雹是邪分別未解上部初部經典真義理門當永棄捨制止如是邪分別故如聖三律儀經云常應順奉如前所説別解脫教護光世若有人於別解脫起違背想則為於佛力無所畏而生違背彼若於佛力無所畏生違背者則於去來現在諸佛而生違背由此未來所受異熟無量大苦假使三千大千世界一切衆生受地獄苦比前衆生所受苦毒百分不及一千分不及一百千俱胝乃至算數譬喻塢波尼殺曇分亦不及一若欲遠離如是苦惱應當遠離如是種類惡行苾芻縱遠相去千踰繕那亦應遙避何況近耶若但聞名尚應棄捨何況見聞而不遠離伽濕彌羅善逝寶頂吉祥智友尊者亦於下劣邪分別説力破廣釋引申正義謂如不違尸羅律儀本誓論云最初依出家安住顯密道後以愚暗故所依調伏論聲聞等律儀別解脫問年此有二部謂勤策最初問年及苾芻最初問年中所説學處多不能守護復執聲聞律違異菩薩戒乃住菩薩戒而捨出家律又云捨出家律儀便於顯密戒亦不堪受持又云具慧覺者最殊勝菩提薩埵大苾芻一切時處方便巧夢中亦不思違越多契經中亦廣説諸轉輪聖王在家菩薩久遠已來學菩薩行尚復捨家希求出家受近圓戒是故一切住大乘者總應於別解脫尤應於中出家律儀愛護受持二攝善法戒有三一略標二廣釋三總結一略標攝善法戒者謂諸菩薩受律儀戒後所有一切為大菩提由身語意積集諸善總説名為攝善法戒藏本依從梵論原文譯為正受戒後宗師謂有多論疏中釋為正受律儀戒後本論譯文亦遵其義此中有三一者時即受戒後如經中云隨所修集一切善法由安住戒是説唯由安住淨戒乃能生起善法安住善法增長善法故此中義者謂正受菩薩律儀已乃能令其攝一切善是故於初應當堅固其律儀戒二者所緣即是為大菩提謂為成熟自內佛法是故今茲攝善法戒為自成熟後戒所説饒益有情為成熟他是即二戒所緣差別三者自相即是由身語意積集諸善謂由三門各別所作或復身語二門所作或復俱通三門所作是即名為攝善法戒梵本原文但言身語而無意字別有疏云不説意者謂於攝善法戒位中唯身語戒故然大疏中則多説為應有意善德光疏中亦説有意謂説身語便能推知包含意字故未説意此説可據又菩薩律儀二十頌釋難與道炬疏皆謂論文當有意字本論譯文亦遵其義故添意字二廣釋有八一生起三慧二於勝福田積集資糧三隨喜功德及有德者四習近安忍五回向發願六供養三寶七住不放逸八習資糧道所依善法一生起三慧此復云何謂諸菩薩依戒住戒於聞於思於修止觀於樂獨處精勤修學謂諸菩薩依止安住律儀戒已以無散亂諦聽正法而求聞慧於所積集多聞資糧簡擇通達而起思慧次修止觀趣入修慧此亦觀待身離暗閙心離諸惡不善尋思而樂獨處律儀二十頌釋難則以於樂獨處説為一向愛樂此中修止即是定學其聞思慧及修觀者即是慧學謂從尸羅引發二學二於勝福田積集資糧如是時時於諸尊長精勤修習合掌起迎問訊禮拜恭敬之業即於尊長勤修敬事於疾病者悲愍殷重瞻侍供給遙見尊長離傲逸相悅豫歡慶讚言善來出誠實語或恭敬語身行禮拜起身備座為表恭敬疾起承迎次若漸近見至面前問訊合掌或供役使恭敬承事又於病者悲憫瞻侍此有三田一謂有恩二謂師長一二兩種俱名尊長三謂有苦初即父母次即親教軌範二師後即病人謂是在家出家二衆菩薩生起福德所依之處故名福田三隨喜功德及有德者於諸妙説施以善哉於有功德補特伽羅真誠讚美於十方界一切有情一切福業以勝意樂起淨信心發言隨喜若有能於如來善説無倒宣説有於三寶發語讚頌作妙説者施以善哉於彼具足聞等功德補特伽羅真誠讚美於諸有情一切福善以勝意樂發言隨喜又了知他能作福田深心歡喜遠離嫉妬雖自未作亦能獲得與自作等一切福德令隨彼等福善轉故復當慶幸自有所作四習近安忍於他所作一切違犯思擇安忍於他所作一切損惱方便思擇視為夙業起深悲愍不還以忿不報侵犯五回向發願以身語意已作未作一切善根回向無上正等菩提時時發起種種正願為令所作不壞失故為令引生異類福德故已作未作三業諸善回向無上最勝菩提又為引發無量功德時時發起十地經説十種大願或發普賢行願勝王本論四十五卷菩提分品中廣明菩薩所修正願六供養三寶以一切種上妙供具供佛法僧於三寶所以一切種財物正行二種供養而作供養又能興起廣大供養上妙非劣財物供養者如本論四十四卷供養親近無量品云若諸菩薩於如來所若制多所以諸衣服飲食臥具病緣醫樂供身什物敬問禮拜奉迎合掌種種熏香末香塗香華鬘妓樂幢蓋幡燈歌頌稱讚五輪歸命趨繞右旋而為供養或復奉施無盡財供或復奉施末尼真珠琉璃螺貝璧玉珊瑚硨磲碼瑙琥珀金銀赤珠右旋如是等寶或復奉施末尼環玔寶璩印等諸莊嚴具乃至奉施種種寶鈴或散珍奇或纏寶縷而為供養是名菩薩於如來所若制多所財敬供養正行供養者彼品又云若諸菩薩少時少時須臾須臾乃至下如搆牛乳頃普於一切蠢動有情修習慈愍喜捨俱心於一切行修無常想無常苦想苦無我想於其涅槃修勝利想於佛法僧波羅密多修習隨念少時少時須臾須臾於一切法發生少分下劣忍智信解離言法性真如起無分別無相心住何况於此若過若增如是守護菩薩所受尸羅律儀於奢摩他毗鉢舍那菩提分法精勤修學亦於一切波羅蜜多及諸攝事正勤修學是名菩薩於如來所正行供養廣大供養者彼品又云若多供具若妙供具若現在前不現在前若自造作教他造作若淳淨心猛利勝解現前供養即以如是所種善根回向無上正等菩提如是七種説名菩薩廣大供養又云如是供養佛如是供養若法若僧隨其所應當知亦爾七住不放逸於諸善品恆常勇猛精進修習於身語意住不放逸恆常無間發大精進趣修六度一切善品八習資糧道所依善法於諸學處正念正知正行防守密護根門於食知量初夜後夜常修覺悟親近善士依止善友於自愆犯審諦了知深見過失既審了知深見過已其未犯者專意護持其已犯者於佛菩薩同法者所至心發露如法悔除於諸學處意能正念正知相應身語正行而遍防守若不護根即便隨逐諸可意境不可意境生起貪瞋為令護心密護根門又若過飽或過飢者即便無力策發精進安住身故不墮二邊適可而食名食知量又於夜中分作三分中夜寢臥初夜後夜及晝日分或作誦持或作觀修是名初夜後夜恆常悎寤勤修觀行又當親近進修諸善除遣不善助益善士如集異門論云復次諸有補特伽羅具戒具德離諸瑕穢成調善法堪紹師位成就勝德知羞悔過善守好學具知具見樂思擇愛稱量喜觀察性聰敏具覺慧息追求有慧類離貪趣貪滅離瞋趣瞋滅離癡趣癡滅調順趣調順寂靜趣寂靜解脫趣解脫具如是等諸勝功德是名善士若能於此所説善士親近承事恭敬供養如是名為親近善士復應依止授經法等諸善知識此即本論四十四卷供養親近無量品中所言親近善友如彼品云當知菩薩由四種相方得圓滿親近善友一於善友有病無病隨時供侍恆常發起愛敬淨信二於善友隨時敬問禮拜奉迎合掌殷勤修和敬業而為供養三於善友如法衣服飲食臥具病緣醫藥資身什物隨時供養四於善友為正依處於如法義若合若離隨自在轉無有傾動如實顯發作奉教心隨時往詣恭敬承事請問聽受自為自內大善知識於自愆犯審諦觀察既了知已深見此世他世過失依止對治而預遣除其誤犯者若有勝緣遇佛菩薩即對其前若不會遇當於十方諸佛菩薩像前啓白請證發露悔除或於善友同法者所亦如是行此中所云常修覺悟亦即本論二十四卷聲聞地出離地品中之常勤修習悎寤瑜伽九十九卷總擇攝中之常不睡眠勤修勝行十一卷三摩呬多地中之不常悎寤勤修觀行同名異譯又此文中一切修法廣釋於本論二十三卷出離地品第三之二二十四卷出離地品第三之三二十五卷出離地品第三之四三總結如是等類所有引攝護持增長諸善法戒是名菩薩攝善法戒所有引攝護持增長如是等類一切善法之戒是名菩薩攝善法戒言引攝者謂令新生如生三慧言護持者謂於一切已生起者不令壞失此如習近安忍謂若不能遮護瞋恚即能毀壞所積善故言增長者謂於一切已護持者復令增長廣大豐滿有如回向及發正願三饒益有情戒云何菩薩饒益有情戒當知此戒略有十一相何等十一謂諸菩薩於諸有情能引義利彼彼事業與作助伴於諸有情隨所生起疾病等苦瞻侍病等亦作助伴又諸菩薩依世出世種種義利能為有情説諸法要先方便説先如理説後令獲得彼彼義利又諸菩薩於先有恩諸有情所善守知恩隨其所應現前酬報又諸菩薩於墮種種師子虎狼鬼魅王賊水火等畏諸有情類皆能救護令離如是諸怖畏處又諸菩薩於諸喪失財寶親屬諸有情類善為開解令離愁憂又諸菩薩於有匱乏資生衆具諸有情類施與一切資生衆具又諸菩薩隨順道理正與依止如法御衆又諸菩薩隨順世間事務言説呼召去來談論慶慰隨時往赴從他受取飲食等事以要言之遠離一切能引無義違意現行於所餘事心皆隨轉又諸菩薩若隱若露顯示所有真實功德令諸有情歡喜進學又諸菩薩於有過者內懷親昵利益安樂增上意樂調伏訶責治罰驅擯為欲令其出不善處安置善處又諸菩薩以神通力方便示現那落迦等諸趣等相令諸有情厭離不善方便引令入佛聖教歡喜信樂生希有心勤修正行約略説之有十一相謂於應助伴者昧方便者有恩惠者遭怖畏者遇憂惱者乏資具者求依止者樂順心者諸正行者諸邪行者應以神通作調伏者如其所應成辦義利三具足因緣有二一略標二廣釋一略標云何菩薩住律儀戒住攝善法戒住饒益有情戒善護律儀戒善修攝善法戒善行一切種饒益有情戒二廣釋有三一律儀戒具足因緣二攝善法戒具足因緣三饒益有情戒具足因緣初復有二一分釋二總結初復有十一不顧戀過去諸欲謂諸菩薩住別解脫律儀戒時捨轉輪王而出家已不顧王位如棄草穢如有貧庶為活命故棄下劣欲而出家已不顧劣欲不如菩薩清淨意樂捨輪王位而出家已不顧一切人中最勝轉輪王位謂諸菩薩雖獲人中最勝妙欲轉輪王位亦能棄捨而求出家既出家已不顧彼欲如同草穢所言欲者有所希樂説名為欲此有二種一事欲謂諸受用二煩惱欲謂於事欲隨逐愛味今茲所説是彼事欲於彼應作掃除之想腐草既棄終不返顧如是觀見此中無有可愛義利先時所棄不復還顧又應能作不淨之想糞穢既棄終不返顧如是觀見彼欲染污如糞穢然亦不還顧若於最初棄捨在家諸所受用而出家已又還於彼而生追戀則於律儀不得清淨故應安住如前二喻作二種想更令堅固無貪善根二不喜樂未來諸欲又諸菩薩住律儀戒於未來世天魔王宮所有妙欲不生喜樂亦不願求彼諸妙欲修行梵行於彼妙欲尚如實觀猶如趣入廣大種種恐畏稠林况餘諸欲尚不希願於未來世為求魔宮所繫他化自在本論四卷云復有摩羅天宮即他化自在天攝諸欲受用而修梵行况於此外所餘諸欲所言於彼不喜樂者謂如實觀猶如充滿虎豹稠林不欲趣入上説不顧戀過去諸欲者唯説人欲不言天欲以律儀戒出家為主天中無有出家者故此説不喜樂未來諸欲者唯説天欲不言人欲以天魔王宮諸欲受用無過上故於未來世如是妙欲尚不願求何況人欲以要言之若為善護或令清淨出家律儀定須不為未來諸欲而修梵行但能不顧先捨諸欲不生喜足三不耽著現在諸欲又諸菩薩既出家已於現在世尊貴有情種種上妙利養恭敬正慧審觀尚如變吐曾不味著何况於餘卑賤有情所有下劣利養恭敬謂於國王長者尊貴有情上妙利養恭敬諸欲尚不味著何况於餘卑賤有情所有下劣利養恭敬譬如食物食已變吐不復味著即以正慧如實審觀與彼相同此中主要謂若希願未來諸欲而修梵行但得名為善好希願不得名為別解脫律儀然亦棄捨往昔所得諸欲受用及不貪著現在諸欲非是在家律儀戒中定不可無於出家衆決定應有若不總修生死過患別修諸欲過患如前所説止息其心應知不能善護尸羅如本論一百卷攝事分云謂有一類補特迦羅先求涅槃而樂出家出家以後為天妙欲愛味所漂所受持戒回向善趣唯護尸羅便生喜足是名外補特迦羅於增上戒第一邪行四樂住遠離又諸菩薩常樂遠離若獨靜處若在衆中於一切時心專遠離寂靜而住不唯於是尸羅律儀而生喜足依戒住戒勤修無量菩薩等持為欲引發證得自在身樂遠離居獨靜處若處衆中遠離八種尋思而住不唯有戒便生喜足依止淨戒勤修菩薩無量等持令新引發究竟引發而能於定證得自在是謂唯能清淨尸羅便生喜足而不進求上勝功德即便不能圓滿尸羅言遠離者謂是憒閙遠離常樂遠離者謂是樂居間寂如集異門論云諸空回舍皆名間寂若住此中歡喜愛樂不生愁思心無厭怖是故説為樂居間寂五言論尋思悉皆清淨又諸菩薩雖處雜衆而不樂為乃至少分不正言論居遠離處不起少分諸惡尋思或時失念暫爾現行尋便發起猛利悔愧深見其過數數悔愧深見過故雖復暫起不正言論諸惡尋思而能速疾安住正念於彼獲得無復作心由此因緣則能拘檢習拘檢故漸能如昔於彼現行深生喜樂於今安住彼不現行喜樂亦爾又能違逆令不現起若時居住紛雜衆中亦不發起少分不正雜穢言論若居寂靜遠離處時亦善防護不起少分八惡尋思或時失念暫爾現行尋見其過發猛追悔若能如是數數修作由此因緣諸惡語意暫一能起尋生正念獲不作心即得除遣習除遣故漸能如昔於彼二事深生喜樂自今以後能令二心轉易其位便得生起樂不現行從初勵力令不現行若時現行令念安住深見過患起猛利悔前念後念變易而住是名遮遏所不應作令得成為清淨尸羅無上教誡此中所云拘檢藏本譯為除遣瑜伽略纂釋云言拘檢者即拘檢其心令不起惡散亂如人作拘檢時不生縱逸等倫記釋云自斂攝名拘檢六不自輕懱又諸菩薩於諸菩薩一切學處及聞已入大地菩薩廣大無量不可思議長時最極難行學處心無驚懼亦不怯劣唯作是念彼既是人漸次修學於諸菩薩一切學處廣大無量不可思議淨身語等諸律儀戒成就圓滿我亦是人漸次修學決定無疑當得如彼淨身語等諸律儀戒成就圓滿若聞已入大地一切菩薩三聚淨戒寬廣博大及其學處超過算數無可度量非尋思境不可思議歷無數劫而勤修行要期長時非短時行若捨身等餘所不能最極難行於如是等應當滅除驚懼怯劣念我不能而自輕懱云何滅除謂作是念彼既是人漸次修學乃得與彼學處相應非由本初便能爾爾我亦是人漸次修學精進不捨決定無疑當得如彼所成就者作是念已發大勇悍若聞如是無量學處作如是云莫堪修學便生輕捨又作是念此是所餘諸菩薩事非我所事便棄捨之是名增長種姓堪任極大障礙當如前説滅除怯劣能實行者發勤精進勵力趣行暫所不能而亦自念我於此等終必修學恆修勇悍又應勤修積集資糧淨治罪障謂修頂禮供養悔罪隨喜請轉法輪請常住世回向善根如是七支修四無量及百字明諸種觀誦發弘大願依十地經或普賢品而為成就學處之因七柔和又諸菩薩住律儀戒常察己過不伺他非普於一切凶暴犯戒諸有情所無損害心無瞋恚心菩薩於彼由懷上品法大悲故現前發起深憐愍心欲饒益心考藏本云又諸菩薩住律儀戒察自過失而不尋伺他過他失即以依止如法大悲普於一切凶暴犯戒諸有情所無損害心無瞋恚心菩薩於彼現前安住深憐愍心欲饒益心常察自過不伺他非不令生苦若爾他過可放任耶答曰不也謂能緣彼是煩惱法生起悲愍即是依止如法大悲云何生起謂此非是補特伽羅所有過失由煩惱力不獲自在普於一切若凶暴者若犯戒者無損害心不起瞋恚起深憐愍且復發起欲作饒益謂作是念我當作彼大善知識定令發起大菩提心遠離煩惱不為煩惱所自在轉乃至證得無上菩提古德亦以漢譯文中由懷上品法大悲故一語不易了解多所訓釋如瑜伽略纂云菩薩於彼由懷上品法大悲故等者舊論云由懷上品法心悲心遠師云法心者是慧以慧知彼是法數故無人可瞋悲心者悲心救彼恐當受苦今又解云法大悲者由懷上品法可起大悲意取悲救衆生不論法也八堪忍又諸菩薩住律儀戒雖復遭他手足塊石刀杖等觸之所加害於彼尚無少恚恨心況當於彼欲出惡言欲行加害況復發言毀辱訶責以少苦觸作不饒益考藏本云又諸菩薩住律儀戒雖復遭他手足塊石刀杖觸害心亦不恚豈能於彼欲出惡言或欲還襲况以毀辱忿怒訶責作少損惱令其苦楚謂雖遭他手足塊石刀等觸害心亦不恚豈復能出囂暴凶鄙粗惡語言或欲還襲以是義故如其次第意語及身三業清淨此中是説他來觸害尚不暫一生起瞋恚欲報所害况復能作所餘彼彼意在顯示於他所施少分損惱心不憤發而能安住沙門四法沙門四法者他罵不報罵他瞋不報瞋他打不報打他弄不報弄九不放逸又諸菩薩住律儀戒具足成就五支所攝不放逸行一前際俱行不放逸行二後際俱行不放逸行三中際俱行不放逸行四先時所作不放逸行五俱時隨行不放逸行謂諸菩薩於菩薩學正修學時若於過去已所違犯如法悔除是名菩薩前際俱行不放逸行若於未來當所違犯如法悔除是名菩薩後際俱行不放逸行若於現在正所違犯如法悔除是名菩薩中際俱行不放逸行若諸菩薩先於後時當所違犯發起猛利自誓欲樂謂我定當如如所應行如如所應住如是如是行如如是如是住令無所犯是名菩薩先時所作不放逸行若諸菩薩即以如是先時所作不放逸行為所依止如如所應行如如所應住如是如是行如是如是住不起毀犯是名菩薩俱時隨行不放逸行此有五種不放逸行謂隨逐前際隨逐後際隨逐中際預先所作俱時隨行不放逸行如是五者如其次第一於過去時諸已違犯如法悔除二於未來時精懇思維亦如是行三於現在時亦不失念能如是行以上犯已還淨以下令不違犯四勵力自誓我於如如所應行如如所應住令無所犯要當如是如是行如是如是住令不違犯五即以如是為所依止便能如是如是行如是如是住不起毀犯此中主要在不放逸別解脫中所説學處如是五種不放逸行第四為本謂有第四能生第五若或未能生起第五而違犯者如其次第如法還淨十軌則淨命合為一支初軌則又諸菩薩住律儀戒覆藏自善發露己惡少欲喜足堪忍衆苦性無憂戚不掉不躁威儀寂靜不為名聞讚揚自善不事覆藏發露己惡得劣少者意無憂惱而能少欲得多美者不求增益而能喜足堪忍寒熱餓渴等苦不得利養性無憂戚諸根調伏寂靜不掉不隨境轉而不躁動威儀端嚴如理作意威儀寂靜次淨命離矯詐等一切能起邪命之法謂離矯詐等五邪命法五邪命法廣釋於後文釋惡作科第十一惡作中此云矯詐後云詭詐及本論二十二卷出離地品淨命虧損所攝中由六因緣雖已防護而非善護一唯少防護執為喜足二等起語言未能清淨三自行輕懱四不攝徒衆五有所違犯不能還淨六軌則與命未能清淨此於初一又分二類一雖護身語未能護心離三世欲二雖已護心不求依戒引發等持此中第四不攝徒衆者德光云不能攝受堪忍淨戒諸徒衆故二總結菩薩成就如是十支名住律儀戒善護律儀戒謂不顧戀過去諸欲又不希求未來諸欲又不耽著現在諸欲又樂遠離不生喜足又能掃滌不正言論諸惡尋思又能於己不自輕懱又性柔和又能堪忍又不放逸又能具足軌則淨命此文已列科首故不別釋三攝善法戒具足因緣又諸菩薩已能安住攝善法戒若於身財少生顧戀尚不忍受何况其多又於一切犯戒因緣根本煩惱少分煩惱忿恨等生亦不忍受又於他所發生恚害怨恨等心亦不忍受又於所起懈怠懶惰亦不忍受又於所起等至味著等至煩惱亦不忍受又於五處如實了知謂如實知善果勝利又能如實了知善因又能如實知善因果倒與無倒又如實知攝善法障是諸菩薩能於善果見大勝利尋求善因為攝善故如實了知倒與無倒由此菩薩獲得善果不於無常妄見為常不於其苦妄見為樂不於不淨妄見為淨不於無我妄見為我如實了知攝善法障為攝善故速疾遠離菩薩由此十種相故名住攝善法戒速能攝善一切種相謂施漸次若戒漸次若忍漸次若精進漸次若靜慮漸次及五種慧考藏本云又諸菩薩安住攝善法戒於身與財少生顧戀尚不忍受何况其多又於一切犯戒所依根本煩惱及隨煩惱忿恨等生亦不忍受又若於他諸有情所發生損害恚恨等心亦不忍受又於所起懈怠懶惰亦不忍受又於所起等至味著等至煩惱亦不忍受又能如實了知五處謂如實了知善果勝利如實了知善因如實了知善因之果倒如實了知果無倒如實了知於攝善中作障礙者是諸菩薩已能觀見善果勝利為攝善故尋求善因菩薩從此如實知倒及與無倒謂彼從此獲善果已不於無常而見為常不於其苦而見為樂不於不淨而見為淨不於無我而見為我又由了知攝善障已畢竟遠離故由如是二品十相便能安住攝善法戒唯此名為速疾攝善亦得名為攝一切種所謂施漸次戒漸次忍漸次精進漸次靜慮漸次及五種慧攝此有二品各有五相第一品者前五漸次如其次第於彼五度諸違逆品不應忍受一於身與財少生慳貪亦不忍受二於其一切犯戒所依根本煩惱及隨煩惱忿恨等生亦不忍受三於其損害恚恨等生亦不忍受四不進修善所起懈怠及樂睡眠臥樂倚樂不生恭敬所起懶惰亦不忍受五於其所起靜慮味著及靜慮地所起煩惱或心沈沒或掉舉等亦不忍受以要言之諸違逆品暫一出生即依對治而能滅除定不捨置令彼增上第二品者慧度漸次一謂如實知善之勝利二謂如實知善因三謂如實知善果倒四謂如實知善果無倒五謂如實知攝善障礙如是五者斷五無知及諸障礙言善果勝利者謂人天菩提三果勝利言善因者謂十善等即增上生因謂是往趣善趣之因決定勝因謂是愛盡離欲寂滅涅槃之因言尋求善因者謂依止善知識聽聞正法如理作意修習淨善法隨法行即加行善若於所獲善果於無常等見為常等是名為倒與此相違即名無倒菩薩能於所獲善果無顛倒見若能如是了知六度善果勝利了知善因復由了知上所顯示障礙六度諸違逆品而遠離已攝集六度所有善根是即名為攝一切善亦得名為速疾攝善謂世出世間一切善無不攝於六度中故若能遠離六度逆品即便有力速疾攝故言漸次者謂是速疾引發施等六度之因瑜伽略纂所釋諸義略有不同如略纂云上之五度依文次配於智度中別開為五處五處者謂知善果勝利第一謂即證得菩提時所有相好一切功德等了知善因是第二謂六度行等了知善因果倒與不倒第三謂即作常樂我淨解是倒因果若作苦無常等解是不倒因果了知善法障第四謂了知六度之障謂慳等六弊了知善果勝利尋求善因於因果中知倒不倒不計為淨等了知善障等而能速疾離之並第五若依遠師云此之第三知善因果倒與不倒為二如是倒二如是非倒四又字中分五處是諸菩薩能於善果下覆解前五處今義不然是諸菩薩下末文云了知攝善法障為攝善故速能遠離釋前何文若釋前第五了知攝善法障者前但言知障不言遠離今言遠離結前第五豈不相違今分是諸菩薩下為第五以遠離障與知障別也問曰若取遠離障為第五與前知善因何異義曰前知善因知六度等是因未能除障今第五除障故有別也汝若以知障除障不得為二者知倒非倒應不得為二汝既不成我義顯立知倒與善障何異義曰前倒為四倒障謂六蔽故有別也三饒益有情戒具足因緣有二一略標二分釋一略標又諸菩薩由十一相名住一切種饒益有情戒於一一相中成就一切種此如助伴一相應作一切有情助伴以一切相而作助伴或如酬恩時中所説於十一類一一有情如其所應皆為成辦十一種事二分釋有十一一於應助伴為作饒益二於昧理者為作饒益三於有恩所為作饒益四於諸危怖為作救護五於他衰惱開解愁憂六於缺資具為作饒益七於求依止為作饒益八欲隨順心為作饒益九於正行者為作饒益十於倒行者為作饒益十一於彼應以神通調伏諸有情所為作饒益一於應助伴為作饒益有二一於諸事業為作助伴二於有苦者為作助伴一於諸事業為作助伴謂諸菩薩於諸有情彼彼事業皆為助伴謂於思量所作事業及於功用所作事業悉能與彼而作助伴或於道路若往若來或於無倒事業加行或於守護所有財物或於和合展轉乖離或於義會或於修福皆為助伴此中有八一思量所作事業謂當思量於他有情隨有所作或復不作能致盛衰二功用所作事業謂從今始決定起作所作事業上來二種初即助伴思量策畫次即執行助伴擔荷三於行道路若往若來謂於道路或無行旅或無隨從道有障難為作助伴四於諸無倒事業加行謂於耕等一營農二商賈三牧牛四事王五習學書算計數及印六習學所餘工巧業處無過事業而為開示諸正方便五於其守護所有財物謂於所已儲集財物示以方便不為盜等之所劫取六於和合展轉乖離謂令解怨修好七於舉義會謂已定期修福事業八於修福事謂未定期起修福事如是等類皆為助伴德光云即由如是初二助伴令彼資財未得者得事業加行守護財物令已得者增長護持後二助伴既增長已令其供養諸應供處二於有苦者為作助伴於諸救苦亦為助伴謂於遭遇疾疫有情瞻侍供給盲者啓導聾者撝義手代言者曉以想像迷方路者示以隅途支不具者惠以荷乘其愚騃者誨以勝慧為貪欲纏所苦有情開解令離貪欲纏苦如是若為瞋恚惛沉睡眠掉舉惡作疑纏所苦有情開解令離疑纏等苦欲尋思纏所苦有情開解令離欲尋思苦如欲尋思恚害親里國土不死輕侮相應族姓相應所有尋思當知亦爾他蔑他勝所苦有情開解令離被蔑勝苦行路疲乏所苦有情施座施處調身按摩令其止息勞倦衆苦考藏本云又諸菩薩於諸有苦亦為助伴謂於遭遇疾疫有情瞻侍供給於諸盲者示引其道於諸聾者指示名相曉以手勢令解事義手足缺者或自荷負或以車載為貪欲纏所苦有情開解令離貪欲纏苦自此以下與論文同勘同藏本聾者撝義手代言者曉以想像是一助伴又迷方路者示以隅途其愚騃者誨以勝慧藏本無之此分二類一者身苦二者心苦初身苦者此復有四一遭疾疫者施藥瞻侍二根殘缺者於諸盲者欲往向處引趣其道於諸聾者所取所捨曉以手勢三支不具者或自身荷或以車乘載赴其處四行路疲乏者施以食住調身撫摩二心苦者此復有三一蓋障苦者謂貪欲等五蓋纏苦示以教授令其開解五蓋者貪欲蓋瞋恚蓋惛沉睡眠蓋掉舉惡作蓋疑蓋如是五蓋廣釋於後文第二十四惡作中二無間苦者謂八尋思所纏縛苦説對治法令其開解八尋思者欲尋思以愛染心攀緣諸欲數起意言尋求串習名欲尋思恚尋思以憎惡心緣他所作瞋恚因緣數起意言尋求串習名恚尋思害尋思以傷害心攀緣於他作不饒益數起意言尋求串習名害尋思親里尋思以染污心緣諸親戚數起意言尋求串習名親里尋思國土尋思以染污心攀緣國土數起意言尋求串習名國土尋思六不死尋思以染污心緣其所應證得自義觀待後時數起意言尋求串習名不死尋思七輕懱相應尋思以染污心緣自與他若勝若劣數起意言尋求串習名輕懱相應尋思八族姓相應尋思以染污心緣諸施主及往還者家勢具足數起意言尋求串習名族姓相應尋思此於第八則取下義謂受用圓滿種姓圓滿所欲增上而自許為高貴族姓是名家勢相應尋思三他蔑勝苦者謂當告以諸有鬬諍若勝若負世間應爾説無我等出世間法令其開解二於昧理者為作饒益又諸菩薩為諸有情如理宣説謂於樂行惡行有情為欲令斷諸惡行故以相應文句助伴隨順清亮有用相稱應順常委分資糧法而為宣説或復方便善巧宣説如於樂行惡行有情為欲令斷諸惡行故如是於行慳行有情為欲令彼斷慳行故於現法中求財寶者為欲令彼正少功力集多財寶守護無失於佛聖教懷憎嫉者為欲令彼得清淨信證清淨見超諸惡趣盡一切結越一切苦應知亦爾謂於惡行果熟有煩惱者如本論四十七卷云或復有情雖非定苦而多現行諸身惡行諸語惡行諸意惡行於諸惡中喜樂安住所謂屠養羊豬雞等不律儀輩如是名為惡行有情由彼果熟定須現行諸種惡行復於惡行性喜安住有煩惱者為説正法勸令受持止息惡行説法相者謂以相應文句等八德光云以此八種具四功德答三種問而為宣説一以相應文句助伴二者答不知問謂以無倒義聯貫義而酬答之二以隨順清亮二者答相違問謂以隨順法性前後密意無違而酬答之三以有用相稱應順常委分資糧法四者答二俱問謂具方便令其領悟稱所化機令其知解應順成立世間功德及聖道資糧而酬答之言常委者恆勵力護謂恆恭敬從諸漏中維護心故最勝子所説亦與此同唯後二答德光謂是依證謂通達增上答問教授最勝子則謂依得謂獲成就增上答問教授如上所説雖云三問顯有四問又德光云或相應者以助伴釋前後符故隨順者以清亮釋順法性故有用者以相稱釋稱所化故應順者以常委釋順淨行故如是一一雙偶句中得以後句訓釋前句由此表示答一切問具四功德謂前後無違不違法性不違所化契合勝義是名四德所言或復方便善巧宣説者謂以方便令不厭背而為説法是即名為方便善巧略有六種方便善巧廣説於本論四十五卷菩提分品謂如前犯戒惡行有情以八文句為其説法令止惡行如是於行慳等有情令修施等亦如是説又於現法求財寶者為其開示正少功力集多財寶守護無失一切方便又於聖教懷憎嫉者令起正信入佛聖教已趣入者為令斷見所斷煩惱證清淨見超諸惡趣説正勝法大毗婆沙論云於正持策身語意中此為最勝故名正勝或名正斷於諸已能得見道者開示斷盡餘結方便相應文句等八種藏漢兩釋異同初藏釋釋論未取本論所釋依德光釋故有諸義相應文句者無倒義助伴者聯貫義隨順者順法性清亮者前後密意無有相違有用者具足方便令其領悟相稱者稱所化機令其知解應順者應順成立世間功德常委分資糧法者聖道資糧又此八名藏譯略異一相應文句二相繼三隨順四隨宜五具足方便六相稱七應順八恆勤維護支分資糧次瑜伽略纂所釋一相應者即與理相應二助伴者謂即文句中義也三隨順者順無漏道也四清亮者和雅也五有用者能斷惡也六相稱者即順病説法也七應順常委者順常委修也八分資糧法者即菩提分不餘分資糧法也此以常委合於應順與藏譯異亦與本論八十一卷攝釋分中所説相違攝釋分云相應者謂名句文身次第善安立故又依四種道理相應故助伴者能成次第故隨順者謂解釋次第故清徹者文句顯了故清淨資助者善入衆心故相稱者如衆會故應供故稱法故引義故順時故常委分資糧者審悉所作恆常所作故名常委彼分者謂正見等此是彼資糧故又此論文本係解釋相應文句八種乃以名相先後異譯復因應順者三字誤作應供故遂有瑜伽倫記以此八種強判為七勘同藏本此中所云相應即本品所説相應文句助伴隨順前後譯同清徹即清亮清淨資助即有用相稱前後譯同應供故即應順者常委分資糧即常委分資糧法三於有恩所為作饒益又諸菩薩於其有恩諸有情所深知恩惠常思酬報暫見中敬讚言善來怡顏歡慰吐誠談謔祥處設座正筵令坐若等若增財利供養現前酬答非以下劣於彼事業雖不求請尚應伴助况乎有命如於事業如是於苦於如理語於方便説於濟怖畏於衰惱處開解愁憂於惠資具於與依止於隨心轉於顯實德令深歡悅於懷親愛方便調伏於現神通驚恐引攝如應廣説當知亦爾謂若覩見當申恭敬即應説言善來來進怡顏歡慰尊推勝座備設住處正筵款待次財利供計所恩惠若等若增現前酬恩非以下劣於彼事業雖未求請尚為助伴何况來求如是乃至於現神通恐怖引攝衆餘饒益亦應廣作四於諸危怖為作救護又諸菩薩於遭怖畏諸有情類能為救護謂於種種禽獸水火王賊怨敵家主宰官不活惡名大衆威德非人起尸魍魎等畏皆能救護令得安隱原野所棲獅子虎等旁生怖畏若水為患或諸水族摩竭魚等旁生怖畏是名水陸二種怖畏藏本無火畏本論四十三卷靜慮品中亦説水陸怖畏能正拔濟未説火畏或為國王威勢治罰偵緝怖畏或為盜賊劫掠偷竊財寶怖畏或於財等能作障難所有讐怨對敵怖畏或有管理局部家主宰官怖畏是名人中四種怖畏不具資財不活命畏不具妙行惡名稱畏不具辨才處大衆中有赧愧畏怯懼無威此中資財妙行辨才名三可貴又非人畏有其二種一從初受生非人中生即魍魎等二由修明咒咒喚起尸即毗陀羅如是等畏皆為救護此中所言大衆威德若依藏譯應即説為處大衆中有怯懼畏與處大衆無畏相違如本論十五卷聞所成地論莊嚴中云無畏者謂如有一處在多衆雜衆粗鄙衆僻執衆諦衆善衆等中其心無有下劣憂懼身無戰汗面無怖色音無謇訖語無怯弱如是説者名為無畏又本論二十五卷出離地品云云何名為無有怖畏謂處大衆説正法時心無怯劣聲無戰掉辨無誤失終不由彼怯懼因緣為諸怖畏之所逼切腋不流汗身毛不豎五於他衰惱開解愁憂又諸菩薩於處衰惱諸有情類能善開解令離愁憂或依親屬有所衰亡所謂父母兄弟妻子奴婢僮僕宗長朋友內外族因親教軌範及餘尊重時有喪亡善為開解令離憂惱或依財寶有所喪失謂或王賊之所侵奪或火所燒或水所溺或為矯詐之所誑誘或由事業無方損失或為惡親非理橫取或家生火之所耗費於如是等財寶喪失善為開解令離憂惱由是因緣諸有情類生軟中上三品愁憂菩薩皆能正為開解此中有二一者喪亡親屬愁憂二者喪失財寶愁憂初喪亡親屬愁憂復有五種一喪失因親諸能引發後生種子是其因義謂喪父母二喪亡攝受即本論二卷所云七攝受事之一及果有親謂喪妻子藏本缺少兄弟二字三喪役使親謂喪奴婢及諸僮僕四喪恩慈親謂喪宗長朋友內外族因五喪亡開導利益親屬謂喪親教軌範尊長共淨行者如是等類一切愁憂二喪失財寶愁憂復有二種初一切世人所共苦因次一類世人不共苦因一切世人所共者謂或王賊之所侵奪或火所燒或水所溺一類世人不共者亦復有二一自未如法二由他所致自未如法者又復有二未能如法守護財寶謂未善藏護致令損失或為矯詐之所誑誘未能如法經營財寶謂由事業無方損失由他所致者亦復有二朋分受用所致之苦謂為惡親非理橫取有説惡友非理橫取由自家室所起憂苦謂自家中出生敗緣或家生火之所耗費有疏説言唯從家中出生敗種無知濫用耗費財寶由如是等親屬財寶喪失因緣出生上中下品愁憂為説無常令其開解言上中下品愁憂者謂喪父母等是上品憂喪奴婢等是中品憂喪失財寶是下品憂或有釋云當知是從喪失所需及所珍愛出生愁憂六於缺資具為作饒益又諸菩薩備資生具隨有來求即皆施與謂諸有情求食與食求飲與飲求乘與乘求衣與衣求莊嚴具施莊嚴具求諸什物施以什物求鬘塗香施鬘塗香求止憩處施止憩處求諸光明施以光明此中有六一於匱乏資命苦者求諸飲食給與飲食二於疲勞苦者求諸車乘給與車乘三於慚羞苦者求衣與衣求莊嚴具與莊嚴具謂彼若未備具衣裳與莊嚴具起慚羞故四於匱乏資具苦者求諸什物施以什物五於惡臭苦者來求燒香花鬘塗香即便施以香花鬘塗六於乏止憩乏光明苦者來求止憩施止憩處其有能發勤精進者來求燈明施以燈明七於求依止為作饒益又諸菩薩性好攝受諸有情類如法御衆方便饒益以無染心先與依止以憐愍心現作饒益然後給施如法衣服飲食臥具病緣醫藥資身什物若自無有應從淨信長者居士婆羅門等求索與之於己以法所獲如法衣服飲食諸坐臥具病緣醫藥資身什物與衆同用自無隱費於時時間以其隨順八種教授而正教授五種教誡而正教誡此中所説教授教誡當知如前力種性品已廣分別考藏本云又諸菩薩依攝受戒饒益有情戒名攝受戒攝受方便如本論三十七卷成熟品云攝受者謂無染心以親教師及軌範師道理方便與作依止令其攝受諸有情衆唯依悲心而為先首謂於始初無愛染心施與依止自此以後饒益彼故為從淨信長者居士婆羅門等如法尋求衣服飲食臥具病緣醫藥資身什物又自如法所獲合法衣服飲食諸坐臥具病緣醫藥資身什物與衆同用不為儲藏而自受用如本論十九卷思所成地云又復不能有所貯積執為己有而受用之又於時時施與合法八種教授隨順開示五種教誡此中所説教授教誡當知如前力種姓品已廣分別此中有二一何種意樂攝受徒衆非是為求名聞利敬唯以悲心而為先首謂無染心先與依止二何種加行攝受徒衆此復有二一以財攝二以法攝初財攝有二從他求索謂令饒益所已攝受諸徒衆故為從淨信長者居士婆羅門等尋求如法衣服飲食臥具病緣醫藥資具以自資具與衆共用謂自所獲合法衣服等物與衆同用二法攝亦復有二施以教授此復有八心未住者令於所緣能係念故有五教授謂於貪瞋癡慢尋思增上行者如其次第令修不淨或復修慈或修種種緣性緣起或修界差別或修阿那波那念心已住者為令獲得自義利故有一教授謂説能治常斷二見遠離二邊處中之行於自所作未究竟故有二教授謂令除捨於道未作而謂已作於果未證而謂已證諸增上慢如是八種即令安住正方便道除捨中間所有留難三處所攝施以教誡復有五種遮止有罪現行開許無罪現行若有於所遮止開許法中暫行犯者諫誨令止雖已如是如法諫誨數數輕慢毀犯不捨如法調伏若有於所開遮法中能正行者讚令歡喜八種教授五種教誡廣釋於本論三十八卷菩提品八欲隨順心為作饒益有二一略標二廣釋一略標又諸菩薩於有情心性好隨轉隨心轉時先知有情若體若性知體性已隨諸有情所應共住即應如是與其共住隨諸有情所應同行即應如是與彼同行考藏本云又諸菩薩依順心戒即饒益有情戒令其隨順諸有情心先正了知彼諸有情意樂性界了知意樂及性界已隨諸有情所應共住即應如是與其共住隨諸有情所應成辦即應如是令其成辦謂諸菩薩若為隨順有情義利最初應知一切有情意樂性界隨諸有情所應共住即如是住隨諸有情所應成辦即應如是令其成辦此中所言意樂即思謂能觀察隨其所有善與不善及瞋慈等俱行意樂性者勝解謂能觀察所印可乘順其勝解界者隨眠謂令隨順彼等隨眠如本論八十九卷攝事分中云復次煩惱品所有粗重隨附依身説名隨眠能為種子生起一切煩惱纏故二廣釋有七第一欲隨順心作饒益法若諸菩薩欲隨所化有情心轉當審觀察若於如是如是相事現行身語生他憂苦如是憂苦若不令其出不善處安立善處菩薩爾時於如是事現行身語護彼心故方便思擇勵力遮止令不現行如是憂苦若能令其出不善處安立善處菩薩爾時於如是事現行身語住哀愍心不隨如是有情心轉方便思擇勵力策發要令現行復審觀察若於如是他有情事現行身語令餘有情發生憂苦如是憂苦若不令他或餘有情或不令二出不善處安立善處菩薩爾時於如是事現行身語護餘心故方便思擇勵力遮止令不現行如是憂苦若能令他或餘有情或能令二出不善處安立善處菩薩爾時於如是事現行身語住哀愍心不隨如是有情心轉方便思擇勵力策發要令現行復審觀察若於如是菩薩自事現行身語生他憂苦如是現行身語二業非諸菩薩學處所攝不順福德智慧資糧如是憂苦不能令他出不善處安立善處菩薩爾時於如是事現行身語護他心故方便思擇勵力遮止令不現行與此相違現行身語如前應知如生憂苦如是廣説生於喜樂隨其所應當知亦爾謂當顧念衰損利益菩薩成辦隨有情轉由其身語有所現行令彼有情現生憂苦當審觀察由此憂苦若不能令彼有情者出不善處安立善處菩薩爾時勵力遮止令不現行隨彼心轉由此憂苦若能令他安立善處菩薩於他勵力策發深哀愍心要令現行不應隨順他心而轉於彼究竟有利益故如是由此現行雖能於所隨轉有情不生憂苦然於此外所餘有情若現生者爾時菩薩遮止現行或不遮止一切方便如前應知若諸菩薩有所現行非為成辦隨有情轉謂由自事身語現行生他憂苦然此若非自制學攝或非成就二種資糧或非令他出不善處安立善處爾時菩薩護他心故即應棄捨令不現行若違此三勵力策發深哀愍心要令現行不隨如是有情心轉如是身語現行令他有情現生喜樂若能令其究竟利益要令現行若能令其究竟衰損不隨他轉如前應知第二欲隨順心作饒益法又隨他心而轉菩薩知他有情忿纏所纏現前忿纏難可捨離尚不讚歎何况毀呰即於爾時亦不諫誨又諸菩薩隨有情轉見他有情現為忿纏之所纏縛乃至其忿猶未止息尚不以語稱讚其忿何况毀呰亦不諫誨第三欲隨順心作饒益法又隨他心而轉菩薩他雖不來談論慶慰尚應自往談論慶慰何况彼來而不酬報見他愚癡不了世事他雖不來談論慶慰尚應自往談論慶慰何况他來談論慶慰第四欲隨順心作饒益法又隨他心而轉菩薩終不故意惱觸於他唯除訶責諸犯過者起慈悲心諸根寂靜如應訶責令其調伏若訶責他終不故意令其惱觸即應於彼為悲愍故諸根寂靜如應訶責第五欲隨順心作饒益法又隨他心而轉菩薩終不嗤誚輕弄於他令其赧愧不安隱住亦不令其心生憂悔雖能摧伏得勝於彼而不彰其墮在負處彼雖淨信生於謙下終不現相而起自高於大衆中終不於他嗤誚輕弄及令赧愧以此即是輕蔑因故亦不令其生起懊悔恐他不能安隱住故雖已摧伏得勝於彼而不彰其墮在負處謂恐令其起羞恥故於彼淨信謙下者前終不現相而起自高謂若自高是能令他起畏縮故第六欲隨順心作饒益法又隨他心而轉菩薩於諸有情非不親近不極親近亦不非時而相親近於他有情非不親近謂不令成過密友故不極親近謂恐常伴障他事業令他厭故亦不非時而相親近謂當應時而親近故如是三者為令遠離阻斷關係第七欲隨順心作饒益法又隨他心而轉菩薩終不現前毀他所愛亦不現前讚他非愛非情交者不吐實誠不屢希望知量而受若先許應他飲食等終無假託不赴先祈為性謙沖如法曉喻藏本則於若先許應等句譯為若他延請飲食等事亦不違拒抑或如法而婉辭謝不當他前毀其所愛讚所非愛他不喜故非情交者不吐實誠思異相故不屢於他而作乞求雖來惠施當知量受謂恐他嫌不信嗤誚後忿不施雖復勉施亦生輕懱故若他延請飲食等事亦不違拒不令阻障他意樂故抑或如法而相推謝謂當婉言正修課誦或修靜慮或持近圓令他不生不歡喜故九於正行者為作饒益又諸菩薩性好讚揚真實功德令他歡喜於信功德具足者前讚揚信德令其歡喜於戒功德具足者前讚揚戒德令其歡喜於聞功德具足者前讚揚聞德令其歡喜於捨功德具足者前讚揚捨德令其歡喜於慧功德具足者前讚揚慧德令其歡喜考藏本云又諸菩薩依止能起勝歡喜戒於具真實功德有情令其歡喜下與論同謂於具足信戒聞捨慧功德者前各依彼等所宜言論讚令歡喜讚揚戒德及捨德者身與受用圓滿之因謂此即是增上生因讚揚慧德謂此即是決定勝因讚揚聞德能引發慧讚揚信德謂能趣入二因之因十於倒行者為作饒益又諸菩薩性好悲愍以調伏法調伏有情若諸有情有下品過下品違犯內懷親愛無損惱心以軟訶責而訶責之若諸有情有中品過中品違犯內懷親愛無損惱心以中訶責而訶責之若諸有情有上品過上品違犯內懷親愛無損惱心以上訶責而訶責之如訶責法治罰亦爾若諸有情有下中品應可驅擯過失違犯菩薩爾時為教誡彼及餘有情以憐愍心及利益心權時驅擯後還攝受若諸有情有其上品應可驅擯過失違犯菩薩爾時盡壽驅擯不與共住不同受用憐愍彼故不還攝受勿令其人於佛聖教多攝非福又為教誡利餘有情考藏本云又諸菩薩依調伏戒調伏有情下與論同又藏本無性好悲愍四字謂諸有情有下中上三品過犯無損惱心無瞋恚心如其所應以下中上三品訶責而訶責之如訶責法治罰亦爾若諸有情有下中品過失違犯菩薩爾時為教誡彼及餘有情以憐愍心權時驅擯一月二月乃至數年後還攝受若諸有情有上品過菩薩爾時憐愍彼故勿令其人多攝非福又為教誡利餘有情盡壽驅擯不與共住不同受用不還攝受言非福者謂不如理受用信施或慢然受同梵行者禮拜等事言過失者應作不作言違犯者作不應作此為德光所釋十一於彼應以神通調伏諸有情所為作饒益有二一以神通力而為恐怖二以神力通力而為引攝一以神通力而為恐怖又諸菩薩為欲饒益諸有情故現神通力或為恐怖或為引攝謂為樂行諸惡行者方便示現種種惡行諸果異熟謂諸惡趣小那落迦大那落迦寒那落迦熱那落迦既示現已而告之言汝當觀此先於人中造作增長諸惡行故今受如是最極暴惡辛楚非愛苦果異熟彼見是已恐怖厭患離諸惡行復有一類無信有情菩薩衆中隨事故問彼作異思拒而不答菩薩爾時或便化作執金剛神或復化作壯色大身巨力藥叉令其恐怖由是因緣捨慢生信恭敬正答其餘大衆聞彼正答亦皆調伏化現寒熱諸那落迦而告之言汝其觀此先於人中造積惡行今受如是非入火界等持周身熾然出諸焰等方便引攝令諸有情踴躍歡喜於未信者於犯戒者於少聞者於慳吝者於惡慧者如其所應令彼安處信戒聞捨慧具足中如是饒益有情戒分十一相自餘疏中亦有別説惟律儀二十頌釋難中乃如前説謂攝集事業疾病有苦三種助伴合為一相最契本論最勝子云諸有所作為增自福所攝善法即以引發利他意樂便成饒益有情淨戒本論四十六卷云菩薩雖積集六波羅蜜多所有善根而樂普令有情清淨即為己樂是故菩薩為淨有情增上力故以淨意樂施諸有情是説或未真實利他緣利他故諸有所作亦得説為饒益有情戒然本論中是説真實饒益有情又若其時未能真實饒益有情亦無欠缺具足饒益有情戒過譬如浮散睡眠等時心雖未能真實防護所應遠離然律儀戒亦仍存在發心受願儀軌云初修業者以律儀戒為首要故名誓願行勝解行者攝善法戒為首要故名等住行入大地者饒益有情為首要故名心喜行如其所説雖有首要輕重次第然於始初受律儀時即應修學饒益有情於未具足神通時分作利他事難趣實體是故上師無著明顯宣説所饒益境有情差別及作彼等饒益方便至極重要善了知已隨順彼彼而饒益他謂若能爾即愛苦果令其厭患遠離惡行復有一類無信有情處在菩薩大衆會中過反詰問出不遜語菩薩爾時或便化現執金剛神或復化作壯色大身巨力藥叉令其恐怖由此生起信仰恭敬正答所問其餘大衆聞彼正答一一所問亦皆調伏最勝子等云此是或有在大衆中思於菩薩故作損惱默然不答為令正答所詰問故示現神通而作恐怖教令正答本論譯文依此釋義與藏本異二以神通力而為引攝或現種種神通變化或一為多或多為一或以其身穿過石壁山巖等障往還無礙如是廣説乃至梵世身自在轉現無量種神變差別或復現入火界定等或復示現共聲聞等種種神通方便引攝令諸有情踴躍歡喜諸未信者方便安處信具足中諸犯戒者方便安處戒具足中諸少聞者方便安處聞具足中多慳吝者方便安處捨具足中諸惡慧者方便安處慧具足中如是菩薩成就一切種饒益有情戒或一變多或多變一或以其身穿過石壁山巖垣牆等障往還無礙乃至梵天世界中間身自在轉或復上身出火下身出水現無量種神變差別或復深名菩薩成就一切種饒益有情戒四總結事義是名菩薩三種戒藏亦名無量大功德藏謂律儀戒所攝戒藏攝善法戒所攝戒藏饒益有情戒所攝戒藏菩薩所有三種戒藏謂律儀戒攝善法戒饒益有情戒所攝戒藏此能總攝無邊淨戒諸有於此能修學者亦名成就無量福藏上來俱是菩薩地説而攝決擇分菩薩地中以此律儀戒等三戒説為三種毗奈耶聚初律儀戒應依佛説別解脫經及廣釋論而善修學如攝決擇分云當知菩薩毗奈耶略有三聚初律儀戒毗奈耶聚如薄伽梵為諸聲聞所化有情略説毗奈耶相當知即此毗奈耶聚二攝善法戒應於六心觀察勤習如攝決擇分云云何攝善法戒毗奈耶聚謂諸菩薩於攝善法戒勤修習時略於六心應善觀察何等為六一輕懱心二懈怠俱行心三有覆蔽心四勤勞倦心五病隨行心六障隨行心若諸菩薩於善法中所有輕心無勝解心及陵懱心名輕懱心若有懶惰憍醉放逸所纏繞心名懈怠俱行心若貪欲等隨有一蓋或諸煩惱及隨煩惱所纏繞心名有覆蔽心若住勇猛增上精進身疲心倦映蔽其心名勤勞倦心若有諸病損惱其心無有能力不堪修行名病隨行心若有喜樂談論等障隨逐其心名障隨行心如是生起彼六種心或復忍受或不忍受為是有罪抑是無罪論中又云菩薩於此六種心中應正觀察我於如是六種心中為有隨一現前行耶為無有耶於前三心菩薩一向不應生起設已生起不應忍受若有忍受而不棄捨遍於一切皆名有罪勤勞倦心現在前時由此心故捨善方便若為暫息身心疲惱當於善法多修習者當知無罪若於一切畢竟捨離謂我何用精勤修習如是善法令我現在安住此苦若如是者當知有罪病隨行心現在前時菩薩於此無有自在不隨所欲修善加行雖復忍受而無有罪障隨行心現在前時若不隨欲墮在其中或觀此中有大義利雖復忍受而無有罪若隨所欲故入其中或觀是中無有義利或少義利而故忍受當知有罪如是六心前三生已而忍受者一向有罪病隨行心雖復忍受一向無罪餘之二心若生起已而忍受者或是有罪或是無罪三若勤趣入饒益有情當觀六處攝決擇分云若諸菩薩於作有情利益戒中勤修習時當正觀察六處攝行所謂自他財衰財盛法衰法盛是名六處言財衰者謂衣食等未得不得得已斷壞與此相違當知財盛言法衰者謂越所學於先未聞勝義所攝如來所説微妙法句不得聽聞如不聽聞先所未聞如是於先所未思惟不得思惟有聽聞障有思惟障設得聞思尋復忘失於所未證修所成善而未能證設證還退與此相違當知法盛此六處中其自他者即是財法盛衰所依既於六處正觀察已應行應止或是有罪或無罪相論中又云此中菩薩作自法衰令他財盛此不應為如令財盛法盛亦爾此中義者越學違越學處所攝及能隨順越學所攝或於證法所得之法退失所攝當知法衰又諸菩薩作自財衰令他財盛若此財盛不引法衰此則應為若引法衰此不應為如令財盛法盛亦爾又諸菩薩作自財盛令他財盛此則應為如令財盛法盛亦爾又諸菩薩作自法盛令他財盛此則應為如令財盛法盛亦爾於如是事若不修行名為有罪若正修行是名無罪如是且説菩薩所學三種律儀略毗奈耶菩薩於中常應作意思惟修學是故於他補特伽羅將作法利或財利時若見正越自期學處或未正越亦隨順越或令退失先已得法及新得法由是不作利他事者亦得無罪如是於作利他事時作自財衰不引法衰若不為者是名有罪若引法衰則不應為亦復如是若能令自財盛法盛而不為他成辦此二是名有罪又行利他或是有罪或無罪相如攝決擇分云若諸菩薩於己有恩諸有情所隨順恩想相續發起親友意樂以有染心方便攝受欲為朋黨當知有罪或於有怨諸有情所隨順怨想相續發起怨讎意樂有穢濁心當知有罪或於無恩無怨諸有情所相續發起中庸意樂放捨意樂當知有罪若有現前隨欲出家隨順觀察時有過患劫有過患不度出家當知無罪若有安住憐愍彼心雖度出家亦無有罪如説出家受具足戒與作依止攝為徒衆當知亦爾由如是等所有行相當知菩薩三種戒蘊皆得圓滿如是既受此律儀已雖於三戒俱應修學然最要者尤應勤學共於七衆別解脫中所學學處之律儀戒攝決擇分又云此三種戒由律儀戒之所攝持令其和合若能於此精勤守護亦能精勤守護餘二若有於此不能守護亦於餘二不能守護是故若有毀律儀戒名毀一切菩薩律儀問然則正受菩薩律儀於此三戒隨持少分名持律儀抑於三戒應持滿分名持律儀答菩薩律儀唯是一品非如別解脫律儀有多次第若正受者應無簡別要期俱學而善受持攝決擇分云若有於此三種所受菩薩戒中隨有所問當知非護當言不護菩薩律儀不當言護問若爾云何大乘集菩薩學論云故當順合自力所能雖一善根亦應正受而善守護地藏十輪經云此十善道能致正覺若有盡壽下至唯於一善業道亦不能護然自稱言我是真實大乘行者我求無上正等菩提當知如是補特伽羅是極矯詐説大妄語對十方界佛世尊前誑惑世間作斷滅説是愚癡類身壞命終墮諸惡趣由是言之於時乃至力所能受即於爾時當善安住所正受善此亦當觀藥師琉璃光王經如是於學護其一分名律儀不答此中非説菩薩律儀是説有能發起願心無力受持菩薩律儀令薰習故於合自力別別學處乃至其時有力守護如應時中令其修學爾時應持順合自力所能律儀謂若不持便成誑惑諸佛菩薩天人世間為令宣示如是過失故引前經於此文後論中又云若大有情聞是事已以慧通達諸菩薩行最為難行為令濟拔無餘衆生出離苦故勇荷重擔是謂由聞誓受學處不能守護有大過患知菩薩行最為難行然能荷負菩薩學處重擔不生怯劣便能受持菩薩律儀是故前者為於一切聞過患已知菩薩行最為難行不能荷負學處重擔從一類行漸次令其誓願修學心力增長方受律儀為明了故引藥師經而令證知應知此從彼經所出二釋受戒法有二一通用事義二本論事義初通用事義者將釋本論受戒儀軌先述往昔天竺菩薩通用受菩提心戒儀令諸菩薩受學律儀龍猛手造受發心法而未別造受律儀軌其受發心法中有云今發最勝菩提心我當接引諸有情行勝悅意菩提行為利有情願成佛如是三誦發菩提心又云為令義利利益安樂諸有情故凡我所有勤修布施守護淨戒修習忍辱策發精進等住靜慮觀察勝慧善巧方便第七波羅蜜多如是一切皆為證得無上正等菩提與諸過去未來現在成就大悲正入大乘安住大地菩薩摩訶薩隨順趣入惟願聖者我今當作菩提薩埵仰祈證明我作菩薩寂天菩薩於集菩薩學論趣入菩薩行論中釋云此中既説學菩提行又復要期與諸菩薩隨順趣入即是發起行相應心名受律儀本論亦説即此要期受學三世菩薩三戒名為受持菩薩律儀自後天竺菩提賢無畏生兩師融合龍猛無著二大轍宗造受律儀廣大儀軌道炬論疏中亦云尊者阿底峽所造發心受律儀法是合龍猛無著寂天三師理趣以是義故龍猛無著兩宗儀軌或有少分特異不同得律儀法義無差別故若有謂既已安立中觀唯識二種宗法所從受境受律儀法及根本罪應不相同是為極不思擇之説無著菩薩雖於本論説受律儀之所依身應是先於無上正等菩提發弘願已於受律儀儀軌而外不現所作發心儀軌慈氏菩薩所造五論世親所造諸論釋中亦皆不現勝怨論師以願趣入及受律儀立二次第吉祥燃燈師亦分別造發心儀軌受律儀法黑行論師所著大乘寶要義論疏及趣入菩薩行論疏中亦以願心儀軌趣入儀軌分別建立故不應執受趣入心與受律儀儀軌不同當知往昔諸善知識以受願心儀軌為先願堅固已後乃授以受律儀法是能堅固律儀妙善方便若爾如修習次第中篇云世俗發心者謂隨智者前而發誓言由悲愍故誓願濟拔一切有情為利衆生願成正覺是名最初發求無上正等菩提行相之心彼與戒品所説儀軌應從安住菩薩律儀善巧者前令其發心亦應相同詳後辨所從受境及辨受者儀軌文中前段與論不同後段論文所無其義云何答此由期學三世菩薩一切學處依事理言有受發心是故名為發心儀軌非是純一發願心軌上説發心略有二相一者願心二者趣入心如是二心所據何論云何趣入名受學處略引正論證明其義初言二心如寂天菩薩趣入菩薩行論云總有二種菩提心謂為菩提發願心及為菩提趣入心初緣菩提發起願心次緣菩提趣入發心彼論又於二心設譬喻云應知如欲往正往有差別是謂有如安住於座身尚未作趣往事業便作是念如彼境者所當趣往希求趣往彼境之心即是願心又若舉足下足作趣往時便作是念今往彼境如是之心即趣入心於所往境能念之心同等無異當知此有未往正往分別不同如是若有為利他故念我當證正等正覺其心同等前者名為不須觀待修六度行種姓中住後者名為定須觀待修六度行種姓中住又如修習次第初篇即廣釋菩提心論云今為利益諸有情故願當成佛初起希求名為願心受律儀後修諸資糧名趣入心取要言之若作是念為利有情願當成佛或應成佛於施等行隨有所學或未修學乃至其時未受律儀是名願心受律儀已當知是心名趣入心本論發心品中亦明顯分願與趣入言願心者如本論云於時能發菩薩第一心即名菩薩諸正願中第一正願謂能攝受其外所餘一切正願是故此以正願為其第一自性是諸菩薩若於菩提起心希願發如是心説如是言願我必定當證無上正等菩提廣作一切有情義利令其安處究竟涅槃及令莊嚴如來大智如是成辦自內菩提及有情利令其發心是故發心即以成辦為其行相又此發心為緣菩提及有情利令其成辦非無所緣故此發心名緣菩提緣有情利又此發心最先趣向攝受一切菩提分法勝善根故是善極善是賢極賢是妙極妙功德相應是能對治一切有情所由依止三業惡行如是菩薩第一發心於餘世間及出世間一切義利妙善正願名為無上最勝正願是故應知此從自性第一發心應知亦從行相所緣功德最勝第一發心合有五相言趣入心者又如本論云是諸菩薩能發此心從此無間趣入大乘無上菩提即謂趣進名言表相菩薩名數以是義故此發心者名為攝受趣入由諸菩薩發此心已漸次當證無上正等菩提非未發心故此發心名為無上正等菩提根本又諸菩薩普於一切有苦有情悲愍相應懷濟拔心令其發心以是義故此發心者名悲等流是諸菩薩依止安住此發心已令其修學菩薩學處若於一切菩提分法若作一切有情義利以是義故此發心者名諸菩薩學處所依是故應知此從攝受根本等流所依第一發心本論又云又諸菩薩第一發心略有二種一定出離二非定出離言定出離者謂發心已不復退還畢竟趣入非定出離者謂發心已又復退還不竟趣入此文顯示發願心已有定趣入不定趣入二種分別次言云何趣入名受學處如上所引深宗諸論均説趣入即受律儀本論説趣入心時亦明顯説是諸菩薩學處所依發此心者令其修學菩薩學處又如本論二十七種成熟方便中云三者趣入言趣入者謂得正信增上力故若有在家正受遠離惡行學處及非在家謂若出家正受遠離諸欲學處此文亦説趣入即是正受學處又本論趣入地品中亦云云何趣入自性謂安住種姓補特伽羅初得見佛及佛弟子往詣其前承事供養從彼聞法得初正信受持淨戒彼品又云云何有趣入謂住種姓補特伽羅最初獲得昔所未得於諸如來正覺正説法毗奈耶所有正信受持淨戒如上所説皆謂趣入即正受戒又此趣入復有二種一者始初趣入二者非始初趣入如成熟品中云始初趣入者謂依始初生起厭離諸可厭法覺悟成辦如理義利有大勝利即便趣入名始初趣入非始初趣入者謂已正入補特伽羅令作成熟所依託故依止常不捨離諸佛菩薩依止展轉令其明了諸解脫處後後時中轉轉成熟上引論文悉據藏本重譯而出略異本論是故由此趣入之心即便應有趣入之戒趣入戒者攝善法故饒益有情故此趣入字梵名阿伐達羅有趣入義趣進義隨轉義創始義發趣義今於釋文依發心品沿用趣入本論譯師前後譯法亦多不同如卷三十五發心品中説最初發心時譯為趣入説永出不永出時譯為隨轉卷三十七成熟品二十七種成熟方便中於第三方便譯為趣入第五第六則又譯為發處本戒品中以趣入戒譯轉作戒如是等類讀者當善會通其義又上所説受菩提心戒儀中土已有多種譯本唐有無畏三藏禪要不空三藏受菩提心戒儀元有莎南屹囉之菩提心戒儀二本論事義有二一有師儀軌二無師儀軌初復有三一加行儀軌二正行儀軌三後行儀軌初加行儀軌有五請白修集資糧三請速授戒四起勝歡喜五問遮難初請白有二辨補特伽羅辨受戒儀軌初辨補特伽羅有二辨所依身辨所從受境一辨所依身若諸菩薩欲於如是菩薩所學三種戒藏勤修學者或是在家或是出家先於無上正等菩提發弘願已考藏本云此中菩薩或諸在家或諸出家欲於如是菩薩所學三種戒聚勤修學者既於無上正等菩提發正願已受戒依身應須何種謂諸菩薩或是在家或是出家於前所説菩薩學處三種戒聚以淨意樂欲修學者於大菩提已發願者謂依教授已發願心若有唯求攝取律儀於菩薩學不欲修學或未先發菩提願心不應授與菩薩律儀又諸菩薩欲授菩薩菩薩戒時先應為説菩薩法藏摩怛履迦菩薩學處及犯處相令其聽受以慧觀察自所意樂堪能思擇受菩薩戒非惟他勸非為勝他當知是名堅固菩薩堪受菩薩淨戒律儀以受戒法如應正授此係後文依受戒軌移置於此故用括號以區別之已下倣此於求正受律儀菩薩令堅固故應於傳授律儀以前為其開演菩薩法藏摩怛履迦菩薩地中菩薩學處及犯處相如所説言令善觀察能受與否以慧思擇樂受律儀非自不欲唯由他所勵力獎勸非為勝他當知是名堅固菩薩堪能正受淨戒律儀即便依於受戒儀軌如應正授如是與毗奈耶有異此於未受律儀以前令善聽聞而正解了於護學處有堅固心方受律儀若能具足如是意樂能發律儀若未具足不能發起如攝決擇分云若有為令他了知故隨順他故由他勸導受菩薩戒非自所起增上意樂隨觀隨察自生淨信於諸有情住憐愍心愛樂善法受菩薩戒當言此非真實防護亦非圓滿修習善法亦不能得彼果勝利與此相違當知乃名真實防護亦名圓滿修習善法亦能獲得彼果勝利二辨所從受境當審訪求同法菩薩已發大願有智有力於語表義能授能開於如是等功德具足勝菩薩所考藏本云當善訪求發菩薩願之同法者已得律儀具足善巧於語表義能持能解即於如是勝菩薩所須何等境從受律儀當善訪求發菩薩願謂已發願心言同法者即是安住菩薩律儀善巧大乘於受學處作請白等語言所表能持其文能解其義即於如是勝菩薩所從受律儀又諸菩薩不從一切唯聰慧者求受菩薩所受淨戒無淨信者不應從受謂於如是所受淨戒初無信解不能趣入不善思惟有慳貪者慳貪蔽者有大欲者無喜足者不應從受毀淨戒者於諸學處無恭敬者於戒律儀有慢緩者不應從受有忿恨者多不忍者於他違犯不堪耐者不應從受有懶惰者有懈怠者多分耽著日夜睡樂倚樂臥樂好合徒侶樂喜談者不應從受心散亂者不至不能𤛓牛乳頃善心一緣住修習者不應從受有暗昧者愚癡類者極劣心者誹謗菩薩素怛纜藏摩怛履迦者不應從受此亦後文移置於此考藏本云雖有已能具足善巧而亦不應一切菩薩皆可從求菩薩所受淨戒律儀謂若無正信者最初於所正受淨戒律儀無有勝解復不趣入亦不思維不應從受有慳貪者慳貪蔽者有大欲者無喜足者不應從受毀壞戒者於諸學處無有恭敬而慢緩者不應從受有忿恨者多不忍者於他違犯不堪忍者不應從受有懶惰者有懈怠者多分耽著日夜睡樂倚樂臥樂雜衆談論虛度時日者不應從受心散亂者謂其下至不能𤛓牛乳頃於善修心一緣者不應從受極愚鈍者性暗昧者怯劣心者誹謗菩薩素怛纜藏菩薩藏中摩怛履迦者不應從受此依前説所從受境應是善巧大乘故今釋言非是一切能善巧者既可從受論於前文譯為有智此則譯為唯聰慧者前後不符何等受境不應從受謂雖已能具足善巧然亦不應一切菩薩皆可從求菩薩律儀謂若或有意樂毀壞加行毀壞意樂毀壞者即無淨信謂於律儀上無勝解中不趣入下不思維或無功用此以三事釋無淨信當知此三毀壞三信加行毀壞者謂若六度加行毀壞一者愛著身財有慳貪者由彼慳貪增上轉故慳貪蔽者於所未得有大欲者雖已獲得無喜足者是名忍受施違逆品二者犯他勝己無餘律儀攝事分云他勝罪類名無餘罪毀壞戒者現行惡行犯有餘罪攝事分云四種罪類名有餘罪於諸學處無有恭敬而慢緩者是名忍受戒違逆品三者若遇逆緣不堪安忍現前使能令心憤發而忿怒者明記怨害恆恆熱惱而懷恨者於他所犯沙門四法不同分過不堪忍者是名忍受忍違逆品四者不樂善品有懶惰者樂所治品有懈怠者次釋其相所謂多分耽著日夜睡樂倚樂臥樂雜衆談論虛度時日是名忍受精進逆品五者心不善住奢摩他等心散亂者謂其下至不能𤛓牛乳頃令心於善修一緣者是名忍受靜慮逆品六者惡慧此復有二一現行惡慧謂不能由自了知真實極愚鈍者雖為教示亦不了解性暗昧者違拒不受廣大教法怯劣心者二取惡慧因謂誹謗菩薩素怛纜藏摩怛履迦言其不正非能如法是名忍受慧違逆品如是等類不應從受菩薩律儀有疏釋云若約其實無不略具如是過患論中所云意謂不從過甚具者是故若非上品具足如是過失少有過者亦可從受二辨受戒儀軌有二一辨受者儀軌二辨授者儀軌一辨受者軌儀先禮雙足如是請言我今欲於善男子所或長老所或大德所乞受一切菩薩淨戒唯願須臾不辭勞倦哀愍聽授考藏本云先禮雙足既作禮已便應請言我今欲從善男子所求受菩薩淨戒律儀惟願須臾不辭勞倦哀愍我故聽許教授如前所説能受菩薩先向授者接觸雙足而敬禮之謂不恭敬不發律儀故又如勝怨無畏生兩師並云於此應先獻曼陀羅次請白言我今欲於善男子所求受菩薩淨戒律儀惟願須臾不辭勞倦哀愍我故聽許教授謂不求受律儀不發故又勝怨菩提賢燃燈無畏生諸師俱云應當如是三返請白又無畏生勝怨兩師並云爾時合掌蹲跪而坐或右膝著地即如下説諸身威儀隨取皆得此中所云獻曼陀羅亦名獻中園有廣中略供獻儀軌名興無邊廣大供養如本論四十四卷供養親近無量品云或贍部洲或四大洲或千世界二千世界或復三千大千世界乃至十方無邊無際諸世界中下中上品供養如來一切供具菩薩於彼以淨信俱勝解俱心周遍思惟一切隨喜如是菩薩少用功力於如來所興起無邊廣大供養二辨授者軌儀次由能授菩薩於彼求受律儀菩薩先為宣説菩薩律儀廣大勝利又為求受律儀菩薩宣説學處若重若輕令發勇悍隨作是言善男子聽汝今願樂於諸有情未得度者令其得度未解脫者令其解脫未蘇息者令其蘇息未涅槃者令般涅槃紹隆佛種令不斷否汝當於此堅固發心堅固誓願見彼不知如是部類令發勇悍故應宣説此依藏本補譯而出論缺此文故用括號以區別之謂由觀見求受菩薩尚未了知其所求受律儀部類於受律儀令發勇悍令其堅固荷持學處重擔意樂故作是説釋論於此謂應為彼求受菩薩宣説集菩薩學論中引據寂靜決定神變經所説護持律儀勝利及月燈三昧經所説若於現在正法衰時恭敬學處便能獲得勝異熟果又應為説根本重罪衆餘輕罪重輕學處及正法念處經法集經海意經所説不護律儀一切過患令見如是所有勝利及過患已不捨發心堅固受持律儀誓願文廣未載可閲釋論然依吉祥燃燈師所作軌中則於此處捨棄宣説律儀勝利學處重輕唯從善男子起至堅固誓願後加問言非為勝他耶非他勵力所勸受耶又昔諸師於前未得度者四句以後復加問言汝願樂否次更問云汝於今者求受律儀非為勝他耶非他勸受自不自在耶於諸菩薩素怛纜藏菩薩藏中摩怛履迦已聽聞否解否信否能少護持否於如是問即應答言唯然少聞如是一一如儀而答言未度令度等者如有賢論師云聲聞獨覺於所知障未得度者令其得度大梵天等於彼癡等二障繫縛未解脫者令其解脫那落迦等苦未蘇息令其蘇息諸有情類未能得般無住涅槃安處涅槃二修集資糧既作如是無倒請已偏袒右肩恭敬供養十方三世諸佛世尊已入大地得大智慧得大神力諸菩薩衆現前專念彼諸功德隨其所有功德因力生殷淨心或少淨心考藏本云復次求受菩薩正啓請已偏袒一肩普於過去未來現在諸佛世尊現住十方已入大地得大智慧獲大神力諸菩薩衆為作供養現前專念彼諸功德以勝意樂隨功用力所有因力生起殷重清淨信心或復由此生少淨心恭敬供養謂別解脫唯於僧衆申恭敬已便能獲得今此律儀勝過彼故應先向於諸佛菩薩廣作供養方能求得故彼求受律儀菩薩應袒右肩住佛像前即以過去未來現在諸佛世尊現住十方已入大地得甚深智獲廣大力諸菩薩衆為供養境現前專念彼等一切不共功德如是功德皆由成就如是律儀此律儀者是由第一善淨意樂之所發起故以至誠隨自現在功用之力及宿因力生起殷重清淨信心或復由此因緣之力生少淨心恭敬供養取要言之淨除壇地妙善莊嚴中設佛像於旁安設諸菩薩像即自觀想猶如十方諸佛菩薩正現在前先應專念彼諸功德啓殷重信次迎師長坐獅子座如儀軌説作如來想端嚴陳設花香燈等衆多妙供先行禮拜誦讚讚頌師於弟子善導其心於三寶所及師長所令其供獻曼陀羅供及諸物供三請速授戒有智有力勝菩薩所謙下恭敬膝輪據地或蹲跪坐對佛像前作如是請唯願大德或言長老或善男子哀愍授我菩薩淨戒考藏本云即以謙下恭敬之相鞠俯之相膝輪據地或蹲跪坐向彼善巧能授菩薩作如是請唯願善男子或言具壽或言尊者授我正受菩薩淨戒律儀次謙恭相右膝著地或蹲跪坐作如是請若是在家稱善男子若是出家年輕有德應稱大德即具壽年高有德應稱長老即尊者唯願授我正受菩薩淨戒律儀吉祥燃燈師謂應加説云唯願速授又應如是三作請授德光釋云既説有善男子等三種顯示不必定從出家又非決定專從學年長於己者而受律儀吉祥智友尊者云顯密二乘道諸苾芻應從善巧苾芻受非應從餘受是謂苾芻若有堪受二種上勝律儀苾芻即不應從在家等受然亦非謂從所餘受不發律儀四起勝歡喜如是請已專念一境長養淨心我今不久當得無盡無量無上大功德藏即隨思惟如是事義默然而住念住一緣專一長養清淨信心作如是念我今不久當得無盡無量無上大福德藏即隨思惟如是事義合掌默然恭敬而住五問遮難爾時有智有力菩薩於彼能行正行菩薩以無亂心若坐若立而作是言汝如是名善男子聽或法弟聽汝是菩薩不彼應答言是發菩提願未應答言已發考藏本云即由善巧菩薩或立或住於座心不散亂於彼能正趣入菩薩應作是言汝如是名善男子聽或法弟聽汝是菩薩不發菩提願未彼應答言唯然已發爾時善巧能授菩薩或起而立或住於座心不散亂於彼受者作如是言汝如是名善男子聽或法弟聽汝是菩薩不彼應答言是發菩提願未應答言已發作此二問義謂令善警覺種性堪任堅固願心吉祥燃燈師謂問遮難後令發勇悍續更問言欲於我所受諸菩薩一切學處受諸菩薩清淨戒否受者亦應答言願受如是答已方授律儀問遮難者是即印土受菩薩心戒等所通用名在別軌中則問曾犯無間罪否無畏三藏禪要中列為第六問遮難門又如勤策受具戒時亦有此問如大毗婆沙論云來至衆中重問遮難二正行儀軌自此以後應作是言汝如是名善男子或法弟欲於我所受諸菩薩一切學處受諸菩薩一切淨戒謂律儀戒攝善法戒饒益有情戒如是學處如是淨戒過去一切菩薩已具未來一切菩薩當具普於十方現在一切菩薩今具於是學處於是淨戒過去一切菩薩已學未來一切菩薩當學現在一切菩薩今學汝能受不答言能受能授菩薩第二第三亦如是説能受菩薩第二第三亦如是答考藏本云自此以後應作是言汝如是名善男子過去一切菩薩能為學處能為淨戒未來一切菩薩能為學處能為淨戒普於十方現在一切菩薩能為學處能為淨戒於是學處於是淨戒過去一切菩薩已學未來一切菩薩當學普於十方現在一切菩薩今學菩薩一切學處菩薩一切淨戒謂律儀戒攝善法戒饒益有情戒從我受不答言能受能授菩薩第二第三亦如是説能受菩薩第二第三亦如是答為善曉喻儀軌文句一切事義應作是言廣如正文言學處者謂其所應修學之處言淨戒者謂於學處修學自性又此文中初示能為三世菩薩所共學處次説於彼修學之相後總攝為所應受持三種淨戒是所正受三後行儀軌有四一啓白請證二讚揚勝利三酬恩供養四不應率爾宣示律儀一啓白請證能授菩薩作如是問乃至第三授淨戒已能受菩薩作如是答乃至第三受淨戒已能受菩薩不起于座能授菩薩對佛像前普於十方現住諸佛及諸菩薩恭敬供養頂禮雙足作如是白某名菩薩今已於我某菩薩所乃至三説受菩薩戒我某菩薩已為某名菩薩作證唯願十方無邊無際諸世界中諸佛菩薩第一真聖於現不現一切時處一切有情皆現覺者於此某名受戒菩薩亦為作證第二第三亦如是説考藏本云如是由此善巧菩薩於彼能受菩薩乃至獎導三作正受菩薩淨戒律儀令受持已能受菩薩不起於座能授菩薩即於所對佛像之前普於十方現住諸佛諸菩薩衆頂禮雙足合掌白言某名菩薩今已於我某菩薩所乃至三受正受菩薩淨戒律儀我某菩薩於此某名菩薩已受菩薩淨戒律儀能作證明唯願十方無邊無際諸世界中第一真聖於不現知一切時處一切有情皆能現知足具覺者亦為證知乃至三次應如是説又有軌云受戒弟子依其坐次觀想接觸十方佛土佛菩薩足正向十方各三禮拜散華供養起立合掌作啓請云仰祈十方現住諸佛菩薩護念於我以此引端然後師長依文而作啓白請證若當頂禮上下方者即應心緣彼上下方東西作禮言不現知者謂是我等言現知者謂佛菩薩二讚揚勝利如是受戒羯磨畢竟從此無間普於十方無邊無際諸世界中現住諸佛已入大地諸菩薩前法爾相現由此表示如是菩薩已受菩薩所受淨戒爾時十方諸佛菩薩於是菩薩法爾之相生起憶念由憶念故正智見轉由正智見如實覺知某世界中某名菩薩某菩薩所正受菩薩所受淨戒一切於此受戒菩薩如子如弟生親善意眷念憐愍由佛菩薩眷念憐愍令是菩薩希求善法倍復增長無有退減當知是名受菩薩戒啓白請證如是已作受菩薩戒羯磨等事授受菩薩俱起供養普於十方無邊無際諸世界中諸佛菩薩頂禮雙足恭敬而退括號一段移釋於後如是菩薩所受律儀戒於餘一切所受律儀戒最勝無上無量無邊大功德藏之所隨逐第一最上善心意樂之所發起普能對治於一切有情一切種惡行一切別解脫律儀於此菩薩律儀戒百分不及一千分不及一數分不及一計分不及一算分不及一喻分不及一塢波尼殺曇分亦不及一攝受一切大功德故謂受律儀羯磨圓滿從此無間普於十方無邊世界現住諸佛已入大地諸菩薩所法爾能有如是瑞應謂有出生座震動等令其護念如是菩薩正受菩薩所受律儀自此以後得於受時受律儀處能受菩薩生起憶念由憶念故起正智觀由正智觀如實覺知某世界中某名菩薩某菩薩所正受菩薩所受淨戒律儀諸佛於彼覺知如子菩薩於彼覺知如弟生親善意眷念憐愍願彼中間無有留難一切成就由佛菩薩眷念憐愍令此菩薩諸善增廣而無退減如是菩薩所受菩薩淨戒律儀望餘一切所受淨戒律儀由四殊勝名為勝出一者無上最尊最勝無過上故二者無量無邊大福德藏之所隨逐攝受無量福德果故三者第一最上善心意樂之所發起是由利樂一切有情增上意樂所發起故四者普能對治一切有情趣入三業一切惡行故其受別解脫律儀者望此菩薩淨戒律儀所有福德百分千分數分計分算分喻分塢波尼殺曇分亦不及一三酬恩供養如是已作受菩薩戒羯磨等事授受菩薩俱起供養普於十方無邊無際諸世界中諸佛菩薩頂禮雙足恭敬而退此係前段移置於此師與弟子俱起於座普向十方無邊無際諸世界住諸佛菩薩復作如前所作供養觀想接觸佛菩薩足而行頂禮既頂禮已恭敬而退四不應率爾宣示律儀又諸菩薩於受菩薩戒律儀法雖已具足受持究竟而於謗毀菩薩藏者無信有情終不率爾宣示開悟所以者何為其聞已不能信解大無知障之所覆蔽便生誹謗由誹謗故如住菩薩淨戒律儀成就無量大功德藏彼誹謗者亦為無量大罪業藏之所隨逐乃至一切惡言惡見及惡思惟未永棄捨終不免離此係後文移置於此雖能於此受學菩薩律儀儀軌受持其義究竟其文而於憎背菩薩法藏不信不解諸有情所不應率爾不擇於他是器非器宣示其文開悟其義所以者何為其聞已不能信解大無知障之所覆蔽便生誹謗言菩薩藏不善匪宜無有義利此如安住律儀菩薩專一成就無量福藏彼誹謗者口惡言謗意著惡見想倒現行諸惡思維乃至一切未永棄捨唯為無量大罪業藏之所隨逐此依吉祥燃燈師所説於終行軌攝為四科在本論中亦有此義又此論師謂啓白請證已接作酬恩供養本論所示亦復如之今為便於實際應用酬恩供養列於讚揚勝利之後二無師儀軌又諸菩薩欲受菩薩淨戒律儀若不會遇具足功德補特伽羅爾時應對如來像前自受菩薩淨戒律儀應如是受偏袒右肩右膝著地或蹲跪坐作如是言我如是名仰啓十方一切如來已入大地諸菩薩衆我今欲於十方世界佛菩薩所誓受一切菩薩學處誓受一切菩薩淨戒謂律儀戒攝善法戒饒益有情戒如是學處如是淨戒過去一切菩薩已具未來一切菩薩當具普於十方現在一切菩薩今具於是學處於是淨戒過去一切菩薩已學未來一切菩薩當學普於十方現在一切菩薩今學第二第三亦如是説説已應起所餘一切如前應知此係後文移置於此若不會遇如前所説具足功德補特伽羅爾時應對如來像前自受菩薩淨戒律儀偏袒右肩右膝著地或蹲跪坐作如是言我如是名仰啓十方一切如來已入大地諸菩薩衆我今欲於佛菩薩前正受菩薩一切學處菩薩一切淨戒謂律儀戒攝善法戒饒益有情戒過去一切菩薩已學未來一切菩薩當學普於十方現在一切菩薩今學如是三説説已應起所餘一切如前應知謂所餘儀軌悉皆同於有師儀軌諸餘疏中亦未明説所餘一切應取捨處然於作問答類及啓白請證不率宣示諸則似可捨棄言有師無師者如大乘寶要義論疏云若有生命淨行之礙雖距師近與無師等若無生命淨行之礙雖所在遠亦應訪求又新疏云於先所受已曾毀犯後還淨者若受律儀不恭敬者皆不應依無師儀軌應依有師儀軌而受言受律儀不恭敬者謂雖有師不起恭敬信由自受亦名如實然亦於先所受已曾毀犯後還淨者舊疏則云若有師者當從師受若無師者得依無師儀軌而受復引菩薩地中無師儀軌證成其義謂此即是無著密意以無著菩薩於説於犯還出還淨時處續説若不會遇具足功德補特伽羅等文句故寂天菩薩云我此世有果善得人種類今生佛種中現前為佛子是謂已得此律儀者應即思維今此世中已不空度獲得人身受持法藏幸得側入菩薩衆中又云我今盡所能作合種姓業此淨無瑕種不應令污垢謂起意樂念從今後不令染著諸罪污垢上來釋受戒法竟
