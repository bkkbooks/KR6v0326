body:
  text: 民國湯薌銘譯纂三釋防護戒法有二一總示防護之法二別釋防護之法一總示防護之法又此菩薩安住如是菩薩淨戒先自數數專諦思惟此是菩薩正所應作此非菩薩正所應作既思惟已然後為成正所作業當勤修學又應專勵聽聞菩薩素怛纜藏及以解釋即此菩薩素怛纜藏摩怛履迦隨其所聞當勤修學考藏本云如是菩薩安住所受菩薩淨戒律儀自審思擇此是菩薩正所應作此非菩薩正所應作既審思維自此以後為令如實成辦作業當善防護又應專勵聽聞菩薩素怛纜藏或復聽聞攝集菩薩素怛纜藏一切本母如是於彼素怛纜中如來所說一切菩薩百千學處為成辦故如實修學謂此菩薩安住所受菩薩淨戒律儀應自數數專諦思擇此是菩薩正所應作此非菩薩正所應作令其了知應行止處自此以後應如决擇如實成辦其所作業而善防護又應專勵聽聞菩薩素怛纜藏或彼攝集素怛纜藏摩怛履迦為令成辦素怛纜中所說百千菩薩學處隨其所聞如實修學集菩薩學論亦云菩薩律儀者出於廣大乘又云不捨善知識恆閲諸契經是謂修習菩薩學處最主要者即善知識若能不捨是為第一防護方便又應總於一切契經別於本論菩薩地分及集菩薩學論而善聽聞若尚不能定應聽聞戒品全部若或僅此亦未聽聞便極暗昧菩薩所學唯是假名大乘行者雖能欺誑諸愚夫數必為修習大乘勝典已獲定解諸有智者之所棄厭又於彼等既聽聞已應以精勤修學所學莫如貧人數他財寶法句經云雖多巧言說放逸不正行如牧數他畜不堪證沙門又云雖不巧言說能行法隨法遠離貪瞋癡堪能證沙門又趣入菩薩行論云當以身行持空言何所成徒誦諸藥方何益患病者問若爾初修業者於契經中所說學處幾當修學答有佛如來已正遮止初修業者或未遮止而不宜於初修業時所實行者舍此二外於餘一切菩薩學處若不修學名為有罪此如集菩薩學論云諸為菩薩總立教誡而又非所應頓修習或已遮止初修菩薩不當修學若非此二於餘一切皆應修學又除此二已開聽外若俱修學而無力能亦得無罪亦如集菩薩學論云若為修行一學處故於餘學處雖未能護亦無有罪如無盡意經云若修施時便於戒學容可遲鈍於如是等乃至廣說然亦爾時不應慢緩如十地經云非於所餘不復修行當隨力能如應修習若正修學彼諸學處或能為罪或不為罪有二道理一者若為生起一切有情一切喜樂及為止息一切憂苦不以無諂至誠三業精勤令其成辦生輕捨者是名有罪如是縱於一剎那時生輕捨者亦名有罪若或精勤成辦而不尋求順緣資糧不勤對治精進逆緣如前輕捨亦名有罪若時遇有小憂小苦不起對治大憂大苦及為成辦廣大義利不能捐去微小義利於一剎那輕捨者亦名有罪若諸學處非自力能不修習者得無有罪此為無制立學處故攝事分云建立為犯名有制立與此相違名無制立無義利故反之於此若強行者是名有罪如是之罪得於總悔罪中合悔不須別悔亦得還出於力所能一切學處而不精進是名有罪論於此罪說名性罪謂與知而故犯同分二者能為有罪略由二種菩薩有罪一未思擇行所犯之罪二雖已思擇越其所應所犯之罪初未思擇者謂若未能隨力思擇應理與否便爾發趣或復退此或復放捨是名有罪二已思擇者謂雖思擇應理與否而竟違越應進應止及所應捨於彼邪行下至違越旃陀羅奴所譏毀事亦名有罪廣如集菩薩學論初品所說又於正所應作非所應作如律儀二十頌總攝其義云於自或於他有情雖苦有利所應作有利有樂正應作樂而無利非應作所言利者非染無罪故於當來世感樂異熟所言樂者即是樂受若於自他現前有樂究竟有利定應成辦若於自他現前有苦究竟無利定不應作現前雖苦究竟有利是所應作譬如正士訶責遮止行惡行者現前似苦然如辛藥其味極惡現似辛苦有利於病故應習近又如欲邪行現前似樂於未來世增長多苦此同甘飯和以毒物亦應阻止如是諸義廣如菩薩地利益種類自利利他安樂種類自利利他中說又諸菩薩不從一切唯聰慧者求受菩薩所受淨戒無淨信者不應從受謂於如是所受淨戒初無信解不能趣入不善思惟有慳貪者慳貪蔽者有大欲者無喜足者不應從受毀淨戒者於諸學處無恭敬者於戒律儀有慢緩者不應從受有忿恨者多不忍者於他犯違不堪耐者不應從受有懶惰者有懈怠者多分耽著日夜睡樂倚樂臥樂好合徒侶樂喜談者不應從受心散亂者不至不能牛乳頃善心一緣住修習者不應從受有暗昧者愚癡類者極劣心者誹謗菩薩素怛纜藏摩怛履迦者不應從受此段已釋於辨所從受境科又諸菩薩於受菩薩戒律儀法雖已具足受持究竟而於謗毀菩薩藏者無信有情終不率爾宣示開悟所以者何為其聞已不能信解大無知障之所覆蔽便生誹謗由誹謗故如住菩薩淨戒律儀成就無量大功德藏彼誹謗者亦為無量大罪業藏之所隨逐乃至一切惡言惡見及惡思惟未永棄捨終不免離此段已釋於不應率爾宣示律儀科又諸菩薩欲授菩薩菩薩戒時先應為說菩薩法藏摩怛履迦菩薩學處及犯處相令其聽受以慧觀察自所意樂堪能思擇受菩薩戒非惟他勸非惟勝他當知是名堅固菩薩堪受菩薩淨戒律儀以受戒法如應正授此段已釋於辨所依身科二別釋防護之法有六一所斷之罪二從彼罪中護心之相三犯已還淨方便四佛說貪是輕罪密意五分別所犯罪有大小六安樂住因一所斷之罪將欲明了所斷之罪先當明了何所依身乃生諸罪所生之罪當有幾類所依身者如論說云又一切處無違犯者謂若彼心增上狂亂若重苦受之所逼切若未曾受淨戒律儀當知一切皆無違犯是謂應具二法一已得律儀尚未捨失二意樂靜止罪品類者決定二種如律儀二十頌舊疏云以是義故菩薩律儀唯說二分犯罪品類等他勝處法所攝別解脫律儀名他勝處亦名波羅夷罪菩薩律儀名等他勝處後當廣釋惡作法所攝此即突吉羅罪之惡作非如苾芻律儀中說有五罪聚一他勝罪聚二衆餘罪聚三隕墮罪聚四別悔罪聚五惡作罪聚又新疏及牟尼密意莊嚴論亦說罪之集體或其品類決定二種本論義亦如是顯示藏土有師及黑行阿闍黎釋難中說云菩薩律儀有他勝處復有粗罪即𡨧吐羅罪及惡作罪此一切罪所應防護如是說者立為三類不應道理若許三類應以一切軟中品纏所犯之罪列為粗罪然論則以軟中纏罪說於等他勝處法及惡作中是故於軟中品纏罪性是惡作而其部類是他勝類謂如苾芻犯他勝處中一切粗罪及惡作罪俱建立為他勝部類以下釋文於等他勝仍稱他勝依上所說所斷之罪分為二類一他勝處類二惡作類初復有五一分別他勝自性二他勝作用三三種纏犯分別四堪能還淨殊特五捨戒因緣一分別他勝自性如是菩薩住戒律儀有其四種他勝處法何等為四考藏本云如是菩薩有其四種住戒律儀等他勝處法此他勝中復有二支一共支二不共支共支於後三種纏犯分別中說不共支者有其四種第一他勝處若諸菩薩為欲貪求利養恭敬自讚毀他是名第一他勝處法此中有三一所對說境二所說言詞三言說發起初所對說境依於彼境方名他勝故應別異於自相續識別語言領解其義與己同類一趣衆生論本於此雖無明文實有其義二所說言詞謂自功德及他過失即此名為自作讚揚於他有德為諸有情所恭敬處而起譏毀三言說發起此復有四一所求利養恭敬之量二貪心之量三其所從得利養恭敬境之分別四計所發起是否定須利養恭敬二者俱貪一所求利養恭敬之量者謂衣服飲食住舍車乘等隨一利養獻座設位等所有敬事隨一恭敬二貪心量者謂其所求利養恭敬非為供養三寶及為哀愍諸下劣故解其貧乏而於利敬自體貪愛增上耽著三境分別者謂所從求利養之境定與自財非一分攝若不爾者自讚毀他無義利故若求恭敬不須財物與自不共於自徒衆亦能求故印藏師徒財物共用故於徒衆能求恭敬非求利養四計所發起是否定須俱貪二者謂於自讚或譏毀他定須貪著利敬隨一非必俱貪利敬二事即以如是為發起故隨其讚毀所作言說為彼有情領解其義即得成為第一他勝諸疏所釋與此相同如律儀二十頌新疏云他者謂是具足功德為諸有情所恭敬處薩穆札疏所說亦同亦謂他是有功德者唯集菩薩學論引虛空藏經謂有二義一者毀謗其所恭敬補特伽羅二者亦毀其所毀謗補特伽羅言利養恭敬及貪著利養恭敬者新疏云由求利故名為利養謂衣食等作妙供事名為恭敬若於彼等增上貪戀即名貪著薩穆札疏亦云利養之相謂諸衣食及財寶等言恭敬者謂是尊敬供事承侍獻床座等第二他勝處若諸菩薩現有資財性慳財故有苦有貧無依無怙正求財者來現在前不起哀憐而修惠捨正求法者來現在前性慳法故雖現有法而不給施是名第二他勝處法此中有四一來求者二所求物三所從求處四由何意樂而不惠施一來求者有疏云所言苦者謂不具足諸財物等所言貧者謂乏飲食言無怙者謂彼無有如家主等為作養育言無依者謂無親友或無有能作助益者取要言之謂彼匱乏二種受用今舍菩薩無有所餘能為開解如實至誠來現在前而乞求故薩穆札疏云此是求者正現在前二所求物者非軍器等諸不宜物及非毒等諸凶惡物然此諸物亦觀彼時有無損害三所從求處者謂自現有如新疏云有可施物善了知法四由何意樂者謂慳吝所蔽定不施捨此中性慳財故一句梵本原文為性貪著故而律儀二十頌新疏及薩穆札疏中俱釋為其性慳故論依釋義譯性慳財第三他勝處若諸菩薩長養如是種類忿纏由是因緣不唯發起粗言便息由忿蔽故加以手足塊石刀杖捶傷害損惱有情內懷猛利忿恨意樂有所違犯他求諫謝不受不忍不捨怨結是名第三他勝處法考藏本以諫謝譯為悔謝此中有二一捶二不受諫謝初捶者復有二種一意樂二加行初言意樂若諸菩薩忿他有情發粗惡言唯發粗言猶不捨忿而令長養為忿所蔽次言加行忿增上故或以自身若手若足或身所擲若塊石等或身所佩若刀杖等而捶他或囚閉等而作傷害或施鞭撻或羈縛等而作損惱此中境者何趣有情在本論中雖無明文似應與自一趣同類領解義者謂是發起粗惡語言所對說境故集菩薩學論亦說於犯戒中捶有情是根本罪二不受諫謝此復有四一作諫謝者二作諫謝相三發起不受四不受諫謝自性一作諫謝者新疏最勝子疏並云作侵犯者今來悔謝其侵犯罪謂他有情昔於菩薩曾作侵犯今以至誠而求悔謝二作諫謝相謂以應時如法儀式而求忍恕三發起不受謂於昔所侵犯內懷猛利忿恨意樂四不受諫謝自性謂不聽所言不許忍恕不捨怨結第四他勝處若諸菩薩謗菩薩藏愛樂宣說開示建立像似正法於像似法或自信解或隨他轉是名第四他勝處法考藏本云於菩薩藏興起毀謗又由自內或隨逐他而起信解像似正法已於像似法深生愛樂開示建立是名菩薩等他勝處法此中有二一毀謗大乘二開示像似法初毀謗大乘又復有二一所毀謗事謂總於佛說甚深廣大二菩薩藏二毀謗之相如下所說而作毀謗此段末尾及毀謗背捨大乘藏之惡作中廣釋毀謗之相二開示像似法亦復有二一所開示法諸疏於此皆未明說唯薩穆札疏謂是微褊教法即小乘法或外道法然如論說像似正法當亦非是像似大乘應是一切隨順黑品教法二開示之相謂於彼法如自愛樂向他開示復安立他於如是見如本論九十九卷總擇攝第五云云何名為像似正法謂略有二種像似正法一似教正法二似行正法若於非法生是法想顯示非法以為是法令他於中生正法想如是法教實故諦故非是正法而復像似正法顯現是故名為似教正法若廣為他如是宣說令他受學亦自修行妄起法想習諸邪行而自憍慢稱言我能修是正行應知是名似行正法自此以下廣說像似正法之相如是四種他勝處法菩薩律儀二十頌中總攝其義云諸由猛利煩惱犯即能毀壞淨律儀其所犯罪有四種密意名為等他勝為貪利養恭敬故便爾自讚而毀他於彼有苦無怙者慳諸財法不施與他來悔謝不聽受由忿於他行捶毀謗大乘菩薩藏開示像似於正法菩提賢師釋云言猛利煩惱者謂上品纏其所犯罪者謂具律儀菩薩所犯之罪為他所敗即由彼等毀壞律儀故云他勝唯約毀壞律儀之因與諸苾芻犯他勝同名等他勝非一切同謂諸苾芻犯他勝己於現法中不任更受此中有犯能更受故言等他勝者海雲疏云如彼聲聞由淫欲貪破壞自他不復堪任如是菩薩愛樂味著利養恭敬亦壞自他若諸聲聞由貪欲故謂於他所有起已有欲樂起染汙心若於他所有起已有欲樂决定方便及於彼究竟中所有意業盜他財物即成他勝如是菩薩現有財法而不惠施亦成他勝聲聞殺人即成他勝如是菩薩於諸有情起忿恨心以手足等而作損惱復不聽受作侵犯者前來悔謝亦成他勝聲聞妄說得上人法即成他勝菩薩有法而不開示毀謗正法開示非法亦成他勝又有疏云與別解脫他勝處罪名數等起皆相等故名等他勝此中他勝分有八種論中說為四他勝者是約意樂他勝罪說謂於利養恭敬起貪求心於諸受用有慳吝心於諸有情起損惱心於佛正法邪行愚癡名四他勝立為八者約加行說謂如於自讚揚於他譏毀不惠捨財不給施法捶有情不受諫謝毀謗正法說像似法如是八者俱名他勝故由是因緣從論所說四中分八亦非無義又如牟尼密意莊嚴論云菩薩藏中唯說四種根本重罪又云自讚毀他及不施等四根本罪一一罪中各分為二共成八種論中亦於讚毀等八分別說故海雲疏中於釋第二他勝處時說云不惠捨於苦行乞者或不給施其現有法並是他勝是分別釋皆成他勝以理推之餘三亦爾無畏生師亦云有八大乘寶要義論疏云無著菩薩於此顯然說八他勝吉祥燃燈依昔傳承善知識義亦立為八故應於此說八他勝雖集菩薩學論及菩薩律儀二十頌並似於第三他勝法攝為一種此係譯文稍有別異若按其義應有二種謂如律儀二十頌舊疏所釋與菩薩地正文相同故又智慧生趣入菩薩行論疏中引據集菩薩學論文云由忿捶諸有情勵力為作歡慰時終不忍恕彼有情是於第三亦分為二問若一一罪分立皆得成為他勝云何二十頌中於後諸罪說為惡作如頌說云於來求法不施與於求財物不給施於他罵等輒還報他來悔謝拒不受毀謗背捨大乘藏精非所精異外論研異外論而愛樂如是等事列為惡作今說他勝是則相違答曰無過謂如不施財法二者須慳發起名為他勝非慳發起名惡作故又新疏云如不施法由發起故罪有不同於餘亦由發起不同而有分別此如他打報打謂於他打而還報者即名惡作非報而打名為他勝不受悔謝非有忿恨說名惡作若有忿恨名為他勝毀謗大乘亦有惡作與他勝別如薩穆札疏云若爾與前他勝位中謗菩薩藏云何差別謂前是毀謗遍於一切大乘法藏此則唯於素怛纜藏少分深品未能解悟而起毀謗然依論文所顯似非定須單謗甚深一分勤學外論說名惡作此有二種一者現有所應精勤如來善說未精研究於異道論精勤修學是名有犯二者若有利根無動覺者常以二分勤修佛語乃得開許兼勤外論然亦不許於彼外論愛樂趣入是故若有愛樂味著即名惡作而於開示像似正法名他勝者謂彼不唯自起愛樂如自愛樂而勤修習亦安立他令其修習如海雲疏云其有開示非正法者犯他勝罪言愛樂者自希樂故言開示者如自愛樂為他說故言建立者誘導令修故若爾云何頌中乃以於自讚揚而毀他說為惡作答此亦由其發起不同他勝如後惡作罪中當說是故應依如是道理斷相違相不應別依有無慚愧而判別之謂有慚愧雖尚未成為他勝罪隨一應成軟中品纏藏土諸師於他勝罪分立為八廣有辨駁詳釋論中今不具引二他勝作用亦名他勝過患如是名為菩薩四種他勝處法菩薩於四他勝處法隨犯一種况犯一切不復堪能於現法中增長攝受菩薩廣大菩提資糧不復堪能於現法中意樂清淨是即名為相似菩薩非真菩薩德光云言增長者謂於所積令其增盛言攝受者謂令生起餘疏釋云無力積集近通達地所有資糧言意樂清淨者諸疏皆云是得大地謂得初地以要言之於他勝處隨犯一種即便不能於現法中證得初地其先已有近初地因廣大資糧不堪增長先所無者不堪生起何况數數犯他勝處以是義故莫作是念雖犯他勝仍可重受菩薩律儀寧捨身命定不染犯根本重罪如趣入菩薩行論云如是重罪隨行力勝菩提心隨行力展轉起伏生死中長夜障礙得大地此中言犯四他勝者依本論說而集菩薩學論中所說一切他勝詳釋論中與此作用亦復相同又此過失虛空藏經亦有所說如經云能正趣入大乘道中初修業者誤犯如是根本重罪焚毀宿昔所植善根成為他勝便從人天大乘樂處墮入惡趣於長夜中流轉生死失善知識三三種纏犯分別菩薩若用軟中品纏毀犯四種他勝處法不捨菩薩淨戒律儀上品纏犯即名為捨若諸菩薩毀犯四種他勝處法數數現行都無慚愧深生愛樂見是功德當知說名上品纏犯考藏本云菩薩若由軟中品纏有犯如是四他勝處不捨所受淨戒律儀上品纏犯方能捨失所以者何由諸菩薩若於四種他勝處法相續未斷而起現行如攝異門分云現起相續無斷絶義說名為纏亦不生起少分慚愧由此令愛於彼欣樂又即於彼見為功德當知是名上品纏犯由何種纏不名為捨由何種纏方名為捨菩薩若由軟中品纏有犯四種他勝處法不捨所受淨戒律儀由上品纏犯已即捨此中所云他勝處者如前所說約意樂門但有四種約加行門則分為八謂如貪求利養恭敬等以此八種而類推之集菩薩學論所引虛空藏經諸罪若不具足上品纏者不成他勝以本論中於謗大乘及貪利敬自讚毀他罪更重於彼論所說五無間罪亦復說為若不具足上品纏者不成他勝故自餘諸罪應知亦爾然起邪見失菩提心暫起即犯不須具足上品纏犯廣如釋論已分別說是故虛空藏經所說諸罪若未具足上品纏者應知亦是軟中纏犯謂本論說他勝類中一切尚未成他勝者名為軟品中品纏故所言上品纏者謂犯四種他勝處法數數現行都無慚愧深生愛樂見是功德當知說名上品纏犯此有四支第一支者謂犯四種他勝處法數數現行若於四種他勝處法相續未斷而起現行言四種者有疏說云此謂隨犯一他勝法非必四種全犯無闕言數數現行者藏土有師云此是有犯二次以上復有師云此須具備加行根本後起三事然如印土諸清淨疏均無是說義亦不爾非所應取此中義者謂行一種趣向他勝後後於彼尚復欲行望彼前者相續未斷如新疏云猛利煩惱者謂一切纏於後相續未斷現行亦不生起少分慚愧薩穆札疏亦云或此四種他勝處法或此四中隨一他勝後後時中復欲現行又海雲最勝子並云相續未斷現行衆多他勝處法便能令其一切種中毀壞慚愧是故說云亦不生起少分慚愧是謂相續未斷而現行者為能毀壞慚愧之因義同上來二疏所說復有疏云未越定時相續未斷而起現行釋論於彼廣引駁斥後當略說第二支者謂都無慚愧亦不生起少分慚愧言慚愧者如菩薩地云菩薩將欲現行罪時若能了知非我應作羞耻名慚又即於此恐他呵責羞耻名愧如是二法其所緣者謂自惡行其行相者謂令羞耻其差別者謂念此非我所應作觀自因緣羞耻名慚又若恐他呵責匪法觀他因緣羞耻名愧如是二法乃至下品都不生起况上中品於何種事不生慚愧謂於趣行往犯他勝所有惡行故說此二俱不生起往犯他勝若生少分慚愧隨一不成他勝若爾此二於何等時應能生起或不生起有說慚愧生不生者當在現行趣犯他勝惡行不久定時之內然不應理釋論於彼廣有駁斥後當略說第三支者謂深生愛樂由此令愛於彼欣樂言由此令愛者海雲最勝子並云由此無慚令其愛著謂即由此不生慚羞諸事惡行而起愛著或即由此無慚無愧於其所作令生愛著薩穆札疏亦云是即由其無慚無愧令生喜樂是謂唯於趣入惡行不生羞恥尚非完足更應由此所作惡行自心愛著言於彼欣樂者海雲最勝子並云於彼惡行現行不捨問如是四支前中諸支立為基本若後有闕不名具足上品纏支故添後支若無不捨便成能捨若能捨者即是能生羞恥之心則第二支亦成有闕答此不捨者非說觀見過患而不捨離若爾云何不能捨離如德光云愛由意樂深生歡喜樂由加行安住其事是謂於彼惡行歡喜名愛欣樂成辦彼諸惡行加行名樂似與此論密意相符若爾則與數數現行中後欲現行意相重復答無重復過前是希欲後是欣樂此二心所各別異故第四支者謂見是功德又即於彼見為功德此中義者海雲最勝子並云於彼所作不見過患設作是念若見過患云何不生羞恥之心云何於彼而有愛樂當知此語實不相違謂見過患是慚愧因非慚愧體故又或有能觀見過患而尚愛樂現行其事如具戒者行欲邪行德光云若即於彼他勝處法諸有性好念為功德是名見為功德如是說者意謂於諸他勝處法非執受為無有過失而於彼等如說妙欲見為可欲而不見為不可欲品諸疏所釋皆同此義依德光釋與本論五十三卷攝决擇分所云若顛倒心相續而轉於諸過失見為功德是名惡慧其義略異以此尚非執受顛倒故茲取第一第二支中所立定時義者略破所說第一支數數現行中有說定時者謂如大乘寶要義論疏云所言相續未間斷者謂越定時未能間斷古德多有申釋其義云於定時中不生慚愧未由慚愧令其間斷此不應理如其所釋則是數數現行都無慚愧二義為一即與論中原列二支所說相違又於論中所說支分添定時支則菩薩地上品纏支尚未具足又若任人可添支者則是論中支分無定可添衆多有無盡過又以理推如自讚等亦須同類無有間斷是又太甚第二支都無慚愧中有說定時者謂如優婆離所問經云若諸菩薩日初分時有所犯戒於日中分不離菩提心是名菩薩戒身不壞如是若日中分犯於日後分不離若日後分犯於夜初分不離若夜初分犯於夜中分不離若夜中分犯於夜後分不離若夜後分犯於日初分不離菩提心是名菩薩戒身不壞如是由第一日初分至第二日初分晝中三分夜中三分一晝夜中總名六分是即所立定時時分此亦非理若依經義便誤認為有定時者則應於此定時中間已起對治然如經云日初分時有所犯戒於日中分不離菩提心此二定時各別體故又本論說有無慚愧及見其過或不見過經中則說不離願心故不應理釋論於諸立定時義廣引優波離所問經方便善巧經集菩薩學論道炬論疏等分破其說又復廣明菩提心力能淨諸罪及大乘宗與大乘人犯別解脫還淨差別文廣未載可閲彼論上來略破有定時論今說正義問上品纏中定須具足都無慚愧不見過患如是二支屬遮詮門後欲現行深生愛樂如是二支屬表詮門二遮詮門為應起於何時乃至何時二表詮門為應起於何時乃至何時答都無慚愧不見過患二遮詮門從初發趣乃至正行圓滿無間以前須永不現於其中間若慚若愧若見過患隨一出生上品纏支便不具足後欲現行深生愛樂二表詮門亦隨彼時從其現起乃至正行圓滿無間以前意於彼事應未除遣若謂定須同類無間是又太甚然亦應知云何乃是中品纏犯軟品纏犯海雲德光最勝子及菩薩律儀二十頌舊疏中皆未宣說唯薩穆札疏中說有二義一自宗義有奔赴煩惱流注煩惱墮煩惱中三種分別謂初為煩惱暫一生起次生起已令心流注於煩惱中後為煩惱其力增上如是建立為軟中上三品纏犯二他宗義謂可順合寶雲經說依彼三毒分上中軟前者逈異本論明文後與論義亦不契合又律儀二十頌新疏云於四支外更加他勸不止一支圓成五支為上品纏他勸即止為中品纏由自力故不待他勸能速疾止為軟品纏此亦非理若造疏者可任添支則支界分無定量故然則云何方名正義答上師無著既立三纏有所差別於三纏罪便應認識若不識知則不能辨何種纏犯應於三補特伽羅前行悔罪法何種纏犯應於一補特伽羅前行悔罪法此於餘處亦未詳說顯由認識上品纏門方能了知此中深生愛樂後欲現行屬表詮門不見過患屬遮詮門如是二門顯示後者煩惱粗重雖有前者若見過患能生羞恥若一切中不見過患無地可能生羞恥故又見過患雖不遍能慚愧相應若不見過則慚與愧遍不生故是故其時尚未具足上品纏支若有見為過患一門雖餘三支皆已具備應知亦是軟品纏犯若無見為過患一門應知即是中品纏犯又若不能見為過患定無慚愧若起慚愧決定已能見為過患故此二支於遮詮門不須別計四堪能還淨殊特非諸菩薩暫一現行他勝處法便捨菩薩淨戒律儀如諸苾芻犯他勝法即便棄捨別解脫戒若諸菩薩由此毀犯棄捨菩薩淨戒律儀於現法中堪任更受非不堪任如苾芻住別解脫戒犯他勝法於現法中不任更受謂諸菩薩暫一現行他勝處法不捨所受菩薩律儀此中義者謂不同於捨別解脫如論說云如諸苾芻犯他勝法即便棄捨別解脫律儀意謂不同別解脫中犯他勝法捨已重受不能復發如前所受而竟棄捨有說一次犯他勝法尚不名捨多次現行方名為捨此義不合是故論中尋又說云是諸菩薩由此毀犯捨失所受於現法中堪任更受非如苾芻犯他勝己不堪更受設作是問犯別解脫他勝處法而無覆藏雖捨前戒若更受者豈非說名亦是近圓何故此云不堪更受答此有二說有部立論謂若無覆不成他勝一切他勝有覆藏故如是說者是許還住不名更受然亦此中是密意說犯他勝者為小乘身如釋論中已廣釋說有立論云雖無覆藏仍名他勝亦終不同菩薩律儀堪任更受謂諸菩薩既更受已仍能發起清淨律儀若小乘身雖復更受不發清淨苾芻律儀故由望身境說為近圓及非近圓二種不同故附注所言無覆有犯無犯大毗婆沙論亦有所說如彼論云問住別解脫律儀者犯律儀時捨律儀不外國諸師作如是說彼捨律儀得非律儀非不律儀若時發露無覆藏心如法悔除便捨非律儀非不律儀還得律儀若作是說便為善通發露悔過還住律儀作法悔除亦非無用有餘師說彼犯律儀時捨律儀得非律儀非不律儀若時發露無覆藏心如法悔除便捨非律儀非不律儀而不得律儀問如說發露悔過還住律儀當云何通如法悔除豈非無用答住善意樂名住律儀爾時捨惡意樂發善意樂故非無用然實此位不得律儀復有說者彼犯律儀時現在律儀斷得非律儀非不律儀而成就過去律儀若時發露無覆藏心等如第二說或有說者彼犯律儀時初剎那斷次後復續迦溼彌羅國諸論師言彼犯律儀時不捨律儀而得非律儀非不律儀是故爾時名住非律儀非不律儀亦名住律儀者若時發露無覆藏心如法悔除便捨律儀非不律儀但名住律儀者如有富者負他債時名負債者亦名富者後還債已但名富者若作是說便為善通發露悔過還住律儀作法悔除亦非無用若爾於別解脫不可還淨菩薩律儀雖犯他勝容可還淨有何因相答海雲則云諸聲聞以別解脫律儀為一切善法依處故名為根本律儀若或斷毀現行猛利無慚無愧壞慚愧已即於現法不復堪任正受律儀菩薩不爾於現法中雖已捨失菩薩律儀而於現法堪任更受以此尚不壞失慚愧故是謂若犯別解脫他勝能壞慚愧犯菩薩律儀他勝不壞慚愧為其因相又最勝子及薩穆札亦如是說謂別解脫為一切善法依處故是其因相然依彼說設更有問於犯別解脫他勝法者而來正受菩薩律儀當發不發依彼說者諒難解答故其因相依理應如二經所說如優波離所問經云於聲聞人犯他勝法其戒永盡所以者何諸聲聞人應令斷除一切煩惱如滅頭然以是義故聲聞學處不可還淨又如方便善巧經云善男子於中菩薩方便善巧謂若有時諸惡朋疇增上力故有所違犯應如是學作如是念我今若或即以此蘊而般涅槃則令我心引起熱惱我為成熟諸有情故擐甲精進盡未來際住生死中我今不應熱惱自心我應如如流轉生死如是如是成熟有情我應如法還淨此罪不應當來更有所犯善男子假使出家菩薩雖犯一切四根本罪若勤思擇便能以此方便善巧而能遣除我說菩薩不名有罪釋論於此廣有釋說又別解脫是大小乘二所依身所共有者故大小乘俱有別解脫然佛所由制立別解脫者首依小乘補特伽羅為所被機謂小乘人於現法中諸有堪能或不堪能得阿羅漢而彼皆應於現法中為盡諸漏擐著誓甲勤斷煩惱有如勇猛息滅頭然故受律儀令於現法證得漏盡設以有覆而犯他勝不能此生得漏盡故違受律儀主要所為若諸菩薩菩薩律儀增上力故犯根本罪尚未違反其受律儀主要所為此為菩薩與諸聲聞堪能不能還淨因相前引二經可證斯義又毗奈耶經大疏云為解脫故而受律儀若犯他勝距離解脫至為遙遠雖有律儀何異於無五捨戒因緣略由二緣捨諸菩薩淨戒律儀一者棄捨無上正等菩提大願二者現行上品纏犯他勝處法若諸菩薩雖復轉身遍十方界在在生處不捨菩薩淨戒律儀由是菩薩不捨無上菩提大願亦不現行上品纏犯他勝處法若諸菩薩轉受餘生忘失本念值遇善友為欲覺悟菩薩戒念雖數重受而非新受亦不新得考藏本云以要言之唯由二因捨所正受菩薩淨戒律儀一者捨失無上正等菩提大願二者現行上品纏犯他勝處法若諸菩薩從未捨願亦未現行上品纏犯他勝處法雖復轉身於上中下一切生處由是菩薩不捨所受菩薩淨戒律儀若諸菩薩轉受餘生忘失本念依止親近諸善知識為令還復菩薩戒念雖數重受不名新受總唯二因捨失所受菩薩律儀一捨失正等菩提大願二以上品纏現行他勝處法若爾云何攝决擇分說有四因如攝决擇分云又捨因緣略有四種一者决定發起受心不同分心二者若於有所識別大丈夫前故意發起棄捨語言三者總別毀犯四種他勝處法四者以上品纏總別毀犯四種他勝處法由此因緣當知棄捨菩薩律儀又於後二捨戒因緣云何分立差別之相答菩薩地中說二捨緣攝决擇分數多於彼然不相違前者為本後為釋故此中捨戒第一因緣言發心者謂是發起小乘之心此由發起與彼往昔受律儀時由利有情為求證得正等覺心而乃受心決定相違不同分心即是捨失願心復次捨戒第二因緣謂於領解事義人前發起棄捨學處語言為彼了解此與棄捨別解脫律儀事有不同謂彼不能護持而捨即是斷毀趣入律儀一切福德唯捨自事不起大罪此若棄捨菩薩律儀斷毀要期成辦無邊有情利樂所受律儀當墮惡趣長夜流轉謂若斷毀一有情樂尚感惡趣况斷無邊有情安樂如趣入菩薩行論云若有許願已而不作彼業是名欺衆生我當生何趣先於劣少物思作惠施者後於彼不施尚感餓鬼趣况復以至心接引無上樂設誑諸有情豈能生善趣又云若他剎那間障斷菩薩福損減有情利惡趣無底止壞一有情樂尚使自衰敗况壞盡虛空無邊有情樂由是因緣棄捨願心或未捨願而捨荷負菩提行擔弘大誓願二者同過故一切種不應棄捨以是義故最初受時應善觀察若不爾者有大過患大乘集菩薩學論中援引三經證成此義詳於釋論辨授者儀軌文中復次捨戒第三因緣是說總別毀犯四種他勝處法而於捨戒第四因緣復說以上品纏總別毀犯四種他勝處法意謂若未具足上品纏者但得成為他勝品類所屬過犯非實他勝故非捨失律儀之罪若犯第四捨戒因緣亦犯第三以是義故以上品纏別犯一種及總合犯二種以上如是二者名為後二捨戒因緣即於論文所說捨戒第二因緣攝决擇分復開為二故言四種者是略表示總犯二種以上故若諸菩薩具足律儀不捨願心不捨學處從未現行上品纏犯他勝處法雖復轉身上中下等一切生處終不捨失菩薩律儀或於展轉受餘生時忘失本念依善知識為令還復菩薩戒念如應而受不名新受此中所云上中下等如諸疏云上謂天上中謂人中下謂惡趣或由願力而生其處或為饒益一切有情而生其處或由業力而生其處又最勝子薩穆札疏並云於餘生中亦終不造不克稱合菩薩事業此由菩薩住律儀力故上來已釋他勝處罪自此以後分釋惡作藏土有立為四十六種惡作者釋論依據菩薩律儀二十頌列四十五種惡作罪為便誦持每惡作支附以律儀二十頌文其間許身語七支處頌中說云若具悲愍無不善不名犯罪後當釋說中土古德亦有說為四十二輕戒或四十三或四十四或四十五多種不同二惡作類有二一總說二分釋一總說如是菩薩安住菩薩淨戒律儀於有違犯及無違犯是染非染軟中上品應當了知此中所言於有違犯及無違犯是染違犯非染違犯於惡作中一一當說軟中上品廣說於後二分釋有二一違反六度攝善法罪二違反饒益有情之罪初復有六一違反布施之罪二違反持戒之罪三違反忍辱之罪四違反精進之罪五違反靜慮之罪六違反慧度之罪初復有五首越財施違越慳吝對治違越無畏施不能令他作布施緣違越法施一首越財施第一惡作若諸菩薩安住菩薩淨戒律儀於日日中若於如來或為如來造制多所若於正法或為正法造經卷所謂諸菩薩素怛纜藏摩怛理迦若於僧伽謂十方界已入大地諸菩薩衆若不以其或少或多諸供養具而為供養下至以身一拜禮敬下至以語一四句頌讚佛法僧真實功德下至以心一清淨信隨念三寶真實功德空度日夜是名有犯有所違越若不恭敬懶惰懈怠而違犯者是染違犯若誤失念而違犯者非染違犯無違犯者謂心狂亂若已證入淨意樂地常無違犯由得清淨意樂菩薩譬如已得證淨苾芻恆時法爾於佛法僧以勝供具承事供養頌云不以三事供三寶謂已歸趣於三寶者更以發大菩提心者應向三寶於日日中供養承事不應間缺若不爾者即成違犯此中有三一者供處謂佛法僧佛即如來或為如來造制多所藏譯名為作供養所舊譯支提瑜伽倫記謂是靈廟法即正法或為正法造經卷所謂諸菩薩素怛纜藏或此素怛纜藏摩怛理迦亦名本母僧即十方已入大地菩薩僧衆此中如來即如來身或真實佛言制多者謂佛影像言正法者即是證法謂滅道諦言經卷者即是教法而此復有經論二種言菩薩藏者謂大乘法言僧伽者此中所示僧伽之義是說已入大地即聖菩薩言或為如來者謂如來制多隨一皆得言或為正法者謂證法教法隨一皆得言或摩怛理迦者藏本有或字謂經論二者隨一皆得言若於如來若於正法若於僧伽者謂若於三寶隨一供處起修供養雖所作供為最少限亦免違犯二者供事謂於三寶供處所作供養大小皆得下至以身一禮拜敬下至以語一四句頌讚揚三寶真實功德下至以心一清淨信隨念三寶真實功德於此三者不同前說三供處時各有或字故於三寶隨一供處並應修作三事供養如新疏云隨力設備花等供養下至以身一禮拜敬又薩穆札疏云若晝若夜不能廣修諸餘福事及供養等最少亦當以身禮拜如其所說是供花等亦能免犯三者供時謂若空度一日夜間曾未修作如是供養能生罪故即名有犯違越菩薩之本法故名有違越心狂亂者謂心顛狂無違犯理已於初釋所斷罪中總釋今不再釋後亦不釋此中所云若已證入淨意樂地常無違犯譬如已證淨信苾芻恆時法爾於佛法僧以勝供具承事供養者非謂已得清淨意樂極喜地者雖不供養亦無違犯是說已得入彼地者恆時不離供養三寶自爾不犯如是惡作又此罪者若於學處以不恭敬攝事分云於佛法僧無敬無憚如是名為由輕慢故犯所犯罪不信不解所起懶惰喜樂惡業所起懈怠攝决擇分意地云若隨所欲於彼惡業喜樂而轉不能勤勵息滅彼業是名懈怠而違犯者名染違犯若誤失念攝决擇分意地云若與過失相應於有罪法不能如實明記有罪是名忘念而違犯者非染違犯新疏云貪瞋高慢等此說染違犯懈怠忘念等於供外非染卓龍師云瞋等罪重故名為染懈怠等罪事輕品微於下劣者說遮止句故於後文說惡作時立為非染然此中說懶惰懈怠亦染犯者以彼違越决定應作根本大事故新疏釋云如是惡作毀犯前說攝善法中廣大供養二違越慳吝對治第二惡作若諸菩薩安住菩薩淨戒律儀有其大欲而無喜足於諸利養及以恭敬生著不捨是名有犯有所違越是染違犯無違犯者謂為斷彼生起樂欲發勤精進攝彼對治雖勤遮遏而為猛利性惑所蔽數起現行頌云順彼欲心而隨轉謂於大欲法蘊足論云謂多貪者為得廣大財利等故而起於欲已欲當欲說名大欲或無喜足本地分聲聞地云謂於隨一衣服飲食臥具等事便生喜足生正知足於所未得所有衣服或粗或妙更無希望更無思慮於所已得不染不愛如前廣說而受用之如於衣服於其飲食臥具等事當知亦爾是名喜足與此相違名無喜足或貪利養或貪恭敬如是四者有一生起隨之而轉忍受不捨是染違犯此罪未有非染違犯若為遮斷彼心生起樂欲發勤精進攝彼對治雖勤遮遏而為猛利性惑所蔽數數現行則無違越制立之罪然亦非是都無過失新疏釋云如是惡作毀犯前說律儀戒中少欲喜足及不忍受貪求利敬三違越無畏施有二一對勝境二對恆境一對勝境第三惡作若諸菩薩安住菩薩淨戒律儀見諸者長有德可敬同法者來憍慢所制懷嫌恨心懷恚惱心不起承迎不推勝座頌云於諸耆德不恭敬謂若菩薩見諸與己為同法者約戒臘言耆長於己成就堪信真實功德由此二門堪受慰問等事故可恭敬不起承迎不推勝座是惡作罪二對恆境第四惡作若有他來語言談論慶慰請問憍慢所制懷嫌恨心懷恚惱心不稱正理發言酬對是名有犯有所違越是染違犯非憍慢制無嫌恨心無恚惱心但由懶惰懈怠忘念無記之心是名有犯有所違越非染違犯無違犯者謂遭重病或心狂亂或自睡眠他生覺想而來親附語言談論慶慰請問或自為他宣說諸法論義決擇或復與餘談論慶慰或他說法論義決擇屬耳而聽或有違犯說正法者為欲將護說法者心或欲方便調彼伏彼出不善處安立善處或護僧制或為將護多有情心而不酬對皆無違犯頌云他來語問不酬答謂若他來助歡喜故與己說言問病等故談論慶慰分別往昔已問以外所餘義故而來請問不稱正理發言酬對是惡作罪言稱正理者有疏說云不因酬答而求利養等新疏釋云隨順酬答後說為當言隨順者是能對向是能順義無違犯者於上二境若因自身一自遭重病二自實睡眠他以覺想來語言等雖不酬對亦無違犯或因時境一或自為他宣說諸法或復與他論議決擇二除上所說二種境外而復與餘補特伽羅語言談論慶慰等時三或聽聞他為己說法或正聞他論議決擇屬耳聽時雖不酬對亦無違犯或有所為一作起迎等障他聞法致他不喜將護他故二為欲將護說法者心恐其不喜三欲以不起迎等方便調彼伏彼出不善處安立善處四以不作禮拜語言等護僧制故五以不作恭敬語言等護多有情於己生起嫌恨心故除上諸緣若由憍慢所制或欲損害之嫌恨心或心憤發之恚惱心不起迎等名染違犯若由懶惰懈怠忘念無記諸心之所發起非染違犯新疏釋云此二惡作毀犯饒益有情戒中將護他心四不能令他作布施緣有二一不受延請二不受施物一不受延請第五惡作若諸菩薩安住菩薩淨戒律儀他來延請或往居家或往餘寺奉施飲食及衣服等諸資生具憍慢所制懷嫌恨心懷恚惱心不至其所不受所請是名有犯有所違越是染違犯若由懶惰懈怠忘念無記之心不至其所不受所請是名有犯有所違越非染違犯無違犯者或有疾病或無氣力或心狂亂或處懸遠或道有怖或欲方便調彼伏彼出不善處安立善處或餘先請或為無間修諸善法欲護善品令無暫廢或為引攝未曾有義或為所聞法義無退如為所聞法義無退論義決擇當知亦爾或復知彼懷損惱心詐來延請或為護他多嫌恨心或護僧制不至其所不受所請皆無違犯頌云於他延請不受許謂他來請或往出家各自住所或往僧寺或往在家所住宅舍奉施飲食及衣服等諸資生具若憍慢制懷嫌恨心懷恚惱心不受所請不至其所是染違犯懶惰懈怠增上力故不往其所非染違犯無違犯者若因自身一或有疾病而無氣力二先已受許餘有情請雖不往赴亦無違犯或因道路一道途懸遠不易往赴二道有怖畏謂有怨敵毒害等畏雖不往赴亦無違犯或因施主謂如知彼懷損惱心詐來延請雖不往赴亦無違犯或有所為一欲以此不往赴方便調彼伏彼廣說如前二相續無間勤修善品護其中斷三恐失聽聞先所未聞法義四恐失聽聞先所未聞論議決擇五護多有情起嫌恨心六為護僧制有如覆鉢羯磨等事雖不往赴亦無違犯二不受施物第六惡作若諸菩薩安住菩薩淨戒律儀他持種種生色可染末尼真珠琉璃等寶及持種種衆多上妙財利供具殷勤奉施由嫌恨心或恚惱心違拒不受是名有犯有所違越是染違犯捨有情故或由懶惰懈怠忘念無記之心違拒不受是名有犯有所違越非染違犯無違犯者或心狂亂或觀受已心生染著或觀後時彼定追悔或復知彼於施迷亂或知施主隨捨隨受由是因緣定當貧匱或知此物是僧伽物窣堵波物或知此物劫盜他得或知此物由是因緣多生過患或殺或縛或罰或黜或嫌或責違拒不受皆無違犯考藏本云菩薩於他所持金銀末尼真珠琉璃等多種差別上妙寶物云云下與論同又於若由懶惰懈怠之下無有忘念無記四字頌云他施金等拒不受謂他施主持來種種金銀真珠琉璃等寶殷勤奉施若由嫌恨及恚惱心違拒不受捨有情故是染違犯若由懶惰懈怠之心違拒不受非染違犯無違犯者若因自身觀受彼物自心染著雖拒不受亦無違犯約施主言一恐彼施已隨生追悔二恐彼施主本為自用誤施於他三恐彼施主捨所攝受一切財物定當貧匱雖拒不受亦無違犯約財物言一疑此物已回施僧伽或窣堵波二疑是非理劫盜他得及由此緣生諸過患言過患者或殺或縛或罰或黜或嫌或責雖拒不受亦無違犯最勝子釋云此是受者有諸過患薩穆札疏云觀劫盜者生彼過患故拒不受新疏云此二惡作毀犯饒益有情戒中助福事業五違越法施第七惡作若諸菩薩安住菩薩淨戒律儀他來求法懷嫌恨心懷恚惱心嫉妬變異不施其法是名有犯有所違越是染違犯若由懶惰懈怠忘念無記之心不施其法是名有犯有所違越非染違犯無違犯者謂諸外道伺求過短或有重病或心狂亂或欲方便調彼伏彼出不善處安立善處或於是法未善通利或復見彼不生恭敬無有羞愧以惡威儀而來聽受或復知彼是純根性於廣法教得法究竟深生怖畏當生邪見增長邪執衰損惱壞或復知彼法至其手轉布非人而不施與皆無違犯頌云於來求法不施與謂若於他來求法者懷嫌恨心懷恚惱心或性嫉妬即由彼等增上力故而不施法是染違犯若由懶惰懈怠二心而不施者非染違犯無違犯者若因自身一遭重大病二自於是法未善了知雖不施法亦無違犯或有所為謂欲以此不施法方便調彼伏彼廣說如前雖不施法亦無違犯或因所化一非相應器謂諸外道伺求過短二心不恭敬語不誠實身惡威儀而來聽受三根未成熟是鈍根性聞廣法教難於受持生怖不信還起邪見雖善曉喻亦不聽受增長邪執由是因緣生多非福故云衰損又由是緣當墮惡趣故云惱壞四知彼人者法至其手轉布非器雖不施法亦無違犯又此四中初伺過短非惟外道亦例其餘二不恭敬等有一即足三所云者非必全具新疏釋云此惡作罪毀犯攝善法戒饒益有情戒中作布施事上來所說七種惡作第二惡作作不應作是所犯罪餘六惡作應作不作是所犯罪當知有如第二惡作普於一切應數攝心善為防護專一遠離諸有時處及惡友等增上力故所起犯緣二違反持戒之罪有三一違越尊他二違越尊自三違越尊重自他一違越尊他有二一正顯違越尊他之戒二顯於別解脫所立性罪學習差別初復有三棄捨增上堪憐愍境不學共制學不共制一棄捨增上堪憐愍境第八惡作若諸菩薩安住菩薩淨戒律儀於諸暴惡犯戒有情懷嫌恨心懷恚惱心由彼暴惡犯戒為緣方便棄捨不作饒益是名有犯有所違越是染違犯若由懶惰懈怠棄捨由忘念故不作饒益是名有犯有所違越非染違犯何以故非諸菩薩於淨持戒身語意業寂靜現行諸有情所起憐愍心欲作饒益如於暴惡犯戒有情於諸苦因而現轉者無違犯者謂心狂亂或欲方便調彼伏彼廣說如前或為將護多有情心或護僧制方便棄捨不作饒益皆無違犯頌云棄捨一切犯戒者謂於暴惡及犯戒者諸有情所由彼暴惡犯戒為緣懷嫌恨心及恚惱心而生輕捨不作饒益是染違犯若由懶惰懈怠二心而生輕捨或由忘念不作饒益非染違犯何以故謂諸菩薩當於如是暴惡犯戒住苦因者起憐愍心欲作饒益非於具戒身語意業寂靜現行諸有情所憐愍饒益言暴惡者謂是造作無間等罪言犯戒者謂是有犯根本重罪薩穆札疏云前者多具瞋恚後者怠忽學處無違犯者若有所為一以此方便調彼伏彼二將護所餘多有情心三為護僧制雖復輕捨亦無違犯二不學共制第九惡作若諸菩薩安住菩薩淨戒律儀如薄伽梵於別解脫毗奈耶中將護他故建立遮罪制諸聲聞令不造作諸有情類未淨信者令生淨信已淨信者令倍增長於中菩薩與諸聲聞應等修學無有差別何以故以諸聲聞自利為勝尚不棄捨將護他行為令有情未信者信信者增長學所學處何況菩薩利他為勝頌云不能修學令他信謂如薄伽梵所說根本別解脫經及廣分別別解脫相應法等毗奈耶中除性罪外護他心故制立學處建立遮罪於中菩薩與諸聲聞當等修學不應別異謂如聲聞所遠離者如是菩薩亦應遠離言護他心者謂是為令在家等衆先未信者生起淨信先已信者倍增長故如本論二十二卷云由他觀見如是軌則所行圓滿未信者信信者增長由是發生清淨信處心無厭惡言不譏毀制不飲酒斷非時食及制掘地或觸火等菩薩於彼應等聲聞修學無異若不學者非唯犯越別解脫罪亦犯違越菩薩律儀之惡作罪何以故以諸聲聞自利為勝尚應修學護他心學何況菩薩利他為勝新疏說云若於此戒不信不敬而不學者是染違犯若由懶惰懈怠等心不修學者非染違犯問如是惡作為是在家菩薩所犯或是出家菩薩所犯答如新疏云是謂出家菩薩律儀然諸戒中亦多有同於別解脫專為在家菩薩制者三學不共制第十惡作若諸菩薩安住菩薩淨戒律儀如薄伽梵於別解脫毗奈耶中為令聲聞少事少業少希望住建立遮罪制諸聲聞令不造作於中菩薩與諸聲聞不應等學何以故以諸聲聞自利為勝不顧利他於利他中少事少業少希望住可名為妙非諸菩薩利他為勝不顧自利於利他中少事少業少希望住得名為妙如是菩薩為利他故從非親里長者居士婆羅門等及恣施家應求百千種種衣服觀彼有情有力無力隨其所施如應而受如說求衣求鉢亦爾如求衣鉢如是自求種種絲縷令非親里為織作衣為利他故應畜種種憍世耶衣諸坐臥具事各至百生色可染百千俱胝復過是數亦應取積如是等中少事少業少希望住制止遮罪菩薩不與聲聞共學安住淨戒律儀菩薩於利他中懷嫌恨心懷恚惱心少事少業少希望住是名有犯有所違越是染違犯若由懶惰懈怠忘念無記之心少事少業少希望住是名有犯有所違越非染違犯頌云於利有情少事業如薄伽梵為令聲聞少事少業少希望住制唯遮罪謂如十日持衣一月畜衣等事於中菩薩與諸聲聞不應等學若等學者是惡作罪若於利他由嫌恨心由恚惱心而行少事少業少希望住是染違犯若由懶惰懈怠二心非染違犯何以故謂諸聲聞自利為勝行自調伏不顧利他於利他中少事少業少希望住可名為妙非諸菩薩利他為勝於一切種唯行利樂一切有情於利他中少事少業少希望住得名為妙言少事者謂是少欲言少業者謂是不畜衆多資具少希望住者謂住聖種言聖種者謂於劣少衣服飲食臥具隨所得中皆生喜足樂斷樂修名四聖種如是菩薩為利他故從非親里長者居士婆羅門等應求百千種種衣服謂若有能恣施施主亦當先觀彼有情者有力無力若彼無力如應而取薩穆札疏云觀可容受或不容受是謂觀察自取受已由是施主或當貧匱或不貧匱或為他人譏嫌與否如是說者不應道理此中顯示如理求取雖過量受無違犯故如說求衣求鉢亦爾如是自求種種絲縷令非親里為織作衣亦無違犯是故若依論文所顯令非親里為織作衣若給織價似是有犯而於毗奈耶中說不給價名為有犯為利他故應畜種種憍世耶衣諸坐臥具事至百千生色可染百千俱胝復過是數亦應取積最勝子說此是絲毛織物臥具內藏絲綿座及坐具於利他中許憍世耶諸坐臥具故亦開許絲綿純黑二分純黑言坐臥具者即是開許作減六年敷具捨墮於如是等少事少業少希望住一切制處不應與諸聲聞等學上來所說二種制立及後所明諸性罪者是示諸具菩薩律儀出家苾芻等云何學習別解脫制重要教授謂別解脫有二種制一性罪制二遮罪制於性罪中云何學習如後當說唯遮罪中復有二制一為護他心所制立者如新疏云諸菩薩者增上應學令他生信諸出家者定當防護自學處故是謂菩薩將護他心應過聲聞二為令少事少業少希望住所制立者於利他中不為此限不等聲聞應防護故如是性制及二遮制能攝一切別解脫制舊疏云諸有苾芻從非親里長者居士或長者婦乞求衣者犯捨墮罪於如是等一切學處當知安住二律儀故於利他中可能開許於自利時決定應持是謂雖有諸開許者若非利他為自事故仍犯同於毗奈耶中所說之罪新疏說云此三惡作如其次第毀律儀戒攝善法戒饒益有情戒二顯於別解脫所立性罪學習差別開七支性罪若諸菩薩安住菩薩淨戒律儀善權方便為利他故於諸性罪少分現行由是因緣於菩薩戒無所違犯生多功德頌云若具悲愍無不善本論菩薩律儀二十頌舊疏戒品二疏唯說此是開殺生等身語七位而未有說為利他故於彼開許若不現行名為惡作唯二十頌新疏中立四十六種惡作時以此列為一惡作罪謂彼疏云此從不能修學令他信中開出一支故名惡作然如最勝子及薩穆札云此中專為顯示菩薩聲聞於性罪制有所差別謂諸菩薩善權方便為利他故於別解脫諸性罪制有現行者亦無違犯生多功德此何所指謂殺生等身語七支此中菩薩所依身者本論於說欲邪行時有云出家菩薩為護聲聞聖所教誡令不壞滅一切不應行非梵行於欲邪行遮出家衆付囑在家菩薩依身所餘不與取等六種俱總稱為菩薩依身若爾開殺生等犯他勝根本菩薩為是出家抑是在家若是出家其不應作欲邪行事與可能作殺人等事無有差別以此二者成為他勝不成他勝是同類故若是在家便與本論於欲邪行特立差別餘則未立有所違異復與集菩薩學論唯說開許欲邪行事未說其餘豈不相違如彼論云若見有情增上義利應捨學處謂諸菩薩多劫修習自然大悲畢竟圓滿善權方便具善根者豈為欲貪之所障害方便善巧經云昔光明梵志於四萬二千歲中嚴持梵行住七步已發生悲愍念我若由壞禁戒故墮那落迦我寧忍受那落迦苦其令此女活命得樂即時光明梵志還至其所執彼右手作如是言姊起如汝所欲答曰無過於彼不與而取立為他勝必是自利而取支分然有分位開許菩薩由彼唯為利他而乃取故不名開許不與而取他勝故除此外諸出家者不應現行殺生妄語犯他勝本有如不應行非梵行若爾云何唯於非梵行中特立在家出家分別答曰無過謂由殺生不與而取說虛妄語所犯業道非定成為他勝處罪然持制處諸出家者若有犯非梵行業道決定成為根本重罪於此密意立有差別與集菩薩學論亦不相違以要言之能修梵行即是最勝成辦利他含此更無利他增上於特異時或有觀見若能現行別解脫中根本罪處即得增上有情義利便捨學處而興饒益是許在家非開出家若許出家無有出家先行捨棄學處義理如是為利他故行殺生等諸種作業應是何等菩薩依身集菩薩學論舊譯云此謂尚未證得大地而勤修行於六度者非謂所餘新譯則云已得大地勤行六度有謂既云已得大地後句所示勤行六度似無義理當以舊譯最為善通然如集菩薩學論引方便善巧經說云非唯未登大地以前暫行六度便謂滿足應是經歷多劫修道善權方便成就大悲諸菩薩衆是謂已受菩薩律儀如理修學菩薩學處具足愛他更逾於己勝菩提心舍殺生等不能求得所餘方便如是菩薩為利他故方能開許非謂開許所有一切大乘行者是故唯能如理修學菩薩律儀者尚不開許何況餘諸不護律儀自稱大乘雖彼或有相似悲愍相似發心然亦決定皆不可作譬如別解脫中於病苾芻若不令食過日中食有損其病若許食者於病有益故得開許然亦所餘一切苾芻俱應守護其事相同又集菩薩學論引經唯說開許行非梵行而殺生等根本罪處亦復同爾除於開許妄語等四及不與取如下說外於有情事成就重大逼切義利復不獲得餘方便時如理善護菩薩律儀具足爾時等起之心以精懇心當善觀察或成違犯或不成犯以此處者是佛如來唯一境界最極微細至險難故海雲最勝子薩穆札並謂此是無染證得自在已淨意樂菩薩所行非軟善根下劣智慧耽著自利徒於經文生取著者所行境界諸佛唯一現量證知非餘應作若妄作者招非福故此中所說他勝處者是別解脫他勝處罪今說開許殺生等支一開殺生謂如菩薩見劫盜賊為貪財故願殺多生或復欲害大德聲聞獨覺菩薩或復欲造多無間業見是事已發心思惟我若斷彼惡衆生命墮那落迦如其不斷無間業成當受大苦我寧殺彼墮那落迦終不令其受無間苦如是菩薩意樂思惟於彼衆生或以善心或無記心知此事已為當來故深生慚愧以憐愍心而斷彼命由是因緣於菩薩戒無所違犯生多功德考藏本云謂如菩薩見劫盜賊為少分財將殺衆多大命大我聲聞獨覺菩薩造作衆多無間之業下與論同此中有二一者境謂劫盜等為少分財將殺衆多聲聞獨覺菩薩造無間業無間業者如俱舍論云言無間者謂五無間其五者何一者害母二者害父三者害阿羅漢四者破和合僧五者惡心出佛身血此無間名為目何義約異熟果決定更無餘業餘生能為間隔故此唯目無間隔義或造此業補特伽羅從此命終定墮地獄中無間隔故名無間又云或有殺害住定菩薩或殺學聖者是五無間同類業體二者意樂謂若菩薩見是事已發心思惟我寧殺彼墮那落迦終不令彼有情存活無間業成墮那落迦為當來故於彼現在雖加少苦令彼當來多受安樂專一安住深憐愍心謂起自他互換之心我寧殺彼墮那落迦必當脫彼斷彼命時自住善心或無記心當知都無煩惱間雜有說此是所殺者心非論本義言深生慚愧者謂法已匱除此方便無餘可得由是因緣雖斷彼命而無違犯生多功德二開不與取又如菩薩見有增上增上宰官上品暴惡於諸有情無有慈愍專行逼惱菩薩見已起憐愍心發生利益安樂意樂隨力所能若廢若黜增上等位由是因緣於菩薩戒無所違犯生多功德又如菩薩見劫盜賊奪他財物若僧伽物窣堵波物取多物已執為己有縱情受用菩薩見已起憐愍心於彼有情發生利益安樂意樂隨力所能逼而奪取勿令受用如是財故當受長夜無義無利由此因緣所奪財寶若僧伽物還復僧伽窣堵波物還窣堵波若有情物還復有情又見衆主或園林主取僧伽物窣堵波物言是己有縱情受用菩薩見已思擇彼惡起憐愍心勿令因此邪受用業當受長夜無義無利隨力所能廢其所主菩薩如是雖不與取而無違犯生多功德此有三境第一境者謂有人王即增上大臣即增上宰官上品暴惡於諸有情無有悲愍專行逼惱若復聽其久住上位多生非福其意樂者謂起憐愍心或復發生利益意樂廢奪主權第二境者謂劫盜賊奪他財物若僧伽物窣堵波物取多物已執為己有縱情受用其意樂者謂作是念勿令受用如是財故當受長夜無義無利由是奪回其所奪物還獻僧伽及窣堵波第三境者謂若觀見管理園林即衆主或守園者即園林主於僧伽物窣堵波物非理消耗復據己有縱情受用其意樂者如前所說廢奪所主菩薩如是雖不與取而無違犯生多功德三開欲邪行又如菩薩處在居家見有母邑現無繫屬習淫欲法繼心菩薩求非梵行菩薩見已作意思惟勿令心恚多生非福若隨其欲便得自在方便安處令種善根亦當令其捨不善業住慈愍心行非梵行雖習如是穢染之法而無所犯生多功德出家菩薩為護聲聞聖所教誡令不壞滅一切不應行非梵行考藏本云如是菩薩處在居家見有母邑現無繫屬為非梵行之所逼惱起同歡心菩薩見已作意思惟下與論同一者境謂有母邑現無繫屬謂處女未適他者內懷怨結為非梵行之所逼惱起與菩薩遂同歡心論云繼心若使菩薩不隨其欲當致命終諸疏釋云既云母邑現無繫屬即應遠離行欲邪行此不應理今是開許欲邪行位故集菩薩學論亦云若有夫者或無繫屬若為家族之所守護若為正法之所守護若為節幢之所守護如是等類俱不成為欲邪行罪是謂有夫無夫二者皆不犯於邪淫罪故集菩薩學論又云一切正梵行者為饒益故當於彼等作母妹想遠離邪行而供侍之如是說者多分應是在家可行及諸苾芻不同在家又若覩見增上義利應捨學處與菩薩地事義相同新疏亦云現行穢欲名為有罪能令無間墮那落迦能令衆多堪教化者不信聖教令諸世人樂住此行隨觀見已大士不作習近淫欲如是乃至殺人等事亦非所行二者意樂謂作是念勿彼由此生恚惱心增多罪過若隨其欲便得自在方便安處令種善根亦當令其捨不善業住悲愍心行非梵行無所違犯生多功德四開妄語又如菩薩為多有情解脫命難囹圄縛難刖手足難劓鼻刖耳剜眼等難雖諸菩薩為自命難亦不正知說於妄語然為救脫彼有情故知而思擇故說妄語以要言之菩薩唯觀有情義利非無義利自無染心唯為饒益諸有情故覆想正知而說異語說是語時於菩薩戒無所違犯生多功德一者境謂多有情現有命難囹圄縛難刖手足難劓鼻刖耳剜眼等難二者意樂謂作救脫彼諸患難三者依身謂諸菩薩若為自事雖至命難而亦不以自所正知說於妄語為有情故知而思擇故說妄語以要言之唯觀有情義利非無義利自無染心唯欲饒益覆想正知而說妄語無所違犯生多功德五開離間語又如菩薩見諸有情為惡朋友之所攝受親愛不捨菩薩見已起憐愍心發生利益安樂意樂隨能隨力說離間語令離惡友捨相親愛勿令有情由近惡友當受長夜無義無利菩薩如是以饒益心說離間語乖離他愛無所違犯生多功德一者境謂諸有情為惡朋友之所攝受二者意樂謂作是念勿令有情由近惡友當受長夜無義無利以是義故說離間語令離惡友菩薩如是說離間語無所違犯生多功德六開粗惡語又諸菩薩見諸有情為行越路非理而行出粗惡語猛利訶擯方便令其出不善處安立善處菩薩如是以饒益心於諸有情出粗惡語無所違犯生多功德一者境謂諸有情行越正路非理而行二者意樂謂以出粗惡語方便令彼有情出不善處安立善處菩薩如是出粗惡語無所違犯生多功德薩穆札疏云言行越正路者謂行十不善或雖了知大乘正路而行小乘或解小乘而行外道言非理而行者謂雖解正理而於學處不敬怠忽七開綺語又如菩薩見諸有情信樂倡妓吟詠歌諷或有信樂王賊飲食淫蕩街衢無義之論菩薩於中皆悉善巧於彼有情起憐愍心發生利益安樂意樂現前為作綺語相應種種倡妓吟詠歌諷王賊飲食淫衢等論令彼有情歡喜引攝自在隨屬方便獎導出不善處安立善處菩薩如是現行綺語無所違犯生多功德一者境謂諸有情信樂歌舞伎樂諸種音聲或有信樂談說人王盜賊飲食淫蕩街衢諸種言論二者依身及其意樂謂菩薩於歌舞等事皆能善巧於彼有情以悲愍心現前為作歌舞等事令其歡喜生起信樂自在攝受獎導隨屬出不善處安立善處菩薩如是雖說綺語而無違犯生多功德論中所說同大日經除開身語七支而外從未有說開意三位具法善現釋云諸若有能乃至少分不顧自利唯欲利他普於一切悲愍相應於彼除去意三惡行或除邪見餘皆閒許當知此從決擇菩薩律儀聖典所出是謂應依如來善說為所根據菩提賢云若有違越別解脫中諸性罪制尚無違犯生多福德況諸遮罪若見有屬為他事中重大義利雖有違越共學遮罪亦無違犯如上所說可資比量二違越尊白之戒有三一毀犯淨命二毀犯軌則三貪味三有一毀犯淨命第十一惡作若諸菩薩安住菩薩淨戒律儀生起詭詐虛談現相方便研求假利求利味邪命法無有羞恥堅持不捨是名有犯有所違越是染違犯無違犯者若為除遣生起樂欲發勤精進煩惱熾盛蔽抑其心時時現起頌云忍受不捨邪命法謂於隨一若詭詐等五種邪命生已忍受無有慚羞不起對治而令遣除是染違犯此中無有非染違犯若為除彼生起樂欲煩惱熾盛則無違犯如前順彼欲心而隨轉中所說五邪命相者如寶鬘論云矯相為利敬詐現護諸根虛談為利敬當前說軟語旁尋所得故稱讚他財物研逼求所得現前毀𧩢他假利而求利讚揚先所得諸疏說云若起五種邪命之心不即覺知亦名有犯似與論義不相符合如本論二十二卷聲聞地出離地品云云何淨命虧損所攝謂如有一為性大欲不知喜足難養難滿常以非法追求衣服飲食臥具病緣醫藥及諸資具不以正法又為貪求種種衣服飲食臥具病緣醫藥資具因緣方便顯己有勝功德矯詐構集非常威儀為誑他故恆常詐現諸根無掉諸根無動諸根寂靜由是令他謂其有德當有所施當有所作所謂承事供給衣服飲食臥具病緣醫藥及諸資具又多凶悖強口矯傲修飾其名執恃種姓或求多聞或任持法為利養故亦復為他宣說正法或佛所說或弟子說或自宣說己實有德或少增益或於他前方便現相為求衣服或求隨一沙門資具或為求多或求精妙雖無匱乏而現被服故弊衣裳為令淨信長者居士婆羅門等知其衣服有所匱乏殷重承事給施衆多上妙衣服如為衣服為餘隨一沙門資生衆具亦爾或於淨信長者居士婆羅門所如其所欲不得稱遂或彼財物有所闕乏求不得時即便強逼研磨粗語而苦求索或彼財物無所闕乏得下劣時便對施主現前毀棄所得財物如是告言咄哉男子某善男子某善女人方汝族姓及以財寶極為下劣又極貧匱而能惠施如是如是多妙悅意資産衆具汝望於彼族姓尊貴財寶豐饒何為但施如是少劣非悅意物彼由如是或依矯詐或邪妄語或假現相或苦研逼或利求利種種狀相而從他所非法希求所有衣服飲食臥具病緣醫藥諸資生具非以正法而有所求由非法故說名邪命如是名為尸羅淨命虧損所攝又八十九卷攝事分云心懷染汙為顯己德假現威儀故名為矯心懷染汙為顯己德或現親事或行軟語故名為詐心懷染汙欲有所求矯示形儀故名現相現行遮逼有所乞丐故名研求於所得利不生喜足悅獲他利更求勝利是故說名以利求利勘同藏本二十二卷之矯詐邪妄語假現相苦研逼利求利八十九卷之矯詐現相研求以利求利即本品所說之詭詐虛談現相方便研求假利求利五種邪命同名異譯二毀犯軌則第十二惡作若諸菩薩安住菩薩淨戒律儀為掉所動心不寂靜不樂寂靜高聲嬉戲喧譁紛聒輕躁騰躍望他歡笑如此諸緣是名有犯有所違越是染違犯若忘念起非染違犯無違犯者若為除遣生起樂欲廣說如前若欲方便解他所生嫌恨令息若欲遣他所生愁惱若他性好如上諸事方便攝受敬慎將護隨彼而轉若他有情猜阻菩薩內懷嫌恨惡謀憎背外現歡顏表內清淨如是一切皆無違犯頌云躁動不靜掉舉等謂是貪分所攝心不靜息掉舉所動令不寂靜樂不寂靜高聲嬉戲喧譁紛聒輕躁騰躍合他嬉笑是染違犯若由忘念起如是事非染違犯無違犯者若因自身謂若除彼生起樂欲廣說如前雖高聲等亦無違犯或有所為此有五種一若欲方便解他所生嫌恨之心二若欲遣他所生憂惱三若他性好嬉笑等事方便攝受安立善處四若為將護自與宿友免失和協隨彼而轉五若他疑自不歡不樂懷嫌恨心將起憎背故現歡顏表示自內意樂清淨雖高聲等亦無違犯三貪味三有第十三惡作若諸菩薩安住菩薩淨戒律儀起如是見立如是論菩薩不應欣樂涅槃應於涅槃而生厭背於諸煩惱及隨煩惱不應怖畏而求斷滅不應一向心生厭離以諸菩薩三無數劫流轉生死求大菩提若作此說是名有犯有所違越是染違犯何以故如諸聲聞於其涅槃欣樂親近於諸煩惱及隨煩惱深心厭離如是菩薩於大涅槃欣樂親近於諸煩惱及隨煩惱深心厭離其倍過彼百千俱胝以諸聲聞唯為一身證得義利勤修正行菩薩普為一切有情證得義利勤修正行是故菩薩當勤修集無雜染心於有漏事隨順而行成就勝出諸阿羅漢無雜染行頌云內心一向趣流轉謂由誤解多契經說如諸菩薩欣樂生死非樂涅槃便謂一切菩薩不應欣樂涅槃應於涅槃而生厭背於諸煩惱及隨煩惱不應怖畏不應於彼深心厭離菩薩應經三無數劫流轉生死成辦菩提起如是見立如是論是染違犯於如是見何故說云是名有犯如諸聲聞於其涅槃深生欣樂於諸煩惱深心厭離如是菩薩應令過彼百千俱胝以諸聲聞唯為一身解脫三有尚應如是勤修正行何況菩薩普為有情解脫三有勤修正行是故菩薩當勤修集無雜染心謂自未能解脫煩惱不能解脫他煩惱故如大乘莊嚴經論云頂荷有情重大擔菩薩緩行不名妙種種纏結縛自他應作百千倍精進如是菩薩雖非羅漢然以勝出諸阿羅漢無雜染法善權方便於有漏事隨順行故薩穆札疏云鈍根聲聞尚能了知生死過患而生厭離何況菩薩是大利根無量勝慧是故經中所說不應欣樂涅槃應樂生死是破永背取生三有樂涅槃者及讚不染業煩惱纏流轉三有者非不厭離諸業煩惱及業煩惱所感生死非破欣樂斷業煩惱而得涅槃如本論三十六卷真實義品云諸菩薩智於此真實學道所顯又即此慧是諸菩薩能得無上正等菩提廣大方便何以故以諸菩薩處於生死彼彼生中修空勝解善能成熟一切佛法及諸有情又能如實了知生死不於生死以無常等行深心厭離若諸菩薩不能如實了知生死則不能於貪瞋癡等一切煩惱深心棄捨不能棄捨諸煩惱故便雜染心受諸生死由雜染心受生死故不能成熟一切佛法及諸有情若諸菩薩於其生死以無常等行深心厭離是則速疾入般涅槃彼若速疾入般涅槃尚不能成熟一切佛法及諸有情況能證無上正等菩提又諸菩薩由習如是空勝解故則於涅槃不深怖畏亦於涅槃不多願樂若諸菩薩深怖涅槃即便於彼涅槃資糧不能圓滿由於涅槃深怖畏故不見涅槃勝利功德由不見故便於涅槃遠離一切清淨勝解若諸菩薩於其涅槃多住願樂是則速疾入般涅槃彼若速疾入般涅槃則便不能成熟佛法及諸有情當知此中若不如實了知生死即雜染心流轉生死若於生死深心厭離即使速疾入般涅槃若於涅槃深心怖畏即於能證涅槃資糧不能圓滿若於涅槃多住願樂即便速疾入般涅槃是諸菩薩於證無上正等菩提無大方便若能如實了知生死即無染心流轉生死若於生死不以無常等行深心厭離即不速疾入般涅槃若於涅槃不深怖畏即能圓滿涅槃資糧雖於涅槃見有微妙勝利功德而不深願速證涅槃是諸菩薩於證無上正等菩提有大方便是大方便依止最勝空性勝解是故菩薩修習學道所攝最勝空性勝解名為能證如來妙智廣大方便菩提賢云此三違犯如其次第毀犯律儀戒中淨命及不掉舉樂住遠離又三違犯於中初者若作沽酒販賣軍器毒藥生命紫草子等及搾胡麻或芥菜子尚名邪命何況佃漁三違越尊重自他有二一不護自譽二懼作辛猛利他加行一不護自譽第十四惡作若諸菩薩安住菩薩淨戒律儀於自能發不信重言所謂惡聲惡稱惡譽不護不雪其事若實而不避護是名有犯有所違越是染違犯若事不實而不清雪是名有犯有所違越非染違犯無違犯者若他外道若他憎嫉若自出家因行乞行因修善行謗聲流布若忿蔽者若心倒者謗聲流布皆無違犯藏本則於若忿蔽者若心倒者譯為若忿蔽者其心顛倒頌云於惡聲譽不護雪謂有因緣出生惡聲惡稱惡譽令自語言無有威力不堪信重便失菩薩信言具足若於自身其事實有不護不雪是染違犯若無所據其事不實不護不雪非染違犯卓龍云惡聲等三其所說者為上中下三品過患言不護者謂從初未能預防出生言不雪者謂出生已不能止除無違犯者約能說人一若他外道二若懷憎嫉補特伽羅雖善曉喻亦不信順三若忿蔽者故意謗說於是三者說惡聲譽不作方便以清雪之亦無違犯新疏說云若他外道懷憎嫉者是合前二為一外道與論不合約所說事一出家因緣二行乞因緣三修善因緣謗聲流布不作方便以清雪之亦無違犯二懼作辛猛利他加行第十五惡作若諸菩薩安住菩薩淨戒律儀見諸有情應以種種辛楚加行猛利加行而得義利護其憂惱而不現行是名有犯有所違越非染違犯無違犯者觀由此緣於現法中少得義利多生憂惱考藏本云如諸菩薩見有應以辛楚方便猛利方便能令有情獲得義利護憂感故而不現行彼方便者是名有犯有所違越非染違犯無違犯者觀由此緣少現法利生大憂惱頌云雖有煩惱亦不治謂如見彼應以種種不可愛樂辛楚方便身語現行極可厭惡治罰調伏猛利方便而令有情獲得義利唯為將護他有情感而不現行彼方便者是染違犯若觀現行由是因緣於彼少得現法義利生大憂惱雖不現行亦無違犯有疏釋云於他有情少得義利自則生起極大困苦新疏云此二惡作如其次第毀犯攝善法戒中正念正知正行防守於自愆犯審諦了知知已悔除及饒益有情戒中訶責攝受三違反忍度之罪有三一不住忍因二不能滅除瞋忿相續三不住對治一不住忍因第十六惡作若諸菩薩安住菩薩淨戒律儀他罵報罵他瞋報瞋他打報打他弄報弄是名有犯有所違越是染違犯頌云於他罵等輒還報此由背棄沙門四法所起過患是染違犯所言罵者謂由忿怒出毀罵語瞋報瞋者謂由意樂令他憤恚出非愛語打報打者謂由意樂令他生苦而行捶弄報弄者謂是彼此舉發過失二不能滅除瞋忿相續有二一自不能滅二他不能滅一自不能滅第十七惡作若諸菩薩安住菩薩淨戒律儀於他有情有所侵犯或自不為彼疑侵犯由嫌嫉心由慢所執不如理謝而生輕捨是名有犯有所違越是染違犯若由懶惰懈怠放逸不謝輕捨是名有犯有所違越非染違犯無違犯者若欲方便調彼伏彼出不善處安立善處若是外道若彼希望要因現行非法有罪方受悔謝若彼有情性好鬬諍因悔謝時倍增憤怒若復知彼為性堪忍體無嫌恨若必了他因謝侵犯深生羞恥而不悔謝皆無違犯頌云輕捨一切忿疑者謂自於他有所侵犯或自未犯他疑侵犯於此二者隨有其一若由猛利妬忌之嫌嫉心或慢所執羞於謙下不如理謝是染違犯若由懶惰懈怠放逸輕捨不謝非染違犯無違犯者若有所為謂欲方便調彼伏彼雖不悔謝亦無違犯若約所當悔謝之境一若是外道二若他希求要今現行非法有罪方受悔謝三若他性好鬬諍因悔謝時倍增憤怒四若復知他為性堪忍本無嫌恨隨謝與否心無動易五若復知他不欲悔謝或因悔謝轉令羞恥如是五者雖不悔謝亦無違犯又此五中後二緣事在藏論中似列為一然諸疏中別釋為二今從疏說二他不能滅第十八惡作若諸菩薩安住菩薩淨戒律儀他所侵犯彼還如法平等悔謝懷嫌恨心欲損惱彼不受其謝是名有犯有所違越是染違犯雖復於彼無嫌恨心不欲損惱然由稟性不能堪忍故不受謝亦名有犯有所違越是染違犯無違犯者若欲方便調彼伏彼廣說一切如前應知若不如法不平等謝不受彼謝亦無違犯頌云他來悔謝拒不受謂他有情於其鬬諍所起侵犯他還如法平等悔謝而由自內懷嫌恨心欲於他所傷害損惱不受其謝是染違犯然若於他無嫌恨心唯由稟性不能堪忍不欲受謝而不受者非染違犯此依釋論為為非染藏本正文亦云是染違犯與論文同顯見所據梵本無異無違犯者若有所為謂欲方便調彼伏彼雖不受謝亦無違犯若來謝境謂不如法不平等謝雖不受謝亦無違犯不如法者謂不應理不平等者謂是徒託空言律儀二十頌新舊兩疏以不平等釋為非時謂不能於作侵犯已無間時中而來悔謝又新疏云若於外道或於性好鬬諍有情雖不受謝亦無違犯三不住對治第十九惡作若諸菩薩安住菩薩淨戒律儀於他懷忿相續堅持生已不捨是名有犯有所違越是染違犯無違犯者為斷彼故生起樂欲廣說如前頌云隨逐忿恚心而轉謂初於他起瞋忿心相續不捨堅固執持不見過患不習對治生已忍受是染違犯若為斷彼生起樂欲雖勤遮遏未能遣除則無違犯廣說如前菩提賢謂此是生起忿恚堅持不捨之罪上來所說四種惡作如新疏云初二惡作如其次第毀律儀戒攝善法戒二中所說唯為利他及毀犯攝善法戒中犯戒因緣根本煩惱及隨煩惱亦不忍受後二惡作毀犯何種彼疏不現四違反精進之罪有三一下劣加行二失壞加行三貪無義事一下劣加行第二十惡作若諸菩薩安住菩薩淨戒律儀貪著供事增上力故以愛染心管御徒衆是名有犯有所違越是染違犯無違犯者不貪供侍無愛染心管御徒衆考藏本云菩薩貪著供侍敬事增上力故有愛染心攝受徒衆是名有犯有所違越是染違犯無愛染心而受供侍及與敬事則無違犯頌云為貪供事攝徒衆謂為貪著淨沐浴等所有供侍設勝座具不授事梵名羯磨陀那古譯授事亦名維那等所有敬事謂優禮尊重便以希求獻財物等有愛染心攝受徒衆是染違犯若攝徒衆無愛染心受供侍等則無違犯二失壞加行第二十一惡作若諸菩薩安住菩薩淨戒律儀懶惰懈怠耽睡眠樂臥樂倚樂非時非量是名有犯有所違越是染違犯無違犯者若遭疾病若無氣力行路疲極若為斷彼生起樂欲廣說一切如前應知頌云不能尅除懈怠等謂若生起懶惰懈怠耽睡眠樂或於牀座作息臥樂或偏側就作倚頓樂非時非量忍受不捨是染違犯言非時者謂於晝日非睡等時言非量者謂夜時中除中夜外初後二分亦復非量無違犯者若因自身一病無氣力二行路疲極三為令斷彼生起樂欲廣說如前雖復忍受亦無違犯三貪無義事第二十二惡作若諸菩薩安住菩薩淨戒律儀懷愛染心談說世事虛度時日是名有犯有所違越是染違犯若由忘念虛度時日是名有犯有所違越非染違犯無違犯者見他談說護彼意故安住正念須臾而聽若事希奇或暫問他或答他問無所違犯頌云貪近無義無利語謂於談說王臣盜賊婦女欲等世事語言懷愛染心虛度時日是染違犯若由忘念而現行者非染違犯薩穆札疏則云此中唯由聞他談說虛度時日言虛度者謂是度過從日初分至日後分從日後分至初夜等無違犯者或自聽聞謂若見他談說護彼意故安住正念須臾而聽如是雖聽亦無違犯或自談說謂事希奇或暫問他或答他問如是雖說亦無違犯最勝子等並云若於學處勤精進時於如上事亦名有犯新疏云此三惡作毀犯饒益有情戒中如法攝衆攝善法戒中恆常精進修習六度一切善品律儀戒中雖處雜衆而不樂為不正言論五違反靜慮之罪有三一加行所犯二正行所犯三後行所犯一加行所犯第二十三惡作若諸菩薩安住菩薩淨戒律儀為令心住欲定其心心懷嫌恨憍慢所持不詣師所求請教授是名有犯有所違越是染違犯懶惰懈怠而不請者非染違犯無違犯者若遇疾病若無氣力若知其師顛倒教授若自多聞自有智力能令心定若先已得所應教授而不請者無所違犯頌云不求教授三摩地謂欲令心能正等持心懷嫌恨憍慢所持不詣師所而為求請住心教授是染違犯若由懶惰懈怠二心而不求請非染違犯無違犯者若因自身一若遇疾病無有氣力二若疑其師顛倒教授三自己多聞能令心定或依教授已能成辦所應教授雖不求請亦無違犯當知修定由六種力方能成辦其第一種即聽聞力謂唯隨順從他聽聞於所緣境住心教授最初令心安住內境非自數思自數習故如本論十二卷三摩呬多地云云何說力即是聽受阿笈摩力謂於靜慮增上緣法多聞任持乃至廣說即依此法獨處空閒離諸放逸勇猛精進自策而勵法隨法行由此能令等入靜慮云何教授力謂於親教軌範師所或於隨一餘尊長所獲得隨順初靜慮等無倒教授從此審諦作意思維而入靜慮二正行所犯第二十四惡作若諸菩薩安住菩薩淨戒律儀起貪欲蓋忍受不捨是名有犯有所違越是染違犯無違犯者若欲斷彼生起樂欲發勤精進煩惱猛利蔽抑心故時時現行如貪欲蓋如是瞋恚昏沈睡眠掉舉惡作及與疑蓋當知亦爾頌云不捨五蓋靜慮障謂於能障靜慮五蓋隨一生起忍受不捨是染違犯若為斷彼生起樂欲則無違犯廣說如前言五蓋者如龍猛勸誡王頌云瞋掉舉惡作惛睡貪欲疑應知此五蓋劫奪善財賊掉舉惡作處所等故合說一蓋惛沈睡眠合為一蓋今於此中分二類釋初明所應淨修治蓋及能引發彼蓋障法次明云何淨修治相今初所明言貪欲者謂由愛欲色等五境心逐五境隨之而轉引發彼者謂於諸境增益可愛堪悅意相非理作意言瞋恚者謂當於他作不饒益及傷害心引發彼者謂隨增益意怒因緣非可愛樂非悅意相言惛沈者謂癡分攝內心惛昧無堪任性言睡眠者謂癡分攝心從境界極略聚故如是二種能引發者謂心作意黑暗之相無有光明言掉舉者謂貪分攝不寂靜性言惡作者謂心追悔如是二種能引發者謂因尋思親屬國土不死諸事及隨憶念昔所經歷戲笑歡娛所行之事言疑者謂三世我為有為無或於三寶或於業果或於四諦生惑生疑猶豫猜度引發彼者謂三世法及緣彼法非理作意次明云何淨修治相此復有二一依何對治而淨修治二依何威儀而淨修治初復有三一依法增上淨修治相法增上自增上世增上名三增上廣說於本論二十四卷九十八卷及大毗婆沙論二十一卷中謂若對治貪欲觀修青瘀膿爛壞等不淨之相對治瞋恚觀修仁慈對治惛沈睡眠善取日月光明等相令心明顯或復修習六種隨念隨念佛法僧戒捨天或復委心正信所緣策舉其心或觀方隅或瞻星月或以淨水洗滌其面對治掉舉惡作令心內住一相續中修三摩地對治疑者謂由觀見過去已生未來當生都無有我唯法因果如理作意於有謂有於無謂無遠離增損又此一切應於善說訶責五蓋及引蓋法所有過失稱揚讚歎遠離五蓋所有勝利一切文句誦持其文思惟其義所未生者不令其生所已生者令其除遣二依自增上淨修治相謂若五蓋隨一生起尋便了知由彼蓋故令心雜染令慧羸劣損害善品故與自法不順不合既了知已生起慚羞速疾斷除而不忍受三依世增上淨修治相謂若五蓋隨一生起或復將生現在前時即自思維我若生起如是諸蓋為我大師知他心天同法智者之所訶棄故未生者不令生起其已生者悉令斷除次言以何威儀而淨修治謂於惛沈睡眠纏蓋應起於坐往來經行而淨修治於餘四蓋善結跏趺安住背念而淨修治安住背念者謂如理作意相應念棄背違逆一切黑品故緣慮定相為境念棄背除遣一切不定地所緣境故又於諸蓋一切時中應捨不受非唯入修三摩地時上說五蓋廣釋於本論十一卷本地分三摩呬多地第六之一及二十四卷本地分聲聞地初持瑜伽處出離地品第三之三中三後行所犯第二十五惡作若諸菩薩安住菩薩淨戒律儀貪味靜慮於味靜慮見為功德是名有犯有所違越是染違犯無違犯者若為斷彼生起樂欲廣說如前頌云於味靜慮見功德謂其相續生靜慮時有所愛味本論六十二卷云言愛味者謂於是中遍生貪著而於貪愛味著其喜樂等本論十一卷云喜為受境界樂為除粗重見為功德是染違犯若為斷彼生起樂欲則無違犯廣說如前有疏釋云此謂於定生喜足罪似不應理當知於定雖已生起而障礙彼能相續住及發勝進有四雜染一有愛味二慢增上三無明增上四見增上如阿毗達摩集論云何等雜染故謂四無記根一愛二見三慢四無明由有愛故味上靜慮雜染所染由有見故見上靜慮雜染所染由有慢故慢上靜慮雜染所染由無明故疑上靜慮雜染所染新疏云此三惡作如其次第毀犯律儀戒中勤修菩薩無量等持不起少分諸惡尋思攝善法戒中等至煩惱亦不忍受又攝善法戒中等至味著亦不忍受此中所云貪味靜慮之貪味於味靜慮之味前攝善法戒中等至味著之味著十二卷三摩呬多地中愛味相應靜慮之愛味同是一字六違反慧度之罪有二一屬劣境二屬勝境初復有四一輕捨小乘二於聲聞藏一向勤學三一向勤學異外書論四於異外論愛樂勤學一輕捨小乘第二十六惡作若諸菩薩安住菩薩淨戒律儀起如是見立如是論菩薩不應聽聲聞乘相應法教不應受持不應修學菩薩何用於聲聞乘相應法教聽聞受持精勤修學是名有犯有所違越是染違犯何以故菩薩尚於外道書論精勤研究况於佛語無違犯者為令一向習小法者捨彼欲故作如是說頌云輕捨聲聞乘法教菩薩若自起如是見而亦於他立如是論菩薩不應聽聲聞乘相應法教不應受持其文不應修學其義菩薩於彼聽聞受持修學無義利故是染違犯此與虛空藏經所說令他棄捨別解脫學成根本罪有大差別此是妄執聲聞乘法是小乘人所應聽聞菩薩不應聽聞彼法非是畢竟謗聲聞乘何緣於此說有違犯謂諸菩薩尚應於彼異道書論精勤研究况於佛語又此制立為諸不正了知法者說大乘人不應修學別解脫制造積損匱正法業障遮遏彼等墮大險坑最勝教授若大乘人一向樂習聲聞乘法作如是說回彼樂欲令樂大乘約所依身則無違犯二於聲聞藏一向勤學第二十七惡作若諸菩薩安住菩薩淨戒律儀於菩薩藏未精研究於菩薩藏一切棄捨於聲聞藏一向修學是名有犯有所違越非染違犯考藏本云是染違犯頌云現有自法精小乘謂於現有所應精研菩薩法藏一切棄捨於聲聞藏精勤修學是染違犯是故定須精進不捨於大乘者方能兼學小乘法藏三一向勤學異外書論第二十八惡作若諸菩薩安住菩薩淨戒律儀現有佛教於佛教中未精研究於異道論及諸外論精勤修學是名有犯有所違越是染違犯無違犯者若上聰敏若能速受若經久時能不忘失若於其義能思能達若於佛教如理觀察成就俱行無動覺者於日日中常以二分修學佛語一分學外則無違犯頌云精非所精異外論謂若現有所應精研如來善說未精研究而反精修非所應精諸異道論及諸外論是則名為不精自典精修異外是染違犯言外論者薩穆札釋為外典因明聲明書論前對小乘而說所應精研根本是菩薩藏此對異外總說佛教無違犯者若因自身一若上聰敏二若能速受三若經久時能不忘失四若於其義能思能達五若於佛教如理觀察成就俱行無動慧者一切異論不傾動故於日日中常以二分精學佛語一分學外則無違犯最勝子云此中所言上聰敏者謂短少時便能記憶能思義者謂是利慧能達義者謂是慧明如理觀察者謂是宿智俱生大慧能速受者謂能速學四於異外論愛樂勤學第二十九惡作若諸菩薩安住菩薩淨戒律儀越菩薩法於異道論及諸外論研求善巧深心寶玩愛樂味著非如辛藥而習近之是名有犯有所違越是染違犯考藏本云若諸菩薩雖未違越如是軌法上文所說一分學外於異道論及諸外論研求善巧然於其中深心寶玩愛樂味著不能等同習近辛藥是名有犯有所違越是染違犯頌云研異外論而愛樂謂若菩薩不違上戒所說軌法於異道論及諸外論研求善巧然應有如極辛熱藥本非所欲有所為故而習近之若不爾者初則寶玩次則愛樂後則味著是染違犯新疏云上來所說四惡作中初一惡作毀犯攝善法戒中遠離倒見第二第三毀犯攝善法戒中聞思加行第四惡作毀犯何等彼疏未現二屬勝境有三一誹謗慧境二不正修果三虧損慧因一誹謗慧境第三十惡作若諸菩薩安住菩薩淨戒律儀聞菩薩藏於甚深處最勝甚深真實法義諸佛菩薩難思神力不生信解憎背毀謗不能引義不能引法非如來說不能利益安樂有情是名有犯有所違越是染違犯如是毀謗或由自內非理作意或隨順他而作是說若諸菩薩安住菩薩淨戒律儀若聞甚深最甚深處心不信解菩薩爾時應彊信受應無諂曲應如是學我為非善盲無慧目於如來眼隨所宣說於諸如來密意語言而生誹謗菩薩如是自處無知仰推如來於諸佛法無不現知等隨觀見如是正行無所違犯雖無信解然不誹謗考藏本云若諸菩薩聞菩薩藏中真實義甚深分或佛菩薩希有大力廣大分甚深最勝甚深之處不生信解而興毀謗謂非引義非能引法非如來說非能利益安樂有情如是毀謗或由自內非理作意或隨順他而作是說是名有犯有所違越是染違犯頌云毀謗背捨大乘藏謂若毀謗菩薩法藏是染違犯由聞何等興起毀謗謂由聽聞菩薩藏中所示甚深真實之義或佛菩薩難思神力甚深最勝甚深之處不能信順不起勝解而興毀謗言甚深者非異生境言最勝甚深者非聲聞獨覺之境言真實義或難思神力者顯於甚深廣大二分隨謗其一即名惡作毀謗之相有其四種一者謗說所詮下劣非智所依不能引義不能涅槃故二者謗說能詮下劣非福所依不能引法不能往善趣故三者謗說作者下劣非如來說四者以是義故謗其不能利益安樂有情如是四者隨說其一即名毀謗毀謗之因有其二種一或由自內非理作意二或隨順他而作是說從謗法中護心方便者謂若有聞甚深最勝甚深之處心未信解菩薩爾時應強信受應無諂曲應如是學我今盲無無漏慧眼唯有隨順如來眼行於諸如來為他事故密意語言而興毀謗非我應作菩薩如是自處無知仰推如來於後諸法無不現知正等觀見如是正行雖未畢竟生起信解然不毀謗則無違犯莊嚴經論云意罪性不善不應憎惡色况疑甚深法等置故無罪如寶鬘論云如來密意說非易了知故說一或三乘等置應自護等置尚無罪憎背成罪惡初修業者實難獲得稱心信解雖未信解若等置者亦無所犯二不正修果第三十一惡作若諸菩薩安住菩薩淨戒律儀於他人所有染愛心有瞋恚心自讚毀他是名有犯有所違越是染違犯無違犯者若為摧伏諸惡外道若為住持如來聖教若欲方便調彼伏彼廣說如前或欲令其未淨信者發生淨信已淨信者信復增長頌云於自讚揚而毀他謂以有染愛心及瞋恚心於他人所自讚毀他是染違犯有染愛心者如新疏及薩穆札疏并云是恃懱心或高舉心即我勝慢最勝子云我愛執心義同前釋是故此與他勝位中有大差別無違犯者若有所為一若為住持如來聖教而欲摧伏諸外道時二若欲以此方便調彼伏彼三若為令他未淨信者發生淨信已淨信者倍復增長於如是事雖復自讚乃至毀他亦無違犯三虧損慧門有二一不往求聞二於聽聞境不正修行一不往求聞第三十二惡作若諸菩薩安住菩薩淨戒律儀聞說正法論議决擇憍慢所制懷嫌恨心懷恚惱心而不往聽是名有犯有所違越是染違犯若為懶惰懈怠所蔽而不往聽非染違犯無違犯者若不覺知若有疾病若無氣力若知倒說若為護彼說法者心若正了知彼所說義是數所聞所持所了若已多聞具足聞持其聞積集若欲無間於境住心若勤引發菩薩勝定若自了知上品愚鈍其慧鈍濁於所聞法難受難持難於所緣攝心令定不往聽者皆無違犯頌云聞說法義不往聽謂若聞他說法講法或為正法論議决擇此有七種廣如集論所說憍慢所制懷嫌恨心懷恚惱心而不往聽是染違犯若為懶惰懈怠所蔽而不往聽非染違犯無違犯者若因自身一若未覺知有說法等二若有疾病而無氣力三若疑倒說四若正了知彼所說義是數所聞所持所了五若已多聞具足聞持其聞積集六若欲無間於境住心而勤引發菩薩勝定七若自了知其慧鈍濁於所聞法難受難持難於所緣攝心令定若已多聞三句謂聞聞已了知及聞圓滿難受等三謂聞思修若有所為謂為將護於自說法尊長之心恐其不悅雖不往聽亦無違犯二於聽聞境不正修行第三十三惡作若諸菩薩安住菩薩淨戒律儀於說法師故思輕毀不深恭敬嗤笑調弄但依於文不依於義是名有犯有所違越是染違犯考藏本云菩薩若於說法補特伽羅故思輕蔑不起恭敬嗤誚調弄又依文句而不依義是名有犯有所違越是染違犯頌云毀說法者復依文若於說法補特伽羅故思輕毀謂不至誠於說法師起導師想善知識想身不恭敬指謫嗤誚惡言調弄以妙文句為所專注但依於文不重義理不依於義是染違犯以要言之謂於所說雖有妙義而無妙文不事依止義雖不妙若文句妙便爾依止有師釋云謂說法者但演文句不演義理或不知義如是說者是未領悟頌中所說文字之義故菩薩地說四依時義同此品本論四十五卷菩提分品云謂諸菩薩為求義故從他聽法不為求世藻飾文辭菩薩求義不為求文而聽法時雖遇常流言音說法但依於義恭敬聽受最勝子及薩穆札疏中說此是不敬法罪新疏云上來所說三種惡作如其次第毀犯遠離惡見積聞加行攝善法戒中承事尊長言但依於文者謂毀說法者所說義中但依文句二違反饒益有情之罪有二一屬總境二屬別境初復有二一不辦義利二不拔損惱一不辦義利第三十四惡作若諸菩薩安住菩薩淨戒律儀於諸有情所應作事懷嫌恨心懷恚惱心不為助伴謂於能辦所應作事或於道路若往若來或於正說事業加行或於掌護所有財寶或於和好乖離諍訟或於吉會或於福業不為助伴是名有犯有所違越是染違犯若為懶惰懈怠所蔽不為助伴非染違犯無違犯者若有疹疾若無氣力若了知彼自能成辦若知求者自有依怙若知所作能引非義能引非法若欲方便調彼伏彼廣說如前若先許餘為作助伴若轉請他有力者助若於善品正勤修習不欲暫廢若性愚鈍於所聞法難受難持如前廣說若為將護多有情意若護僧制不為助伴皆無違犯藏本則以或於正說事業加行譯為或於正說或於事業加行頌云應作助伴不往助於諸有情應作八事一或於能辦所應作事二或於道路若往若來三或於正說四或於事業加行五或於掌護所有財寶六或於和好乖離諍訟七或於吉會八或於福業於如是等所應作事懷嫌恨心懷恚惱心不往助伴是染違犯若由懶惰懈怠二心不往助伴非染違犯言正說者如卓龍云於不了知各境域中所說方言教以方言餘七助伴廣釋如前此合前文於諸事業為作助伴科中第一思量所作事業第二功用所作事業為一助伴復加或於正說一事合而為八無違犯者若因自身一若有疾病而無氣力二若先許餘三若轉請餘有力者助四若勤修習望此更要增上善品五自性愚鈍不善通達所受教授雖不往助亦無違犯或於所作謂知所作不順正理能引非義能引非法雖不往助亦無違犯或於其境一若已了知求助辦者自力能辦二若了知彼自有依怙雖不往助亦無違犯或有所為一若欲方便調彼伏彼廣說如前二若為將護多餘有情懷嫌恨心三若護僧制雖不往助亦無違犯二不拔損惱有二一不為拔苦二不拔苦因初復有二一不拔別苦二不拔衆苦一不拔別苦第三十五惡作若諸菩薩安住菩薩淨戒律儀見諸有情遭重疾病懷嫌恨心懷恚惱心不往供事是名有犯有所違越是染違犯若為懶惰懈怠所蔽不往供事非染違犯無違犯者若自有病若無氣力若轉請他有力隨順令往供事若知病者有依有怙若知病者自有勢力能自供事若了知彼長病所觸堪自支持若為勤修廣大無上殊勝善品若欲護持所修善品令無間缺若自了知上品愚鈍其慧鈍濁於所聞法難受難持難於所緣攝心令定若先許餘為作供事頌云捨有病者不供事若見有情遭重疾病懷嫌恨心懷恚惱心而不為作服病役等供侍瞻事是染違犯若由懶惰懈怠二心非染違犯無違犯者若因自身一有疾病而無氣力二請有力能善能隨順患病者意令往供事三若慧鈍濁於所聞法難受難持難於所緣攝心令定四若先許餘雖不供事亦無違犯或於其境一若知病者有依有怙二若知病者自有勢力能自供事三若了知彼長病所觸堪自支持但須調養雖不供事亦無違犯或有所為謂為勤修廣大善品而欲護持令無間缺雖不供事亦無違犯二不拔衆苦第三十六惡作如於病者於有苦者為作助伴欲除其苦當知亦爾頌云於有苦者不為拔於此戒中有犯無犯是染非染如前不拔病苦所說所拔之苦能拔方便所有一切如前應知二不拔苦因第三十七惡作若諸菩薩安住菩薩淨戒律儀見諸有情為求現法後法事故廣行非理懷嫌恨心懷恚惱心不為宣說如實正理是名有犯有所違越是染違犯若由懶惰懈怠所蔽不為宣說非染違犯無違犯者若自無知若無氣力若轉請他有力者說若即彼人自有智力若彼有餘善友攝受若欲方便調彼伏彼廣說如前若知為說如實正理起嫌恨心若發惡言若顛倒受若無愛敬若復知彼性弊𢤱悷不為宣說皆無違犯頌云不於放逸說正理若見有情為求現法及後法事廣行非理懷嫌恨心懷恚惱心不為宣說如實稱機無過正理是染違犯若由懶惰懈怠二心不為宣說非染違犯無違犯者若因自身一若自不知宣說方便而無氣力二若轉請餘有力者說雖不宣說亦無違犯或於其境一若知由彼自能改悔二知彼已有善友攝受三若知為說如實正理便能於自起嫌恨心惡性違諫而顛倒受論中若發惡言四字藏譯為惡性違諫與別解脫僧伽伐尸沙之惡性違諫同名四若復知彼其性𢤱悷藏譯為野蠻或剛強於說正理不生愛敬雖不宣說亦無違犯或有所為謂欲以不宣說方便而調伏彼廣說如前雖不宣說亦無違犯二屬別境有二一不作饒益二不為調伏初復有六一於有恩所不正修行二於憂惱者不正修行三於貧乏者不正修行四於自徒衆不正修行五於應隨順不正修行六於有德者不正修行一於有恩所不正修行第三十八惡作若諸菩薩安住菩薩淨戒律儀於先有恩諸有情所不知恩惠不了恩惠懷嫌恨心不欲現前如應酬報是名有犯有所違越是染違犯若為懶惰懈怠所蔽不現酬報非染違犯無違犯者勤加功用無力無能不獲酬報若欲方便調彼伏彼廣說如前若欲報恩而彼不受皆無違犯頌云於有恩所不酬報於先有恩諸有情所不欲報恩不知恩惠不憶念恩或不思恩不了恩惠懷嫌恨心不能過上或以等分酬所恩惠下至少分亦不酬報是染違犯若由懶惰懈怠二心不現酬報非染違犯無違犯者若因自身謂勤勵力欲報其恩無力無能雖不酬報亦無違犯或有所為謂欲以不報恩方便而調伏彼雖不酬報亦無違犯廣說如前或於其境謂有恩者不欲報恩雖不酬報亦無違犯二於憂惱者不正修行第三十九惡作若諸菩薩安住菩薩淨戒律儀見諸有情墮在喪失財寶眷屬祿位難處多生愁惱懷嫌恨心不往開解是名有犯有所違越是染違犯若為懶惰懈怠所蔽不往開解非染違犯無違犯者應知如前於他事業不為助伴頌云於他愁惱不開解見他喪失親屬財寶藏本無祿位二字多生愁惱懷嫌恨心不往開解是染違犯若由懶惰懈怠二心不往開解非染違犯無違犯者與上所說應作助伴不往助相同愁惱分別開解方便前已廣說三於貧乏者不正修行第四十惡作若諸菩薩安住菩薩淨戒律儀有飲食等資生衆具見有求者來正希求飲食等事懷嫌恨心懷恚惱心而不給施是名有犯有所違越是染違犯若由懶惰懈怠放逸不能施與非染違犯無違犯者若現無有可施財物若彼希求不如法物所不宜物若欲方便調彼伏彼廣說如前若來求者王所匪宜將護王意若護僧制而不惠施皆無違犯頌云於求財物不給施見有求者如理止求飲食等事懷嫌恨心懷恚惱心而不給施資生衆具是染違犯若由懶惰懈怠放逸而不施與非染違犯無違犯者若因自身謂自無有可施財物雖不惠施亦無違犯或於諸物一不如法物謂因彼物現法後法當起過患二所不宜物謂非求者所宜所應雖不惠施亦無違犯或有所為謂欲以此不施方便調彼伏彼廣說如前二若施求者於王匪宜將護王意三為護僧制雖不惠施亦無違犯四於自往衆不正修行第四十一惡作若諸菩薩安住菩薩淨戒律儀攝受徒衆懷嫌恨心而不隨時無倒教授無倒教誡知衆匱乏而不為彼從諸淨信長者居士婆羅門等如法追求衣服飲食諸坐臥具病緣醫藥資身什物隨時供給是名有犯有所違越是染違犯若由懶惰懈怠放逸不往教授不往教誡不為追求如法衆具非染違犯無違犯者若欲方便調彼伏彼廣說如前若護僧制若有疹疾若無氣力不任加行若轉請餘有勢力者若知徒衆世所共知有大福德各自有力求衣服等資身衆具若隨所應教授教誡皆已無倒教授教誡若知衆內有本外道為竊法故來入衆中無所堪能不可調伏皆無違犯頌云不行利益徒衆事於所攝受一切徒衆懷嫌恨心而不隨時教授教誡知衆匱乏而不為彼從諸淨信長者居士婆羅門所如法追求衣服飲食諸坐臥具病緣醫藥資生什物是染違犯若由懶惰懈怠放逸不往教授不往教誡不為追求非染違犯無違犯者若因自身一若病無力不任加行二若轉請餘有勢力者雖不教求亦無違犯或有所為一欲以不教不求方便調彼伏彼二若護僧制雖不教求亦無違犯或於其境一若知徒衆有大福德自力能求衣食等事二若已為作隨其所應教授教誡三若本外道為竊法故來入衆中不堪調伏雖不教求亦無違犯此中財攝法攝方便前已廣說五於應隨順不正修行第四十二惡作若諸菩薩安住菩薩淨戒律儀懷嫌恨心於他有情不隨心轉是名有犯有所違越是染違犯若由懶惰懈怠放逸不隨其轉非染違犯無違犯者若彼所愛非彼所宜若有疾病若無氣力不任加行若護僧制若彼所愛雖彼所宜而於多衆非宜非愛若為降伏諸惡外道若欲方便調彼伏彼廣說如前不隨心轉皆無違犯頌云不能隨順他心轉若不隨順他心而轉有所違犯是染非染一切皆如上戒所說無違犯者若因自身謂病無力不任加行雖不隨轉亦無違犯或有所為一若彼所愛非是所宜謂能於彼後有損害或復由此於自有損二若彼所愛雖彼所宜而於多衆非宜非愛為護多衆不欣樂心三若護僧制四若為降伏諸惡外道五若欲以此不隨轉方便調彼伏彼廣說如前雖不隨轉亦無違犯六於有德者不正修行第四十三惡作若諸菩薩安住菩薩淨戒律儀懷嫌恨心他實有德不欲顯揚他實有譽不欲稱美他實妙說不讚善哉是名有犯有所違越是染違犯若由懶惰懈怠放逸不顯揚等非染違犯無違犯者若知其人性好少欲將護彼意若有疾病若無氣力若欲方便調彼伏彼廣說如前若護僧制若知由此顯揚等緣起彼雜染憍舉無義為遮此過若知彼德雖似功德而非實德若知彼譽雖似善譽而非實譽若知彼說雖似妙說而實非妙若為降伏諸惡外道若為待他言論究竟不顯揚等皆無違犯頌云有德譽者不稱揚謂若他有如前所說信戒聞等真實功德善美聲譽而不稱揚他實妙說不讚善哉由嫌恨心及由懶惰懈怠放逸是染非染所有一切如前所說無違犯者若因自身一若有疾病而無氣力不能讚說二若為待他言論究竟雖不讚說亦無違犯或於其境若了知彼性好少欲讚其功德轉令不喜或於所詮若了知彼相似功德而非實德相似善譽而非實譽相似妙說而非實妙雖不讚說亦無違犯或有所為一若欲以此不讚方便調彼伏彼廣說如前二若護僧制三若疑由此引彼雜染傲逸舉恃無義無利為遮此過四若為降伏諸惡外道雖不讚說亦無違犯二不作調伏有二一不作折伏非法行者二不作折伏憎聖教等一不作折伏非法行者第四十四惡作若諸菩薩安住菩薩淨戒律儀見諸有情應可訶責應可治罰應可驅擯懷染汙心而不訶責或雖訶責而不治罰如法教誡或雖治罰如法教誡而不驅擯是名有犯有所違越是染違犯若由懶惰懈怠放逸而不訶責乃至驅擯非染違犯無違犯者若了知彼不可療治不可與語喜出粗言多生嫌恨故應棄捨若觀待時若觀因此鬬訟諍競若觀因此令僧喧雜令僧破壞知彼有情不懷諂曲成就增上猛利慚愧疾疾還淨而不訶責乃至驅擯皆無違犯頌云不能稱緣作調伏謂見有情應可訶責應可治罰應可驅擯懷染污心而不訶責或雖訶責而不治罰或雖治罰而不驅擯是染違犯若由懶惰懈怠二心及放逸故非染違犯無違犯者若因自身謂觀待時雖不訶責乃至驅擯亦無違犯或於其境一不可療治謂了知彼不可與語惡性違諫多生嫌恨二知彼成就猛利慚愧疾疾還淨雖不訶責乃至驅擯亦無違犯或有所為一觀由訶責等事能起鬬訟諍競為令不起二若觀令僧喧雜破壞為遮是過雖不訶責乃至驅擯亦無違犯所言鬬訟諍競四事如卓龍云初一總言所餘三者一惡口還罵二舉手捶三訴諸王臣二不作折伏憎聖教等第四十五惡作若諸菩薩安住菩薩淨戒律儀具足成就種種神通變現威力於諸有情應恐怖者能恐怖之應引攝者能引攝之避信施故不現神通恐怖引攝是名有犯有所違越非染違犯無違犯者若知此中諸有情類多著僻執是惡外道誹謗賢聖成就邪見不現神通恐怖引攝無有違犯頌云不現神通作怖攝謂若菩薩成就種種神通變現及大威力應恐怖者能恐怖之應引攝者能引攝之見有依附如來聖教不具尸羅不應受用一切信施為令遠離於信施故而不示現神通變現恐怖引攝非染違犯律儀二十頌二疏之中有謂此是最後惡作亦應說為是染違犯似認非字為是字誤無違犯者若惡外道增上邪執誹謗神變是用咒術或和藥物不現神變亦無違犯新疏云上來所說十二惡作毀犯饒益有情戒中一一分位又一切處無違犯者謂若彼心增上狂亂若重苦受之所逼切若未曾受淨戒律儀當知一切皆無違犯附注此於他勝惡作總示無違犯相已釋於前文所斷罪中所依身科若依文判亦可於所斷罪下分為二總示無違犯相今從釋論不再列科頌云及具憐愍而慈愛有善心者無違犯二句總示若由憐愍一切有情及由慈愛一切有情謂欲利益或欲調伏於前所示約成立門約遮止門一切制立雖有現行而無違犯菩提賢云頌中及字能攝諸事若心極煩惱重苦受逼切睡眠及狂亂雖犯無違犯是謂二句頌文能攝本論所說若心狂亂若重苦受之所逼切皆無違犯寂壽云此頌是攝下文所言佛說貪是輕罪科中之無違犯後說為善二從彼罪中護心之相復次如是所起諸事菩薩學處佛於彼彼素怛纜中隨機散說謂依律儀戒攝善法戒饒益有情戒今於此菩薩藏摩怛理迦綜集而說菩薩於中應起尊重住極恭敬專精修學是諸菩薩從他正受戒律儀已由善清淨求學意樂菩提意樂饒益一切有情意樂生起最極尊重恭敬從初專精不應違犯考藏本云如是菩薩所學諸事唯一真實有所從出謂所依創律儀戒攝善法戒饒益有情戒由佛如來於諸別別素怛纜中隨機散說今於此菩薩藏摩怛履迦綜集而說菩薩於中生恭敬已由善清淨求學意樂求菩提意樂饒益有情意樂從他正受戒律儀後當極恭敬當勤修學即從始初應生恭敬不起違犯如上所說一切菩薩所學諸事唯一真實從契經出謂所依創三聚淨戒悉由大師隨機散說彼彼經中無著菩薩於此菩薩法藏摩怛理迦綜集散說圓成一品連續而說是故菩薩於此非自撰造學處為修學故生起恭敬即由三種圓滿意樂從他正受戒律儀已如實至誠住極恭敬如所制立當學不違所言三種圓滿意樂者謂善清淨求學意樂求菩提意樂饒益有情意樂諸疏說云如是三者即是修學三聚淨戒然或有說初一意樂謂是求學所學自性即三聚戒後二意樂謂為菩提為利他故而學三戒是說為善從初正受戒律儀始即應生起最極恭敬不起違犯本論菩薩地第十八章亦云若諸菩薩現前自稱我是菩薩於菩薩學不正修行當知是名相似菩薩非真菩薩若諸菩薩現前自稱我是菩薩於菩薩學能正修行當知是名真實菩薩是故菩薩莫作是念於菩薩學能修固妙即不正修不過爾爾觀論所說是勝教授既已正受菩薩律儀以行六度及四攝事為所進趣發大勇悍應隨正知如來聖教深廣道理趣大轍道諸正士行不應顧彼不了聖教真義理門而輕捨者三犯已還淨方便設有違犯即應如法疾疾悔除令得還淨又此菩薩一切違犯當知皆是惡作所攝應向有力於語表義能覺能受小乘大乘補特伽羅發露悔滅若諸菩薩以上品纏違犯如上他勝處法失戒律儀應當更受若中品纏違犯如上他勝處法應對於三補特伽羅或過是數應如發露除惡作法先當稱述所犯事名應作是說長老專志或言大德我如是名違越菩薩毗奈耶法如所稱事犯惡作罪餘如苾芻發露悔滅惡作罪法應如是說若下品纏違犯如上他勝處法及餘違犯應對於一補特伽羅發露悔法當知如前若無隨順補特伽羅可對發露悔除所犯爾時菩薩以淨意樂起自誓心我當决定防護當來終不重犯如是於犯還出還淨謂諸菩薩雖初勵力令不染犯設由無知或由放逸或煩惱盛或不恭敬四犯罪因而違犯者即應如法悔除還淨除他勝外所餘一切違越菩薩學處之罪皆惡作攝非如別解脫罪有多種若犯此罪應向隨一於悔罪法語表文義能覺能持小乘大乘補特伽羅發露悔滅其悔罪處若無具菩薩律儀者應向具別解脫律儀男女苾芻而行悔除不應向勤策等悔除以勤策等尚非犯別解脫所應悔罪處故若悔罪者是出家身現有出家是悔罪處亦不應向在家菩薩而行悔除若諸菩薩以上品纏違犯他勝處法由此即失淨戒律儀論說應當二次更受本論譯為應當更受攝决擇分亦云若有還得清淨受心復應還受藏土有師云不應超越兩次還受又有師云初受一次還受兩次合共三次聽許重受若過此數便太無慚故不聽許如此推度二次之義亦不應理言二次者望前初受說名第二非言以後不應受故印土一切可據論典未見有立如是數量故薩穆札疏云設由煩惱增上力故犯極重罪向諸僧伽作悔露已由利益諸有情意樂發菩提心即是還得清淨受心以淨意樂應當更受言二次者非唯兩次望先所受後復更受說名為二若中品纏所犯之罪應對於三補特伽羅或過是數悔露惡作謂住其前先當陳述所犯罪事次作是說仰祈長老護念我如是名如所稱事違越菩薩毗奈耶法犯惡作罪性是惡作品屬他勝餘如苾芻悔惡作法應如是說此中所云犯惡作罪上應冠稱所犯罪名例云犯自讚惡作罪或犯毀他惡作罪所言餘者謂餘文句如舊疏云如是衆罪我今敬向長老尊前發露悔除更不覆藏我悔露已得安樂住若不悔露不安樂住長老問言汝於此等見其罪否應答言見問後能護否答言如法如律敬善頂持第二第三亦如是說又新疏云應即答言憶念不忘正知觀見如法如律善為奉持又餘疏中於問護否唯作答言敬善防護爾時所作身威儀者如新疏云向悔罪處合掌禮拜次於下方蹲跪而坐合掌如前若下品纏違犯他勝處法及餘違犯應對於一補特伽羅發露悔滅軌則如前若無隨順補特伽羅可對發露悔除所犯謂無適應可對悔處爾時菩薩以淨意樂起自誓心我當决定防護當來終不重犯如是作者於犯還出最勝子等謂此顯示加持無犯如本論百卷攝事分云若所犯罪權持當悔然非論義菩薩律儀二十頌總攝其義云上纏律儀應更受中纏應向三前悔所餘一切悔於一染非自心亦如是末一句義謂是染非染一切惡作若無隨順補特伽羅應由自心一向慚愧調伏寂靜後不還作清淨意樂增上力故而行悔除亦如應向一補特伽羅前悔除寂壽云自心亦如是者亦舉一例顯示所餘於犯還淨方便復引若無隨順補特伽羅等文為證謂此方便亦適用於中下纏犯菩薩賢則云中下纏罪與餘惡作還淨方便决定不同謂中下纏若於所在不能求得或三或一補特伽羅須往餘求若惡作罪於其所在不能得一補特伽羅不須他求自心防護即能還出後者悔處未有决定前二悔處是决定故若不爾者論說向三或向一前於悔罪處分別决定則無道理若不足三補特伽羅悔且不淨豈有防護便能淨事菩薩地中未說自心亦如是故若如是誦是顛倒誦故應讀云染非染犯於自心以菩薩地於中下犯說對於三及對於一於餘違犯則說若無隨順補特伽羅應自心護此駁舊疏所立理趣然不應理以菩薩地云若下品纏違犯如上他勝處法及餘違犯應對於一補特伽羅發露悔法當知如前若無隨順補特伽羅可對發露悔除所犯爾時菩薩以淨意樂起自誓心我當决定防護當來終不重犯如是於犯還出還淨是明顯說下品纏犯還出還淨與餘一切惡作相同下纏既爾中品纏犯理亦應同謂由意樂於犯還出非定觀待有證明者是即犯已還淨總根本故菩薩地中雖無自心亦如是之明文然可說為若無隨順補特伽羅如於一前悔除能淨自心防護亦能清淨實有此義故有一類云諸染惡作若有悔處應對一悔非染惡作雖有悔處防護其心亦能清淨如是說者不應道理菩薩地說無分別故是故中品下品纏犯及彼四十五種惡作若有悔處唯防護心不得清淨應依論中所說而行外此所餘一切違犯亦以對一補特伽羅發露悔除易生慚愧為極妙善設不會遇即應想對諸佛菩薩而行悔除如戒品云於自愆犯審諦了知深見過失既審了知深見過已其未犯者專意護持其已犯者於佛菩薩同法者所發露悔除又菩薩地第十七章云又諸菩薩過去現在一切誤失一切違犯以淨調柔愛樂隨順所學戒心想對十方佛世尊前至誠發露悔往修來亦勸導他令行是事如是數數發露所犯少用功力一切業障皆得解脫已釋本論還淨方便而集菩薩學論則說總向虛空藏前夢中悔法別於菩薩輕重諸罪應悔除法引優波離所問經說如其所說令得還淨又新譯集菩薩學論引優波離所問經云舍利子菩薩所犯重罪有二何等為二一者瞋相應犯二者癡相應犯中又說云舍利子此中菩薩以質直心於初所犯應對十衆悔諸重罪復有所犯應對五衆悔諸重罪舍利子執女人手及眼顧視有損惱心諸輕違犯應對於一或二補特伽羅悔除若菩薩犯五無間罪從女人所犯罪從手所犯罪從童子所犯罪從窣堵波所犯罪從僧伽所犯罪及所餘罪應晝夜中專一向三十五佛前悔除重罪然優波離所問經本經譯云初犯重罪應對十衆質直悔除此譯甚善謂如前說二種重罪第一瞋相應所犯罪對十衆悔經又說云有諸重罪應對五衆悔除還淨此為第二癡相應所犯重罪本經又云執女人手所犯重罪應對五衆發露悔除此譯未當以與集菩薩學論中說彼違犯應對於一或二補特伽羅悔除不相順合又與本經略教誡品及經中說貪所發起其罪尚輕亦復相違又舊譯集菩薩學論謂執女人手等三罪應對於一或二補特伽羅露悔說此三罪名為重罪在新譯中說為輕罪似極善通又本經中未說有損惱心之罪明係經文有所缺漏以集菩薩學論有其文故又瞋相應說名重罪有損惱心說名輕罪亦不相違意謂略起損害意樂心未憤發復次經說五無間等一切重罪應依三十五佛悔罪晝日及夜淨修治者意謂如向補特伽羅令三次作還淨儀軌仍不能淨苦異熟故趣入菩薩行論云若晝若夜各三次應當讀誦三聚經依止佛及菩提心能令滅除所餘罪如是所說還淨方便謂除根本諸所餘罪或除故思所造罪外所餘忘念或不正知所造諸罪應當讀誦三聚懺經依止佛力菩提心力令其滅除智慧生釋云言三聚者謂是悔罪隨喜回向三種以此立為悔露罪法又善天謂依止佛及菩提心者是四力中之依止力即是歸趣及與發心菩薩所學無有盡際故此還淨至極切要除由故思所造罪外所餘諸罪悉能清淨雖能淨治往昔所犯若無防護當來終不重犯之心亦難清淨如慈氏獅子吼經云慈氏後五百歲適當正法將隱沒時頗有自稱我是菩薩彼等不護其身語意造多惡業犯衆多罪唯冀悔罪便得清淨而不誓心防護當來於當來中應正防護而亦不護慈氏我為滅除往昔所造諸惡業故乃為宣說三聚法門世人無知貪造衆罪造衆罪已唯念悔除便得清淨不護當來今由覩見如上所說還淨方便為能清淨尸羅重要支分故廣釋說大轍理趣又諸菩薩欲受菩薩淨戒律儀若不會遇具足功德補特伽羅爾時應對如來像前自受菩薩淨戒律儀應如是受偏袒右肩右膝著地或蹲跪坐作如是言我如是名仰啓十方一切如來已入大地諸菩薩衆我今欲於十方世界佛菩薩所誓受一切菩薩學處誓受一切菩薩淨戒謂律儀戒攝善法戒饒益有情戒如是學處如是淨戒過去一切菩薩已具未來一切菩薩當具普於十方現在一切菩薩今具於是學處於是淨戒過去一切菩薩已學未來一切菩薩當學普於十方現在一切菩薩今學第二第三亦如是說說已應起所餘一切如前應知此段已釋於無師儀軌科中四佛說貪是輕罪密意又於菩薩犯戒道中無無餘犯如世尊說是諸菩薩多分應與瞋所起犯非貪所起當知此中所說密意謂諸菩薩愛諸有情憐諸有情增上力故凡有所作一切皆是菩薩所作非非所作非作所作可得成犯若諸菩薩憎諸有情嫉諸有情不能修行自他利行作諸菩薩所不應作作不應作可得成犯謂於菩薩違犯道中無無餘犯無餘罪見前如世尊說菩薩所犯當知多分從瞋所起非貪所起此中密意謂諸菩薩貪愛有情慈愍有情增上力故凡有所作皆是菩薩所應作事作所應作豈得成犯若瞋有情便非能修自他利行此非菩薩所應作事作不應作即得成犯大乘莊嚴經論云為利諸有情起貪不名罪瞋於一切種違逆諸有情優波離所問經亦云已正趣入大乘菩薩犯恆沙數貪相應罪與犯一種瞋相應罪菩薩法乘增上力故瞋罪極重以此瞋罪棄捨有情貪相應犯攝受有情故優波離若由煩惱能攝有情菩薩於彼不應羞怖故為汝說貪相應罪不名為犯此中易起誤解因緣寂天菩薩於集菩薩學論中釋其密意集菩薩學論云是義云何謂能攝受一切有情即如前已分別說故此中義者謂貪相應不名有罪如前所說光明梵志利有情時所開貪欲非謂菩薩隨所有貪如經前文已分別說攝有情貪故何等依身密意說為貪不成犯集菩薩學論云今此所示謂能成就增上意樂及悲愍者如前經云優波離若諸菩薩無善方便怖畏於貪相應所犯非瞋相應若諸菩薩善權方便怖畏於瞋相應所犯非貪相應何等名為善權方便謂是能以慧悲雙轉不捨有情是說已能堅固大悲為本勝菩提心及已成就通達一切法無自性勝慧力者是故於貪與瞋分別建立或有所犯或不犯者諸有智人不應疑是畢竟不雜貪欲慈愛以此慈愛與彼瞋者或同有罪或同無罪不待決疑故若謂菩薩於一切中諸有貪心皆無違犯是太廣泛應如集菩薩學論所說若屬有情重大義利慈愛有情有多分位貪可無犯瞋則云何有謂若為遮退損惱而起瞋忿云何成犯如論說云遇此分位煽動習氣便成失壞悲愍之罪若斷悲愍即斷根本於下當說設以瞋忿能利有情然由菩薩壞悲愍故即成失壞廣大利益有情相續如其所說無有分位可開許瞋又以菩薩為所緣時如功德女貪愛難提迦菩薩增上力故捨命以後往生天界若於菩薩起瞋恚者則如頌云佛說如起惡心量爾許劫住那落迦故一切種悉不相同如集菩薩學論所取貪心無犯密意當知菩薩地中密意亦爾五分別所犯罪有大小又諸菩薩軟中上犯如攝事分應當了知如攝毗奈耶摩怛理迦云由五因緣當知所犯成下中上三品差別何等為五一由自性故二由毀犯故三由意樂故四由事故故五由積集故一由自性者謂他勝罪聚是上品罪衆餘罪聚是中品罪所餘罪聚是下品罪復有差別謂他勝衆餘是重品罪隕墜別悔是中品罪惡作罪聚是輕品罪二由毀犯者謂無知故及放逸故所犯衆罪是下品罪煩惱盛故所犯衆罪是中品罪由輕慢故所犯衆罪是上品罪三由意樂者謂由下品貪瞋癡纏所犯衆罪是下品罪若由中品是中品罪若由上品是上品罪四由事故者謂雖現行相等意樂然由其事非一類故應知所犯成下中上三品差別如以瞋纏於傍生趣所有衆生故思殺害生隕墜罪即以如是相等瞋纏或於其人或人形狀非父非母故思殺害生他勝罪非無間罪即以如是相等瞋纏於人父母故思殺害生他勝罪及無間罪五由積集者謂如有一或犯一罪不能如法速疾悔除或二或三乃至或五如是應知由積集故成下品罪從此以後或犯十罪或犯二十或犯三十乃至或犯可了知數罪不能如法速疾悔除如是應知由積集故成中品罪若所犯罪其數無量不可了知如是應知由積集故成上品罪此中自性事故二位不可和合餘三同類又彼略由四因緣故犯所犯罪一無知故二放逸故三煩惱盛故四輕慢故謂若有一於所犯罪不審聽聞不善領悟無有覺慧無所知故於其所犯起無犯想而犯衆罪是名由無知故犯所犯罪又若有一於所犯罪雖有覺慧亦有所知而住忘念住不正知由彼如是不住念故而犯衆罪是名由放逸故犯所犯罪又若有一於其所犯雖有覺慧亦有所知而彼本性貪瞋癡等極為猛利彼由猛利貪瞋癡故雖知是事所不應為煩惱纏逼不自在故而犯衆罪是名由煩惱盛犯所犯罪又若有一於所犯罪雖有覺慧亦有所知而彼信解極為下劣無有彊盛宿善因行由其信解極下劣故於沙門性於般涅槃無有顧戀於佛法僧無敬無憚無有羞恥不樂所學由輕慢故隨其所欲廣犯衆罪是名由輕慢故犯所犯罪當知此中無知放逸所犯衆罪是不染污由煩惱盛及以輕慢所犯衆罪則是染污於彼犯罪四種因緣應有對治一於所犯罪通達善巧二恆常習近正念正知三勤修猛利煩惱對治四有慚有愧恭敬大師尊敬所學六安樂住因如是菩薩依止一切自毗奈耶勤學所學便得成就三種圓滿安樂而住一者成就加行圓滿二者成就意樂圓滿三者成就宿因圓滿云何名為加行圓滿謂諸菩薩於淨戒中行無缺犯於身語意清淨現行不數毀犯發露自惡如是名為加行圓滿云何名為意樂圓滿謂諸菩薩為法出家不為活命求大菩提非為不求為求沙門為求涅槃非為不求如是求者不住懈怠下劣精進不雜衆多惡不善法雜染後有有諸熾然衆苦異熟當來所有生老病死如是名為意樂圓滿云何名為宿因圓滿謂諸菩薩昔餘生中修福修善故於今世種種衣服飲食臥具病緣醫藥資身什物自無匱乏復能於他廣行惠施如是名為宿因圓滿菩薩如是依毗奈耶勤學所學成就如是三種圓滿安樂而住與此相違當知成就三種衰損危苦而住如是略廣宣說菩薩若在家品若出家品一切戒已自斯以後即於如是一切戒中分出所餘難行戒等差別之相應當了知考藏本以為求沙門譯為求沙門性菩薩於自毗奈耶中勤學所學便能成就三種圓滿安樂而住一者加行圓滿謂諸菩薩初於淨戒行無缺犯於身語意清淨現行中於所學尊重恭敬安住上品不放逸行不數毀犯最後時中設有毀犯悔露自惡由是覩見清淨無犯晝夜歡喜安樂而住二者意樂圓滿謂諸菩薩唯為如法修行意樂而乃出家非依活命意樂求大菩提非為不求求沙門性及大涅槃如攝毗奈耶摩怛履迦云於沙門性於般涅槃非為不求如是求者於諸善法發勤精進不住懈怠下劣精進不雜衆多惡不善法由此能令無有雜染安樂而住言不善者謂於現法生多雜染復招後有前者過患有諸熾然熱惱身心後者過患感受惡趣衆苦異熟故引長夜生及老死沙門性者即十地中修行三學之道即通達位修習位中所修行者大涅槃者謂是無住涅槃最勝子等謂此二者即是正修加行之果三者宿因圓滿謂諸菩薩昔餘生中已能修集布施之福修集斷除障礙廣大受用之善故於今世衣服飲食臥具病緣醫藥資生什物自無匱乏復能於他廣行惠施由此道理永離貧匱安樂而住與此三種圓滿相違當知成就三種衰損危苦而住如是略詮自性廣釋一切宣說菩薩若在家品若出家品一切戒已自斯以後即於如是一切戒中分出所餘難行戒等七差別相三分釋一切戒中所分出戒此復有七謂從難行戒乃至清淨戒初釋難行戒有三第一難行戒云何菩薩難行戒當知此戒略有三種謂諸菩薩現在具足大財大族自在增上棄捨如是大財大族自在增上受持菩薩淨戒律儀是名菩薩第一難行戒現在具足廣大受用即大財自在增上藏本無大族二字棄捨此二正受菩薩淨戒律儀廣大受用有其四種一能受用身圓滿具足二共受用伴衆多仁慈可意親屬三成辦受用廣有僕使四所受用物食等豐饒或加有所為故受用長壽合而為五自在增上者語言信重諸有所欲隨欲自在第二難行戒又諸菩薩受淨戒已若遭急難乃至失命於所受戒尚無少缺何况全犯是名菩薩第二難行戒雖遭急難乃至失命於所受戒尚不放逸令少虧缺何况全犯第三難行戒又諸菩薩如是如是遍於一切行住作意恆住正念常無放逸乃至命終於所受戒無有誤失尚不輕犯何况犯重是名菩薩第三難行戒既受戒已乃至存活遍於一切行住作意恆常安住正念正知五不放逸於所受戒尚不誤犯極微細罪何况犯重如是三種難行之戒餘疏有說初是難受次是難護後難究竟德光則謂唯分難受難護二類初是難受後二並是難護之戒是說為善謂後二中初由逆緣難守護者乃至失命守護不犯後由學處及一切時難守護者乃至命終雖微細罪亦護不染如是三戒雖於現生不能實學亦當發願淨修治心於餘生中能如實學二一切門戒云何菩薩一切門戒當知此戒略有四種一者正受戒二者本性戒三者串習戒四者方便相應戒正受戒者謂諸菩薩受先所受三種菩薩淨戒律儀即律儀戒攝善法戒饒益有情戒本性戒者謂諸菩薩住種性位本性仁賢於相續中身語二業恆清淨轉串習戒者謂諸菩薩昔餘生中曾串修習如先所說三種淨戒由宿因力所住持故於現在世一切惡法不樂現行於諸惡法深心厭離樂修善行於善行中深心欣慕方便相應戒者謂諸菩薩依四攝事於諸有情身語善業恆相續轉此中有四一正受戒者謂由現緣加行成辦正受三戒二本性戒者謂不待思惟造作發願堪能覺寤成就六波羅密多相住種性位於心相續本性仁賢身語二業恆清淨轉三串習戒者謂從往昔久遠時中數數趣入三聚淨戒即依餘生串習因力所住持故於諸惡行一切一切不樂現行深心厭離於諸善行深心欣慕四方便相應戒者謂依四攝化他方便於諸有情身語善業恆清淨轉如是四戒為能趣入一切戒門是故名為一切門戒言四攝者一者布施攝事謂以財攝二者愛語攝事謂於所攝善為教授諸取捨處三者利行攝事謂隨所應勸導令修四者同事攝事謂如順合他所修行自亦如是而善安住如是四攝廣釋於本論三十八卷菩提品及四十三卷攝事品中三善士戒云何菩薩善士戒當知此戒略有五種謂諸菩薩自具尸羅勸他受戒讚戒功德見同法者深心歡喜設有毀犯如法悔除此有五種一自具尸羅二於他安住中庸品者勸令受戒三於他一切憎背戒者讚戒功德令彼止息其嫌恨心四若時見他正行同法深心歡喜無有嫉妬五設有毀犯如法悔除如是五者於他有情斷無義利而能引發無餘義利與善士業堪能相應名善士戒由初後戒成辦自利由餘三戒成辦利他四一切種戒云何菩薩一切種戒當知此戒以要言之六種七種總十三種言六種者一回向戒回向大菩提故二廣博戒廣攝一切所學處故三無罪歡喜處戒遠離耽著欲樂自苦二邊行故四恆常戒雖盡壽命亦不棄捨所學處故五堅固戒一切利養恭敬他論本隨煩惱不能伏故不能奪故六尸羅莊嚴具相應戒具足一切戒莊嚴故尸羅莊嚴如聲聞地應知其相言七種者一止息戒遠離一切殺生等故二轉作戒攝一切善故饒益有情故三防護戒隨護止息轉作戒故四大士相異熟戒五增上心異熟戒六可愛趣異熟戒七利有情異熟戒藏本分別六種戒名與論不同廣如釋文當知此戒合十三種開有六種及與七種言六種者一廣博戒總持廣大學處故依處圓滿回向大菩提故得果圓滿二無罪戒遠離耽著欲樂邊故離染污樂三隨順歡喜處戒遠離自苦疲勞邊故離無義苦四恆常戒乃至盡壽修行不捨所受學處遠離學處中間留難五堅固戒由不顧戀利養恭敬一切利養恭敬不能蔽故不能奪故由於自道決定堅固他來諍論如本論十五卷所說不能蔽故不能奪故由能持續斷滅所斷根本煩惱及隨煩惱不能蔽故不能奪故諸疏有云不捨自學不受外道所依律儀故他諍論不能抑蔽不捨所學於前恆常戒中已說非此戒義六尸羅莊嚴相應戒如聲聞地所說沙門莊嚴十七種應知其相聲聞地嗢柁南曰正信而無諂少病精進慧具少欲喜足易養及易滿杜多德端嚴知量善士法具聰慧者相忍柔和賢善言七種者一止息戒謂正受持遠離畢竟不應作事即殺生等諸惡行故二轉作戒即趣入戒謂學一向定應作事即攝善法饒益有情三防護戒恆不放逸防護止息轉作二戒如是三者戒自性分別四大士相異熟戒此大士相即本論四十九卷建立品中之大丈夫相謂三十二大丈夫相如四十三卷云此中所有一切種施一切種戒廣說乃至一切種同事若多修習若善清淨若具圓滿能感如來無量殊勝福德所攝三十有二大丈夫相八十隨好莊嚴身果趣入修習於諸地中感得如實相稱妙相廣如本論四十九卷中說五增上心異熟戒能正引發菩薩衆多勝三摩地六可愛趣異熟戒能正感得人天之身七利有情異熟戒能正感得利有情果如是四者戒果分別德光云此四戒中初一是攝善法戒二三兩戒是律儀戒後是饒益有情戒德光又云言六種者謂與何種功德相應言七種者自性與果種類差別五遂求戒損求戒云何菩薩遂求戒當知此戒略有八種謂諸菩薩自諦思惟如我希求勿彼於我現行斷命不與而取穢欲邪行虛妄離間粗惡綺語手塊杖等諸非愛觸加害於我我求是已他若相違而現行者我求不遂我意不悅如我希求他亦如是勿我於彼現行斷命廣說乃至惡觸加害彼求是已我若相違而現行者彼求不遂彼意不悅我之所作若有令他所求不遂意不悅者何現行為菩薩如是審思惟已命難因緣亦不於他現行八種所求不遂不悅意事如是八種說名菩薩遂求戒此有八種謂斷命等八自所不求與此相違是八所求若他造作自所不求斷命等八我有損害我意不悅如我所求他有情所亦復如是比度自心諦思惟已命難因緣亦不於他現行八種所不求事八不求者一斷命二不與而取三穢欲邪行四虛妄語五離間語六粗惡語七綺語八手足塊石刀杖三種捶害觸非可愛觸八所求者與上相違一壽量長久二受用廣大三妻室貞良四無諸欺誑五眷屬和好六聞和順語七語有義利八諸可愛觸由是遣除八有損害所不求事引發八種是所求事如是淨戒名損求戒此與本論九卷有尋有伺等三地中所說相同如彼地云損益門者謂於諸有情依十不善業道建立八損害門何等為八一損害衆生二損害財物三損害妻妾四虛僞友證損害五損害助伴六顯說過失損害七引發放逸損害八引發怖畏損害與此相違依十善業道建立八利益門應知六此世他世樂戒云何菩薩此世他世樂戒當知此戒略有九種謂諸菩薩為諸有情於應遮處而正遮止於應開處而正開許是諸有情應攝受者正攝受之應調伏者正調伏之菩薩於中身語二業常清淨轉是則名為四種淨戒復有所餘施忍精進靜慮般若波羅密多俱行淨戒則為五種總說名為九種淨戒如是菩薩所有淨戒能令自他現法後法皆得安樂是故說名菩薩此世他世樂戒分別言之四種五種合為九種四種戒者一若諸有情趣入苦因應遮止處正遮止之二若諸有情不趣樂因應開許處正開許之令修彼因三若諸有情於開遮處能正趣入應攝受者正攝受之四若諸有情於開遮處不正趣入應調伏者正調伏之自於此四身語二業常清淨轉言五種者謂除尸羅所餘五種波羅密多俱行淨戒如是菩薩所有淨戒能令自他現法後法皆得安樂故名此世他世樂戒五種俱行淨戒者如最勝子等釋云由布施度於未來世受用廣大忍度能為自他此世他世樂因於未來世眷屬具足由精進度此世不雜衆不善法於未來世有大勇悍由靜慮度此世樂住於未來世生清淨天由般若度於此世中具足聰慧於未來世勝進般若七清淨戒云何菩薩清淨戒當知此戒略有十種一者初善受戒唯為沙門三菩提故非為命故二者不太沈戒於違犯時遠離微薄生悔愧故及不太舉戒遠離非處生悔愧故三者離懈怠戒於睡眠樂倚樂臥樂不耽著故晝夜勤修諸善品故四者離諸放逸所攝受戒修習如前所說五支不放逸故五者正願戒遠離利養恭敬貪故不願生天而自要期修梵行故六者軌則具足所攝受戒於諸威儀所作衆事善品加行妙善圓滿如法身語正現行故七者淨命具足所攝受戒離矯詐等一切邪命過失法故八者離二邊戒遠離受用欲樂自苦二邊法故九者永出離戒遠離一切外道見故十者於先所受無損失戒於先所受菩薩淨戒無缺減故無破壞故如是十種是名菩薩清淨戒初善受戒者為求道位沙門性故求究竟位圓滿菩提故而受淨戒非為逃脫王等逼迫非為活命而乃受故不太沈戒者於有制立諸學處中有所違犯微薄悔愧此微薄悔即是太沈能遠離之而大悔愧如聲聞地云云何名為太極沈下謂如有一性無羞恥惡作羸劣勘同藏本惡作羸劣即是悔愧微薄論文前後異譯為性慢緩於諸學處所作慢緩如是名為太極沈戒故知遠離微薄悔愧是謂應有極大悔愧有謂乃至微薄悔愧亦復無有由其無有可悔愧故藏譯為無有微薄悔愧故有此譯名不太沈當知此是極顛倒說不太舉戒者於佛如來未制立處非悔愧處而亦悔愧有所違越是名太舉故當遠離離懈怠戒者於睡眠樂倚樂臥樂悉不耽著晝日及夜勤修善品離諸放逸所攝受戒者依止如前所說五支不放逸故正願戒者不為貪著利養恭敬非願生天而乃要期安住梵行軌則具足所攝受戒者於行住等所有威儀披法衣等所作衆事修誦持等善品加行不越世間及毗奈耶身語現行妙善圓滿淨命具足所攝受戒者離矯詐等五邪命法一切過失離二邊戒者從他求取或法非法衣服飲食諸臥具等愛玩受用不觀過患是名受用欲樂之邊若臥荊棘灰坌等中或三事火或三升水自取煎迫受極苦楚隨逐加行令自疲苦名自苦邊如是二邊悉應遠離永出離戒者畢竟遠離諸外道見於先所受無損失戒者不令一切一切無慚不顧學處違制立處而有缺減不令現行根本重罪而有破壞如是廣說有十一種若略攝說成十種戒云何略攝最勝子云若能如實於諸制立而正修學便能清淨即能對治此二過失謂於不勤加行學處太沈過失隨未制立學處而轉太舉過失二種對治總攝為一顯合不太沈戒不太舉戒二戒為一論文亦依此義德光云於意樂中有二過失一最初受時惡受尸羅二正防護時太沈太舉亦合彼二以為一戒薩穆札疏云最後一種於先所受無損失戒者當是總結前十而說上來諸說皆不應理本論論師無著菩薩於聲聞地說十清淨相違逆品十過患時有云放逸懈怠所攝是攝放逸懈怠二者為一故不放逸與不懈怠二者亦應合而為一當知即是此論密意謂如聲聞地云云何十種虧損因緣一者最初惡受尸羅二者太極沈下三者太極浮散四者放逸懈怠所攝五者發起邪願六者軌則虧損所攝七者淨命虧損所攝八者墮在二邊九者不能出離十者所受失壞故若遠離如是十種虧損因緣即名圓滿亦即名為十清淨戒梵本正文唯說攝為十清淨戒未細分別譯師為求極顯了故冠以數字古德亦復有疑難者如倫記云基云十相如地持此中第二彼開為二太沈為一太舉為一攝此第六軌則第七淨命為一其實軌則淨命義別不可為一太沈太舉義等不可為二彼之謬也此第二中太舉戒言非處者謂持戒太過遂持非處可持之處名處過此可持不可持處為非處若太舉過此至非處可生悔愧也測云如下七十五卷决擇云復次前戒品中已說十種尸羅清淨當知初一是意樂清淨餘九是加行清淨於加行中復有五種一無間斷缺加行二遍修加行三通向加行四助伴加行五守護加行第二第三為初加行第四為第二加行第五為第三加行第六第七第八第九為第四加行第十為第五加行其第二第三明無間加行中前一明離沈舉以明無間加行後一離懈怠等明無間加行言太沈等者明離小犯生於悔愧妨利他行太舉等者於非戒處作悔愧如外道雞猪戒等言如前所說五支不放逸者指前戒品初持謂三際俱行及先時所作俱時隨行不放逸行後攝事分亦明之若依舊論第六第七合之為一今開為二第二第三合為第二準決擇無間缺加行及助伴加行得知舊論開合者錯也此亦未了本論所說十種虧損即是與此十種清淨為相違品今引其文以資對照令善明了十清淨相如本論二十二卷聲聞地出離地品云一云何名為最初惡受尸羅律儀謂如有一王所逼迫而求出家或為狂賊之所逼迫或為債主所逼迫或為怖畏之所逼迫或不活畏之所逼迫而求出家不為沙門性不為婆羅門性不為自調伏不為自寂靜不為自涅槃而求出家如是名為最初惡受尸羅律儀此與初善受戒為相違品二云何名為太極沈下謂如有一性無羞恥惡作羸劣為性慢緩於諸學處所作慢緩如是名為太極沈下此與不太沈戒為相違品三云何名為太極浮散謂如有一堅執惡取非處惡作於不應作諸惡作中浪作惡作非處於他起輕懱心或惱害心於其非處強生曉悟如是名為太極浮散此與不太舉戒為相違品四云何放逸懈怠所攝謂如有一由過去世毀犯所犯於此毀犯由失念故一類不能如法還淨如由過去由未來世由現在世當知亦爾謂毀犯所犯於此毀犯由失念故一類不能如法還淨又非先時於所毀犯發起猛利無犯樂欲謂我定當如如所行如如所住如是如是行於所行如是如是住於所住於所毀犯終不毀犯由是因緣隨所行住如是如是毀犯所犯由此成就前際俱行後際俱行中際俱行先時所作及俱隨行所有放逸又自執取睡眠為樂偃臥為樂脅臥為樂性不翹勤為性懶惰不具起發於諸有智同梵行者不能時時覲問供事是名放逸懈怠所攝此與離懈怠戒離諸放逸所攝受戒為相違品五云何名謂發起邪願謂如有一依止邪願修行梵行言我所有若戒若禁若常精勤若修梵行當得生天或餘天處或復愛樂利養恭敬而修梵行謂因此故從他希求利養恭敬即於如是利養恭敬深生染著如是名為發起邪願此與正願戒為相違品六云何軌則虧損所攝謂如有一於威儀路或所作事或諸善品加行處所所有軌則不順世間違越世間不順毗奈耶違越毗奈耶準前廣說是名軌則虧損所攝此與軌則具足所攝受戒為相違品又彼品所說軌則圓滿即是本戒軌則具足所攝受戒如彼品云云何名為軌則圓滿謂如有一或於威儀路或於所作事或於善品加行處所成就軌則隨順世間不越世間隨順毗奈耶不越毗奈耶云何名為於威儀路成就軌則隨順世間不越世間隨順毗奈耶不越毗奈耶謂如有一於所應行於如所行即於此中如是而行由是行故不為世間之所譏毀不為賢良正至善士諸同法者諸持律者諸學律者之所呵責如於所行於其所住所坐所臥當知亦爾如是名為於威儀路成就軌則隨順世間不越世間隨順毗奈耶不越毗奈耶云何名謂於所作事成就軌則隨順世間不越世間隨順毗奈耶不越毗奈耶謂如有一於其所作若衣服事若便利事若用水事若楊枝事若入聚落行乞食事若受用事若蕩鉢事若安置事若洗足事若為敷設臥具等事即此略說衣事鉢事復有所餘如是等類諸所應作名所作事如其所應於所應作於如所作即於此中如是而作由是作故不為世間之所譏毀不為賢良正至善士諸同法者諸持律者諸學律者之所呵責如是名為於所作事成就軌則隨順世間不越世間隨順毗奈耶不越毗奈耶云何名為於諸善品加行處所成就軌則隨順世間不越世間隨順毗奈耶不越毗奈耶謂於種種善品加行若於正法受持讀誦若於尊長修和敬業參覲承事若於病者起慈悲心殷重供侍若於如法宣白加行住慈悲心展轉與欲若於正法請問聽受翹勤無情於諸有智同梵行者盡其身力而修敬事於他善品常勤讚勵常樂為他宣說正法入於靜室結加趺坐繫念思惟如是等類諸餘無量所修善法皆說名為善品加行彼於如是隨所宣說善品加行如其所應於所應作於如所作即於此中如是而作由是作故不為世間之所譏毀不為賢良正至善士諸同法者諸持律者諸學律者之所呵責如是名為於諸善品加行處所成就軌則隨順世間不越世間隨順毗奈耶不越毗奈耶若於如是所說行相軌則差別悉皆具足應知說名軌則圓滿七云何淨命虧損所攝謂如有一為性大欲不知喜足難養難滿常以非法追求衣服飲食臥具病緣醫藥及諸資具不以正法又為貪求種種衣服飲食臥具病緣醫藥資具因緣方便顯己有勝功德矯詐構集非常威儀為誑他故恆常詐現諸根無掉諸根無動諸根寂靜由是令他謂其有德當有所施當有所作所謂承事供給衣服飲食臥具病緣醫藥及諸資具又多凶悖張口矯傲修飾其名執恃種姓或求多聞或任持法為利養故亦復為他宣說正法或佛所說或弟子說或自宣說己實有德或少增益或於他前方便現相為求衣服或求隨一沙門資具或為求多或求精妙雖無匱乏而現被服故弊衣裳為令淨信長者居士婆羅門等知其衣服有所匱乏殷重承事給施衆多上妙衣服如為衣服為餘隨一沙門資生衆具亦爾或於淨信長者居士婆羅門所如其所欲不得稱遂或彼財物有所闕乏求不得時即便強逼研磨粗語而苦求索或彼財物無所闕乏得下劣時便對施主現前毀棄所得財物如是告言咄哉男子某善男子某善女人方汝族姓及以財寶極為下劣又極貧匱而能惠施如是如是多妙悅意資産衆具汝望於彼族姓尊貴財寶豐饒何為但施如是少劣非悅意物彼由如是或依矯詐或邪妄語或假現相或苦研逼或利求利種種狀相而從他所非法希求所有衣服飲食臥具病緣醫藥諸資生具非以正法而有所求由非法故說名邪命如是名為尸羅淨名虧損所攝此與淨命具足所攝受戒為相違犯八云何名為墮在二邊謂如有一耽著受用極樂行邊從他所得或法非法所有衣服飲食臥具病緣醫藥及諸資具愛玩受用不觀過患不知出離是名一邊復有一類好求受用自苦行邊以無量門而自煎迫受極苦楚謂依棘刺或依灰坌或依木杵或依木板或狐蹲住或狐蹲坐修斷瑜伽或復事火謂乃至三承事於火或復升水謂乃至三升上其水或一足住隨日而轉或復所餘如是等類修自苦行是第二邊如是名為墮在二邊此與離二邊戒為相違品九云何名為不能出離謂如有一或戒或禁由見執取謂我因此若戒若禁當得清淨解脫出離一切外道所有禁戒雖善防護雖善清淨如其清淨不名出離如是名為不能出離此與永出離戒為相違品十云何名為所受失壞謂如有一都無羞恥不顧沙門毀犯淨戒習諸惡法內懷腐敗外現貞實猶如淨水所生蝸牛螺音狗行實非沙門自稱沙門實非梵行自稱梵行如是名為所受失壞此與於先所受無損失戒為相違品四釋戒勝利有二一究竟勝利二現前勝利一究竟勝利如是菩薩大尸羅藏能起當來大菩提果謂依此故菩薩淨戒波羅密多得圓滿已現證無上正等菩提如是菩薩大尸羅藏善能生起大菩提果謂依此故畢竟圓滿戒波羅密多現證無上正等菩提言大藏者謂是廣大福德資糧亦名廣博無量圓滿尸羅二現前勝利乃至未證無上菩提依此無量菩薩戒藏正勤修習常能獲得五種勝利一者常為十方諸佛護念二者將捨命時住大歡喜三者身壞以後在在所生常與淨戒若等若增諸菩薩衆為其同分為同法侶為善知識四者成就無量大功德藏能滿淨戒波羅密多五者現法後法常得成就自性淨戒戒成其性乃至未證菩提位中亦能獲得五種勝利一者如前所說常為諸佛之所護念二者將捨命時住勝歡喜三者身壞以後隨所生處常有與自同等淨戒或復增上諸菩薩衆而為同分為同法侶為善知識四者於現法中成就能滿戒波羅密多無量福藏五者於後法中常得自然出生淨戒戒成其性此中第二勝利如最勝子等釋云由能作意後世遭遇諸佛菩薩故可超脫捨命怖畏得勝歡喜薩穆札云由二因緣住勝歡喜一如頃所說二謂已具足無量善根無惡趣畏五種勝利如其次第如德光疏謂是五果即增上果離繫果異熟果士用果等流果此中釋為離繫果者謂由損伏一切惡行及由正願能離憂惱寂天意謂初一勝利是通現後二世所獲勝利謂彼乃至住律儀中恆為諸佛菩薩護念如子如弟令彼善法增長無缺二四兩種專說現法勝利謂捨命時無惡趣怖覩見往生勝妙樂趣而大歡喜未捨命前亦能剎那剎那增長無量資糧如趣入菩薩行論云從始欲度脫無量有情界正受此心已睡眠或放逸而彼福德力相續不減退增長等虛空三五兩種是說餘生勝利謂於當來為善知識之所任持在在所生不失律儀云何因緣在在所生不失律儀如摩訶迦葉經云由能修學斷四黑法等為不忘失菩提心因四黑法者一謂若欺誑親教軌範尊長諸應供處二謂以引起悔愧意樂令他有情於其非所應悔愧處而生悔愧三謗說正趣大乘有情惡稱惡名惡譽惡聲四於有情所現行諂誑又三摩地大教王經云如人數思察由住彼分別如是心流注謂若數數相續作意自此以後能令內心如實流注諸有智者覩見如是無上勝利應於受持菩薩律儀發勤精進五釋戒所攝如是如上所說一切自性戒等九種尸羅當知三種淨戒所攝謂律儀戒攝善法戒饒益有情戒如是如上所說一切自性戒等九種尸羅當知皆由律儀戒等三戒所攝最勝子薩穆札並云如是九種一一尸羅皆由三種淨戒所攝六釋戒所作如是三種菩薩淨戒以要言之能為菩薩三所作事謂律儀戒能安住其心攝善法戒能成熟自佛法饒益有情戒能成熟有情如是總攝一切菩薩所應作事所謂欲令現法樂住安住其心身心無倦成熟佛法成熟有情如是菩薩唯有爾所菩薩淨戒唯有爾所淨戒勝利唯有爾所淨戒所作除此無有若過若增過去菩薩求大菩提已於中學未來菩薩求大菩提當於中學普於十方無邊無際諸世界中現在菩薩求大菩提今於中學云何淨戒定為三種答菩薩所作以要言之唯有三事一令現法中無雜染樂安住其心二依止住心能令成熟自內佛法三能令成熟有情相續如是三事要由律儀戒攝善法戒饒益有情戒三種淨戒而得成辦以是義故不由勤修止息惡行之律儀戒堪能役心善法所緣住善所緣即便迷失後二所依如前引攝決擇分所云於律儀戒應先愛護此依藏譯與前所引論文略異又本論說此律儀戒即是七衆別解脫戒故諸菩薩於先所受聖教根本別解脫戒當勤精進龍猛菩薩亦於此戒精懇教示如寶鬘論云復次出家者初當敬所學別解脫調伏多聞勤决擇是於此義二大法轍同一密意又於所餘二種淨戒先應勤修重於成熟自內佛法攝善法戒以契經說自未成熟能成熟他無有是處故唯有爾所菩薩淨戒謂有九種或有三種唯有爾所淨戒勝利謂有六種唯有爾所淨戒所作謂有三事一者現法樂住安住其心二者身心無倦成熟佛法三者成熟有情除此自性勝利所作三者而外更無過勝更無增上謂無不於此中攝故過去菩薩求大菩提已於中學未來菩薩求大菩提當於中學現在菩薩求大菩提今於中學是謂三世一切菩薩定如是學非謂一類菩薩應於中學或有一類得學所餘此名一切如理修學佛道菩薩純一趣道應於此道滅除異覺此為修學戒度方便是諸菩薩亦應了知修學餘五波羅密多及四攝事一切方便至心修學雖契經說修學戒時不能修學所餘學處不名有犯然一切種不應棄捨其所誓荷修學衆餘學處重擔
